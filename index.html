<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
  />
  <title>8th Wall 벽면 거리 측정 및 지정 위치 이미지 배치 AR</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: block;
    }

    #ui-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    #top-panel {
      padding: 20px;
      padding-top: calc(10px + env(safe-area-inset-top, 0));
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0));
    }

    #step-title {
      font-size: 18px;
      font-weight: 800;
      color: #00ff66;
      margin-bottom: 5px;
    }

    #guide-text {
      font-size: 14px;
      line-height: 1.4;
      opacity: 0.9;
    }

    #bottom-panel {
      padding: 15px;
      padding-bottom: calc(15px + env(safe-area-inset-bottom, 0));
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      pointer-events: auto;
      display: none;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      background: #007aff;
      cursor: pointer;
    }

    button.danger {
      background: #991b1b;
      flex: 0.4;
    }

    button:active {
      transform: scale(0.98);
    }

    #result {
      padding: 12px;
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      font-size: 15px;
      line-height: 1.5;
      text-align: center;
    }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 30px;
      height: 30px;
      transform: translate(-50%, -50%);
      z-index: 5;
      pointer-events: none;
      border: 2px solid #00ff66;
      border-radius: 50%;
    }

    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      background: #00ff66;
    }

    #crosshair::before {
      top: 50%;
      left: -5px;
      right: -5px;
      height: 2px;
      transform: translateY(-50%);
    }

    #crosshair::after {
      left: 50%;
      top: -5px;
      bottom: -5px;
      width: 2px;
      transform: translateX(-50%);
    }
  </style>

  <!-- 8th Wall Engine Binary: app key 필요 없음 -->
  <script
    async
    src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
    crossorigin="anonymous"
    data-preload-chunks="slam">
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js"
    crossorigin="anonymous">
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js"
    crossorigin="anonymous">
  </script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>

<body>
  <canvas id="camerafeed"></canvas>

  <div id="crosshair"></div>

  <div id="ui-layer">
    <div id="top-panel">
      <div id="step-title">AR 준비</div>
      <div id="guide-text">카메라와 공간 인식을 시작하세요.</div>
    </div>

    <div id="bottom-panel">
      <div id="result">주변 공간(벽과 바닥)을 천천히 비춰주세요.</div>
      <div class="row">
        <button id="action-btn">1단계: 벽/바닥선 확정</button>
        <button id="reset-btn" class="danger">초기화</button>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";

    window.THREE = THREE;

    const uiBottom = document.getElementById("bottom-panel");
    const stepTitle = document.getElementById("step-title");
    const guideText = document.getElementById("guide-text");
    const resultEl = document.getElementById("result");
    const actionBtn = document.getElementById("action-btn");
    const resetBtn = document.getElementById("reset-btn");
    const crosshair = document.getElementById("crosshair");

    let camera, scene, renderer;

    // WebXR 원본 변수명 최대한 유지
    let currentHitMatrix = null;

    // 단계: ready -> wallFloor -> toe -> placeImage -> done
    let step = "ready";

    let wallFloorMesh = null;
    let toeMesh = null;
    let lineMesh = null;
    let imagePlane = null;

    let lineProgress = 0;
    let isAnimatingLine = false;
    let savedDistanceText = "";

    // 이미지 스펙: 40cm * 50cm -> 0.4m * 0.5m
    const TARGET_IMAGE_WIDTH_M = 0.4;
    const TARGET_IMAGE_HEIGHT_M = 0.5;
    const IMAGE_URL = "https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=500";

    actionBtn.addEventListener("click", onActionTriggered);
    resetBtn.addEventListener("click", resetMeasurement);

    function setStep(nextStep) {
      step = nextStep;

      if (step === "wallFloor") {
        stepTitle.textContent = "1단계: 벽/바닥선";
        stepTitle.style.color = "#00d4ff";
        crosshair.style.borderColor = "#00d4ff";
        guideText.textContent = "벽면과 바닥이 만나는 모서리 지점을 조준점에 맞추고 버튼을 누르세요.";
        actionBtn.textContent = "벽/바닥선 확정";
        actionBtn.style.background = "#00d4ff";
        actionBtn.style.color = "#fff";

      } else if (step === "toe") {
        stepTitle.textContent = "2단계: 사용자의 발끝";
        stepTitle.style.color = "#ffe600";
        crosshair.style.borderColor = "#ffe600";
        guideText.textContent = "이제 한 걸음 물러선 대상의 발끝 지점을 조준점에 맞추고 버튼을 누르세요.";
        actionBtn.textContent = "발끝 확정";
        actionBtn.style.background = "#ffe600";
        actionBtn.style.color = "#000";

      } else if (step === "placeImage") {
        stepTitle.textContent = "3단계: 벽면 이미지 배치";
        stepTitle.style.color = "#ff00ff";
        crosshair.style.borderColor = "#ff00ff";
        guideText.textContent = "원하는 벽면 정면 위치를 바라보고 조준점을 맞춘 뒤 버튼을 눌러 이미지를 부착하세요.";
        actionBtn.textContent = "여기에 이미지 부착";
        actionBtn.style.background = "#ff00ff";
        actionBtn.style.color = "#fff";

      } else if (step === "done") {
        stepTitle.textContent = "모든 배치 완료";
        stepTitle.style.color = "#00ff66";
        crosshair.style.borderColor = "#fff";
        guideText.textContent = "줄자와 이미지가 고정되었습니다. 자유롭게 확인해 보세요.";
        actionBtn.textContent = "완료됨";
        actionBtn.style.background = "#374151";
        actionBtn.style.color = "#fff";
      }
    }

    function onActionTriggered() {
      if (!currentHitMatrix) {
        alert("공간 분석 대기 중입니다. 평평한 곳을 비춰주세요.");
        return;
      }

      const geometry = new THREE.SphereGeometry(0.02, 32, 32);

      if (step === "wallFloor") {
        const material = new THREE.MeshStandardMaterial({ color: 0x00d4ff });

        wallFloorMesh = new THREE.Mesh(geometry, material);
        wallFloorMesh.position.setFromMatrixPosition(
          new THREE.Matrix4().fromArray(currentHitMatrix)
        );
        wallFloorMesh.scale.set(0, 0, 0);

        scene.add(wallFloorMesh);

        resultEl.innerHTML = "벽/바닥 기준점 등록 완료!";
        setStep("toe");

      } else if (step === "toe") {
        const material = new THREE.MeshStandardMaterial({ color: 0xffe600 });

        toeMesh = new THREE.Mesh(geometry, material);
        toeMesh.position.setFromMatrixPosition(
          new THREE.Matrix4().fromArray(currentHitMatrix)
        );
        toeMesh.scale.set(0, 0, 0);

        scene.add(toeMesh);

        // 줄자 애니메이션 선 초기화
        const lineGeometry = new THREE.BufferGeometry();
        const lineMaterial = new THREE.LineBasicMaterial({
          color: 0x00ff66,
          linewidth: 5
        });

        lineMesh = new THREE.Line(lineGeometry, lineMaterial);
        scene.add(lineMesh);

        lineProgress = 0;
        isAnimatingLine = true;

        // 원본 WebXR 코드와 동일한 3D 거리 계산
        const distanceInMeters = wallFloorMesh.position.distanceTo(toeMesh.position);
        const distanceInCm = Math.round(distanceInMeters * 100);

        savedDistanceText =
          `<span style="font-size:1.2em; color:#ffe600; font-weight:bold;">` +
          `★ 벽 ↔ 발끝 거리: ${distanceInCm}cm` +
          `</span>`;

        resultEl.innerHTML =
          savedDistanceText +
          "<br><span style='color:#ff00ff;'>이제 벽면 정면에 이미지를 부착할 차례입니다.</span>";

        setStep("placeImage");

      } else if (step === "placeImage") {
        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin("anonymous");

        textureLoader.load(
          IMAGE_URL,
          (texture) => {
            if ("colorSpace" in texture && THREE.SRGBColorSpace) {
              texture.colorSpace = THREE.SRGBColorSpace;
            }

            const imageGeometry = new THREE.PlaneGeometry(
              TARGET_IMAGE_WIDTH_M,
              TARGET_IMAGE_HEIGHT_M
            );

            const imageMaterial = new THREE.MeshBasicMaterial({
              map: texture,
              side: THREE.DoubleSide
            });

            imagePlane = new THREE.Mesh(imageGeometry, imageMaterial);

            // 원본과 동일: 현재 조준점 hit matrix 위치에 이미지 배치
            imagePlane.position.setFromMatrixPosition(
              new THREE.Matrix4().fromArray(currentHitMatrix)
            );

            // 원본과 동일: Z-fighting 방지
            imagePlane.position.z += 0.01;

            // 원본과 동일: 이미지가 유저/카메라 정면을 바라보도록 회전
            imagePlane.lookAt(
              camera.position.x,
              imagePlane.position.y,
              camera.position.z
            );

            scene.add(imagePlane);

            resultEl.innerHTML =
              savedDistanceText +
              "<br><span style='color:#00ff66;'>선택한 벽면에 이미지 부착 완료!</span>";

            setStep("done");
          },
          undefined,
          () => {
            // 외부 이미지 로드 실패 시에도 테스트가 가능하도록 대체 텍스처 사용
            const fallbackTexture = createFallbackTexture();

            const imageGeometry = new THREE.PlaneGeometry(
              TARGET_IMAGE_WIDTH_M,
              TARGET_IMAGE_HEIGHT_M
            );

            const imageMaterial = new THREE.MeshBasicMaterial({
              map: fallbackTexture,
              side: THREE.DoubleSide
            });

            imagePlane = new THREE.Mesh(imageGeometry, imageMaterial);

            imagePlane.position.setFromMatrixPosition(
              new THREE.Matrix4().fromArray(currentHitMatrix)
            );

            imagePlane.position.z += 0.01;

            imagePlane.lookAt(
              camera.position.x,
              imagePlane.position.y,
              camera.position.z
            );

            scene.add(imagePlane);

            resultEl.innerHTML =
              savedDistanceText +
              "<br><span style='color:#00ff66;'>대체 이미지로 부착 완료!</span>";

            setStep("done");
          }
        );
      }
    }

    function resetMeasurement() {
      if (wallFloorMesh) {
        scene.remove(wallFloorMesh);
        wallFloorMesh = null;
      }

      if (toeMesh) {
        scene.remove(toeMesh);
        toeMesh = null;
      }

      if (lineMesh) {
        scene.remove(lineMesh);
        lineMesh = null;
      }

      if (imagePlane) {
        scene.remove(imagePlane);
        imagePlane = null;
      }

      isAnimatingLine = false;
      lineProgress = 0;
      savedDistanceText = "";
      currentHitMatrix = null;

      resultEl.textContent = "주변 공간(벽과 바닥)을 천천히 비춰주세요.";

      if (scene) {
        setStep("wallFloor");
      }
    }

    function updateAnimations() {
      if (wallFloorMesh && wallFloorMesh.scale.x < 1) {
        wallFloorMesh.scale.addScalar(0.08);
      }

      if (toeMesh && toeMesh.scale.x < 1) {
        toeMesh.scale.addScalar(0.08);
      }

      if (isAnimatingLine && wallFloorMesh && toeMesh && lineMesh) {
        lineProgress += 0.05;

        if (lineProgress >= 1) {
          lineProgress = 1;
          isAnimatingLine = false;
        }

        const currentLineEnd = new THREE.Vector3().lerpVectors(
          wallFloorMesh.position,
          toeMesh.position,
          lineProgress
        );

        lineMesh.geometry.setFromPoints([
          wallFloorMesh.position,
          currentLineEnd
        ]);
      }
    }

    function updateHitTest() {
      if (!window.XR8 || !XR8.XrController) return;

      const hitMatrix = get8thWallHitMatrix(0.5, 0.5);

      if (hitMatrix) {
        currentHitMatrix = hitMatrix;

        if (step !== "done" && step !== "placeImage") {
          resultEl.textContent = "공간 인식 성공! 확정 버튼을 누르세요.";
        } else if (step === "placeImage") {
          resultEl.innerHTML =
            savedDistanceText +
            "<br>벽면을 비추며 부착할 위치를 정하세요.";
        }

      } else {
        currentHitMatrix = null;

        if (step !== "done") {
          resultEl.textContent = "평면을 탐색 중입니다...";
        }
      }
    }

    function get8thWallHitMatrix(x, y) {
      let hitResults = [];

      try {
        hitResults = XR8.XrController.hitTest(x, y, ["FEATURE_POINT"]);
      } catch (error) {
        return null;
      }

      if (!hitResults || hitResults.length === 0) {
        return null;
      }

      const hit = hitResults[0];

      if (!hit || !hit.position) {
        return null;
      }

      const position = new THREE.Vector3(
        hit.position.x,
        hit.position.y,
        hit.position.z
      );

      const quaternion = hit.rotation
        ? new THREE.Quaternion(
            hit.rotation.x,
            hit.rotation.y,
            hit.rotation.z,
            hit.rotation.w
          )
        : new THREE.Quaternion();

      const scale = new THREE.Vector3(1, 1, 1);

      const matrix = new THREE.Matrix4();
      matrix.compose(position, quaternion, scale);

      return matrix.toArray();
    }

    function createFallbackTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 640;

      const ctx = canvas.getContext("2d");

      const gradient = ctx.createLinearGradient(0, 0, 512, 640);
      gradient.addColorStop(0, "#ff00ff");
      gradient.addColorStop(1, "#111827");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 512, 640);

      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.font = "bold 54px system-ui";
      ctx.fillText("IMAGE", 256, 300);

      ctx.font = "26px system-ui";
      ctx.fillText("40cm × 50cm", 256, 350);

      const texture = new THREE.CanvasTexture(canvas);

      if ("colorSpace" in texture && THREE.SRGBColorSpace) {
        texture.colorSpace = THREE.SRGBColorSpace;
      }

      return texture;
    }

    function initScenePipelineModule() {
      return {
        name: "webxr-style-wall-measurement-port",

        onStart: () => {
          const xrScene = XR8.Threejs.xrScene();

          scene = xrScene.scene;
          camera = xrScene.camera;
          renderer = xrScene.renderer;

          if (renderer) {
            renderer.setPixelRatio(window.devicePixelRatio || 1);

            if ("outputColorSpace" in renderer && THREE.SRGBColorSpace) {
              renderer.outputColorSpace = THREE.SRGBColorSpace;
            }
          }

          const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
          light.position.set(0.5, 1, 0.25);
          scene.add(light);

          XR8.XrController.updateCameraProjectionMatrix({
            origin: camera.position,
            facing: camera.quaternion
          });

          uiBottom.style.display = "block";
          resultEl.textContent = "주변 공간(벽과 바닥)을 천천히 비춰주세요.";

          setStep("wallFloor");
        },

        onUpdate: () => {
          if (!scene || !camera) return;

          updateAnimations();
          updateHitTest();
        }
      };
    }

    function onxrloaded() {
      XR8.XrController.configure({
        disableWorldTracking: false,
        enableWorldPoints: true,
        scale: "absolute"
      });

      const modules = [
        XR8.GlTextureRenderer.pipelineModule(),
        XR8.Threejs.pipelineModule(),
        XR8.XrController.pipelineModule()
      ];

      if (window.LandingPage && window.LandingPage.pipelineModule) {
        modules.push(window.LandingPage.pipelineModule());
      }

      if (window.XRExtras) {
        if (XRExtras.FullWindowCanvas) {
          modules.push(XRExtras.FullWindowCanvas.pipelineModule());
        }

        if (XRExtras.Loading) {
          modules.push(XRExtras.Loading.pipelineModule());
        }

        if (XRExtras.RuntimeError) {
          modules.push(XRExtras.RuntimeError.pipelineModule());
        }
      }

      modules.push(initScenePipelineModule());

      XR8.addCameraPipelineModules(modules);

      XR8.run({
        canvas: document.getElementById("camerafeed"),
        allowedDevices: XR8.XrConfig.device().ANY
      });
    }

    if (window.XR8) {
      onxrloaded();
    } else {
      window.addEventListener("xrloaded", onxrloaded);
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no"
  />
  <title>벽면 거리 측정 및 지정 위치 이미지 배치 AR · 8th Wall Stable</title>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }

    body { position: fixed; inset: 0; }

    #camerafeed,
    canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100dvh !important;
      display: block;
      z-index: 1;
      background: #000;
    }

    #ui-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    #top-panel {
      padding: 20px;
      padding-top: calc(10px + env(safe-area-inset-top, 0px));
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0));
    }

    #step-title {
      font-size: 18px;
      font-weight: 800;
      color: #00ff66;
      margin-bottom: 5px;
    }

    #guide-text {
      font-size: 14px;
      line-height: 1.4;
      opacity: 0.9;
    }

    #bottom-panel {
      padding: 15px;
      padding-bottom: calc(15px + env(safe-area-inset-bottom, 0px));
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      pointer-events: auto;
      display: none;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      background: #007aff;
      cursor: pointer;
    }

    button.danger { background: #991b1b; flex: 0.4; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.55; }

    #result {
      padding: 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      font-size: 15px;
      line-height: 1.5;
      text-align: center;
    }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 30px;
      height: 30px;
      transform: translate(-50%, -50%);
      z-index: 5;
      pointer-events: none;
      border: 2px solid #00ff66;
      border-radius: 50%;
      display: none;
    }

    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      background: currentColor;
      color: inherit;
    }

    #crosshair::before {
      top: 50%;
      left: -5px;
      right: -5px;
      height: 2px;
      transform: translateY(-50%);
    }

    #crosshair::after {
      left: 50%;
      top: -5px;
      bottom: -5px;
      width: 2px;
      transform: translateX(-50%);
    }

    #loading-cover {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #000;
      color: #fff;
      text-align: center;
      font-size: 16px;
      line-height: 1.45;
    }

    #loading-cover.hidden { display: none; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
    async
    crossorigin="anonymous"
    data-preload-chunks="slam">
  </script>
</head>

<body>
  <canvas id="camerafeed"></canvas>

  <div id="crosshair"></div>

  <div id="ui-layer">
    <div id="top-panel">
      <div id="step-title">AR 준비</div>
      <div id="guide-text">카메라 권한을 허용하고 주변 공간을 천천히 비춰주세요.</div>
    </div>

    <div id="bottom-panel">
      <div id="result">주변 공간(벽과 바닥)을 천천히 비춰주세요.</div>
      <div class="row">
        <button id="action-btn">1단계: 벽/바닥선 확정</button>
        <button id="reset-btn" class="danger">초기화</button>
      </div>
    </div>
  </div>

  <div id="loading-cover">8th Wall AR을 초기화하는 중입니다.<br />카메라 권한을 허용하세요.</div>

  <script>
    'use strict'

    const uiBottom = document.getElementById('bottom-panel')
    const stepTitle = document.getElementById('step-title')
    const guideText = document.getElementById('guide-text')
    const resultEl = document.getElementById('result')
    const actionBtn = document.getElementById('action-btn')
    const resetBtn = document.getElementById('reset-btn')
    const crosshair = document.getElementById('crosshair')
    const loadingCover = document.getElementById('loading-cover')
    const canvas = document.getElementById('camerafeed')

    let scene = null
    let camera = null
    let renderer = null

    let step = 'ready'
    let rawHit = null
    let stableHit = null
    let hitBuffer = []

    let wallFloorPoint = null
    let toePoint = null
    let wallFloorMesh = null
    let toeMesh = null
    let lineMesh = null
    let imagePlane = null

    let savedDistanceText = ''
    let arReady = false
    let hasCameraStream = false
    let lastUiUpdateAt = 0

    const TARGET_IMAGE_WIDTH_M = 0.4
    const TARGET_IMAGE_HEIGHT_M = 0.5
    const IMAGE_URL = 'https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=500'

    // 8th Wall hitTest는 단일 프레임의 feature-point 추정값이라 튈 수 있다.
    // 아래 값은 UX가 너무 느려지지 않으면서 임의 feature 선택을 줄이기 위한 경험적 값이다.
    const STABLE_SAMPLE_COUNT = 8
    const STABLE_MAX_SPREAD_M = 0.09
    const HIT_SAMPLE_OFFSETS = [
      [0, 0],
      [-0.012, 0], [0.012, 0],
      [0, -0.012], [0, 0.012],
    ]

    function setStep(nextStep) {
      step = nextStep
      resetHitStabilizer()

      if (step === 'wallFloor') {
        stepTitle.textContent = '1단계: 벽/바닥선'
        stepTitle.style.color = '#00d4ff'
        crosshair.style.borderColor = '#00d4ff'
        crosshair.style.color = '#00d4ff'
        guideText.textContent = '벽면과 바닥이 만나는 모서리 지점을 조준점에 맞추고, 표시가 안정되면 버튼을 누르세요.'
        actionBtn.textContent = '벽/바닥선 확정'
        actionBtn.style.background = '#00d4ff'
        actionBtn.style.color = '#fff'
        actionBtn.disabled = true
      } else if (step === 'toe') {
        stepTitle.textContent = '2단계: 사용자의 발끝'
        stepTitle.style.color = '#ffe600'
        crosshair.style.borderColor = '#ffe600'
        crosshair.style.color = '#ffe600'
        guideText.textContent = '발끝 바닥점을 조준점에 맞추고, 표시가 안정되면 버튼을 누르세요. 높이값은 1단계 바닥 높이로 고정합니다.'
        actionBtn.textContent = '발끝 확정'
        actionBtn.style.background = '#ffe600'
        actionBtn.style.color = '#000'
        actionBtn.disabled = true
      } else if (step === 'placeImage') {
        stepTitle.textContent = '3단계: 벽면 이미지 배치'
        stepTitle.style.color = '#ff00ff'
        crosshair.style.borderColor = '#ff00ff'
        crosshair.style.color = '#ff00ff'
        guideText.textContent = '원하는 벽면 높이를 정면으로 바라보고 버튼을 누르세요. 이 단계에서는 hit-test를 사용하지 않습니다.'
        actionBtn.textContent = '여기에 이미지 부착'
        actionBtn.style.background = '#ff00ff'
        actionBtn.style.color = '#fff'
        actionBtn.disabled = false
      } else if (step === 'done') {
        stepTitle.textContent = '모든 배치 완료'
        stepTitle.style.color = '#00ff66'
        crosshair.style.borderColor = '#fff'
        crosshair.style.color = '#fff'
        guideText.textContent = '줄자와 이미지가 고정되었습니다. 자유롭게 확인해 보세요.'
        actionBtn.textContent = '완료됨'
        actionBtn.style.background = '#374151'
        actionBtn.style.color = '#fff'
        actionBtn.disabled = true
      }
    }

    function resetHitStabilizer() {
      rawHit = null
      stableHit = null
      hitBuffer = []
    }

    function showRuntimeError(message) {
      loadingCover.classList.remove('hidden')
      loadingCover.innerHTML = `<strong>실행 오류</strong><br>${escapeHtml(message)}`
      stepTitle.textContent = '오류'
      stepTitle.style.color = '#ff5b5b'
      guideText.textContent = message
      actionBtn.disabled = true
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;')
    }

    function makeMarker(color) {
      const geometry = new THREE.SphereGeometry(0.025, 32, 32)
      const material = new THREE.MeshStandardMaterial({ color })
      return new THREE.Mesh(geometry, material)
    }

    function disposeObject(object) {
      if (!object) return
      if (object.parent) object.parent.remove(object)
      if (object.geometry) object.geometry.dispose()
      if (object.material) {
        if (object.material.map) object.material.map.dispose()
        object.material.dispose()
      }
    }

    function bestSingleHitAt(x, y) {
      if (!window.XR8 || !XR8.XrController || !arReady) return null

      try {
        const results = XR8.XrController.hitTest(x, y, ['FEATURE_POINT']) || []
        const usable = results
          .filter(r => r && r.position)
          .filter(r => !Number.isFinite(r.distance) || (r.distance > 0.08 && r.distance < 7.0))

        if (!usable.length) return null

        // 너무 가까운 floating feature보다 조준점 근처의 대표 추정값을 사용한다.
        // 여러 개면 distance가 있는 것 중 가장 가까운 값을 우선하되, 이후 프레임 안정화에서 한 번 더 걸러진다.
        usable.sort((a, b) => {
          const da = Number.isFinite(a.distance) ? a.distance : Infinity
          const db = Number.isFinite(b.distance) ? b.distance : Infinity
          return da - db
        })

        const first = usable[0]
        return {
          position: new THREE.Vector3(first.position.x, first.position.y, first.position.z),
          distance: Number.isFinite(first.distance) ? first.distance : null,
          type: first.type || 'UNKNOWN',
        }
      } catch (error) {
        return null
      }
    }

    function getMedian(values) {
      const sorted = values.slice().sort((a, b) => a - b)
      return sorted[Math.floor(sorted.length / 2)]
    }

    function sampleCenterHit() {
      const candidates = []

      for (const [dx, dy] of HIT_SAMPLE_OFFSETS) {
        const hit = bestSingleHitAt(0.5 + dx, 0.5 + dy)
        if (hit) candidates.push(hit)
      }

      if (!candidates.length) return null

      // 주변 5개 샘플의 median을 써서 프레임 단위 튐을 줄인다.
      const median = new THREE.Vector3(
        getMedian(candidates.map(h => h.position.x)),
        getMedian(candidates.map(h => h.position.y)),
        getMedian(candidates.map(h => h.position.z))
      )

      const centerHit = candidates[0]
      return {
        position: median,
        distance: centerHit.distance,
        type: centerHit.type,
      }
    }

    function updateStableHit() {
      if (step !== 'wallFloor' && step !== 'toe') return

      rawHit = sampleCenterHit()
      if (!rawHit) {
        stableHit = null
        hitBuffer = []
        actionBtn.disabled = true
        return
      }

      hitBuffer.push(rawHit.position.clone())
      if (hitBuffer.length > STABLE_SAMPLE_COUNT) hitBuffer.shift()

      if (hitBuffer.length < STABLE_SAMPLE_COUNT) {
        stableHit = null
        actionBtn.disabled = true
        return
      }

      const mean = new THREE.Vector3()
      for (const p of hitBuffer) mean.add(p)
      mean.multiplyScalar(1 / hitBuffer.length)

      let maxSpread = 0
      for (const p of hitBuffer) {
        maxSpread = Math.max(maxSpread, p.distanceTo(mean))
      }

      if (maxSpread <= STABLE_MAX_SPREAD_M) {
        stableHit = {
          position: mean.clone(),
          spread: maxSpread,
          type: rawHit.type,
          distance: rawHit.distance,
        }
        actionBtn.disabled = false
      } else {
        stableHit = null
        actionBtn.disabled = true
      }
    }

    function onActionTriggered() {
      if (step === 'wallFloor') {
        if (!stableHit) return

        wallFloorPoint = stableHit.position.clone()

        disposeObject(wallFloorMesh)
        wallFloorMesh = makeMarker(0x00d4ff)
        wallFloorMesh.position.copy(wallFloorPoint)
        scene.add(wallFloorMesh)

        resultEl.innerHTML = '벽/바닥 기준점 등록 완료!'
        setStep('toe')
        return
      }

      if (step === 'toe') {
        if (!stableHit || !wallFloorPoint) return

        // 발끝도 바닥 위 점이어야 하므로, Y는 1단계 기준점의 바닥 높이로 강제 고정한다.
        // 8th Wall feature-point y 튐이 거리 계산에 섞이는 것을 막기 위함이다.
        toePoint = stableHit.position.clone()
        toePoint.y = wallFloorPoint.y

        disposeObject(toeMesh)
        toeMesh = makeMarker(0xffe600)
        toeMesh.position.copy(toePoint)
        scene.add(toeMesh)

        disposeObject(lineMesh)
        const lineGeometry = new THREE.BufferGeometry().setFromPoints([wallFloorPoint, toePoint])
        const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00ff66 })
        lineMesh = new THREE.Line(lineGeometry, lineMaterial)
        scene.add(lineMesh)

        const dx = toePoint.x - wallFloorPoint.x
        const dz = toePoint.z - wallFloorPoint.z
        const distanceInMeters = Math.sqrt(dx * dx + dz * dz)
        const distanceInCm = Math.round(distanceInMeters * 100)
        savedDistanceText = `<span style="font-size:1.2em; color:#ffe600; font-weight:bold;">★ 벽 ↔ 발끝 거리: ${distanceInCm}cm</span>`

        resultEl.innerHTML = savedDistanceText + '<br><span style="color:#ff00ff;">원하는 벽면 높이(정면)를 바라보고 버튼을 누르세요!</span>'
        setStep('placeImage')
        return
      }

      if (step === 'placeImage') {
        placeImageLikeWebXR()
      }
    }

    function makeFallbackTexture() {
      const w = 800
      const h = 1000
      const c = document.createElement('canvas')
      c.width = w
      c.height = h
      const ctx = c.getContext('2d')

      ctx.fillStyle = '#f4efe6'
      ctx.fillRect(0, 0, w, h)
      ctx.fillStyle = '#1f1a15'
      ctx.fillRect(0, 0, w, 34)
      ctx.fillRect(0, h - 34, w, 34)
      ctx.fillRect(0, 0, 34, h)
      ctx.fillRect(w - 34, 0, 34, h)
      ctx.strokeStyle = '#a47a3d'
      ctx.lineWidth = 10
      ctx.strokeRect(70, 70, w - 140, h - 140)
      ctx.fillStyle = '#1f1a15'
      ctx.textAlign = 'center'
      ctx.textBaseline = 'middle'
      ctx.font = 'bold 72px system-ui, sans-serif'
      ctx.fillText('WALL ART', w / 2, h / 2 - 35)
      ctx.font = '36px system-ui, sans-serif'
      ctx.fillText('8th Wall', w / 2, h / 2 + 45)

      const texture = new THREE.CanvasTexture(c)
      texture.colorSpace = THREE.SRGBColorSpace
      return texture
    }

    function loadArtworkTexture() {
      return new Promise((resolve) => {
        const loader = new THREE.TextureLoader()
        loader.setCrossOrigin('anonymous')
        loader.load(
          IMAGE_URL,
          (texture) => {
            texture.colorSpace = THREE.SRGBColorSpace
            resolve(texture)
          },
          undefined,
          () => resolve(makeFallbackTexture())
        )
      })
    }

    async function placeImageLikeWebXR() {
      if (!wallFloorPoint || !camera || !scene) {
        resultEl.innerHTML = '<span style="color:#ffcc00; font-weight:800;">벽/바닥 기준점이 없습니다. 초기화 후 다시 시도하세요.</span>'
        return
      }

      actionBtn.disabled = true
      const texture = await loadArtworkTexture()

      disposeObject(imagePlane)

      const imageGeometry = new THREE.PlaneGeometry(TARGET_IMAGE_WIDTH_M, TARGET_IMAGE_HEIGHT_M)
      const imageMaterial = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide })
      imagePlane = new THREE.Mesh(imageGeometry, imageMaterial)

      // 원본 WebXR 방식 유지:
      // X/Z는 1단계 기준점, Y는 현재 카메라 높이.
      // 단, mesh.position이 아니라 freeze된 wallFloorPoint clone을 사용해서 마커/라인 변경의 영향을 받지 않게 한다.
      imagePlane.position.copy(wallFloorPoint)
      imagePlane.position.y = camera.position.y

      const forward = new THREE.Vector3()
      camera.getWorldDirection(forward)
      forward.y = 0
      if (forward.lengthSq() > 0.000001) {
        forward.normalize()
        imagePlane.position.addScaledVector(forward, -0.01)
      }

      imagePlane.lookAt(camera.position.x, imagePlane.position.y, camera.position.z)
      scene.add(imagePlane)

      resultEl.innerHTML = savedDistanceText + '<br><span style="color:#00ff66;">가상 수직 평면에 이미지 배치 완료!</span>'
      setStep('done')
    }

    function resetMeasurement() {
      disposeObject(wallFloorMesh)
      disposeObject(toeMesh)
      disposeObject(lineMesh)
      disposeObject(imagePlane)

      wallFloorPoint = null
      toePoint = null
      wallFloorMesh = null
      toeMesh = null
      lineMesh = null
      imagePlane = null
      savedDistanceText = ''
      resetHitStabilizer()

      resultEl.textContent = '주변 공간(벽과 바닥)을 천천히 비춰주세요.'
      if (arReady) setStep('wallFloor')
    }

    function resizeCanvasToViewport() {
      // 8th Wall/Threejs pipeline과 충돌을 줄이기 위해 innerWidth/innerHeight 기준만 사용한다.
      const width = window.innerWidth
      const height = window.innerHeight

      if (renderer && camera) {
        renderer.setSize(width, height, false)
        camera.aspect = width / height
        camera.updateProjectionMatrix()
      }
    }

    function initThreeScene() {
      const xrScene = XR8.Threejs.xrScene()
      scene = xrScene.scene
      camera = xrScene.camera
      renderer = xrScene.renderer

      if (renderer) renderer.outputColorSpace = THREE.SRGBColorSpace

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3)
      light.position.set(0.5, 1, 0.25)
      scene.add(light)

      arReady = true
      loadingCover.classList.add('hidden')
      crosshair.style.display = 'block'
      uiBottom.style.display = 'block'
      setStep('wallFloor')
      resizeCanvasToViewport()
    }

    function updateLoop() {
      if (!arReady) return

      updateStableHit()

      const now = performance.now()
      if (now - lastUiUpdateAt < 120) return
      lastUiUpdateAt = now

      if (step === 'wallFloor' || step === 'toe') {
        if (stableHit) {
          resultEl.innerHTML = `공간 인식 안정됨! 확정 버튼을 누르세요.<br><span style="font-size:0.9em; opacity:0.8;">안정도 ±${Math.round(stableHit.spread * 100)}cm · ${stableHit.type}</span>`
        } else if (rawHit) {
          resultEl.textContent = '공간 인식 중... 조준점을 잠시 고정하세요.'
        } else {
          resultEl.textContent = '평면/특징점을 탐색 중입니다...'
        }
      } else if (step === 'placeImage') {
        resultEl.innerHTML = savedDistanceText + '<br><span style="color:#ff00ff;">원하는 벽면 높이(정면)를 바라보고 버튼을 누르세요!</span>'
      }
    }

    function wallArtPipelineModule() {
      return {
        name: 'wall-art-webxr-style-stable',
        onStart: initThreeScene,
        onUpdate: updateLoop,
        onCameraStatusChange: ({status}) => {
          if (status === 'requesting') {
            loadingCover.classList.remove('hidden')
            loadingCover.innerHTML = '카메라 권한을 요청 중입니다.'
          } else if (status === 'hasStream') {
            hasCameraStream = true
          } else if (status === 'failed') {
            showRuntimeError('카메라를 열 수 없습니다. HTTPS 환경인지, 브라우저 카메라 권한이 허용되어 있는지 확인하세요.')
          }
        },
        onException: (error) => {
          showRuntimeError(error && error.message ? error.message : String(error))
        },
      }
    }

    function startXR() {
      if (!window.XR8 || !window.THREE) {
        showRuntimeError('8th Wall 또는 Three.js가 아직 로드되지 않았습니다. 네트워크 상태를 확인하세요.')
        return
      }

      try {
        XR8.XrController.configure({
          disableWorldTracking: false,
          scale: 'absolute',
          enableWorldPoints: true,
        })

        XR8.addCameraPipelineModules([
          XR8.GlTextureRenderer.pipelineModule(),
          XR8.Threejs.pipelineModule(),
          XR8.XrController.pipelineModule(),
          wallArtPipelineModule(),
        ])

        XR8.run({
          canvas,
          allowedDevices: XR8.XrConfig.device().ANY,
        })
      } catch (error) {
        showRuntimeError(error && error.message ? error.message : String(error))
      }
    }

    actionBtn.addEventListener('click', onActionTriggered)
    resetBtn.addEventListener('click', resetMeasurement)
    window.addEventListener('resize', resizeCanvasToViewport)
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvasToViewport, 250))
    document.addEventListener('touchmove', event => event.preventDefault(), {passive: false})
    document.addEventListener('gesturestart', event => event.preventDefault())

    window.addEventListener('xrloaded', startXR)
    if (window.XR8) startXR()
  </script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>8th Wall Wall-Art Prototype</title>

  <!--
    Wall-Art WebAR Prototype
    Flow: 벽-바닥 선 2개 탭 → 벽면 평면 생성 → 벽 조준/탭 → 이미지 배치

    실행 조건:
    - 모바일 브라우저 권장
    - HTTPS에서 실행 필요: GitHub Pages, Netlify, Vercel, ngrok 등
    - 8th Wall XR Engine Binary + Three.js CDN 사용

    This product includes the XR Engine software developed by Niantic Spatial, Inc.
    Copyright © 2026 Niantic Spatial, Inc. All rights reserved.
    License: https://github.com/8thwall/engine/blob/main/LICENSE
  -->

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>

  <style>
    :root {
      --panel: rgba(12, 14, 22, 0.74);
      --panel-strong: rgba(12, 14, 22, 0.90);
      --text: #fff;
      --muted: rgba(255,255,255,0.76);
      --accent: #69e7b9;
      --warn: #ffd66b;
      --danger: #ff7373;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      touch-action: none;
    }

    #camerafeed {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      touch-action: none;
    }

    .ui {
      position: fixed;
      z-index: 10;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
    }

    #topPanel {
      top: env(safe-area-inset-top, 0px);
      left: 0;
      right: 0;
      padding: 12px 14px 10px;
      background: linear-gradient(to bottom, var(--panel-strong), rgba(12,14,22,0.20));
    }

    #title {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.2px;
      margin-bottom: 4px;
    }

    #guide {
      font-size: 13px;
      line-height: 1.38;
      color: var(--muted);
    }

    #guide b { color: var(--accent); }

    #centerReticle {
      left: 50%;
      top: 50%;
      width: 42px;
      height: 42px;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255,255,255,0.92);
      border-radius: 999px;
      pointer-events: none;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(0,0,0,0.28);
    }

    #centerReticle::before, #centerReticle::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.92);
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
    }
    #centerReticle::before { width: 18px; height: 2px; }
    #centerReticle::after { width: 2px; height: 18px; }

    #bottomPanel {
      left: 10px;
      right: 10px;
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      border-radius: 18px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.34);
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .row + .row { margin-top: 8px; }

    button, label.fileLabel {
      border: 0;
      border-radius: 999px;
      padding: 9px 12px;
      background: rgba(255,255,255,0.14);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    button.primary {
      background: var(--accent);
      color: #07120e;
    }

    button.warn {
      background: rgba(255,214,107,0.18);
      color: #ffe29a;
    }

    button:active, label.fileLabel:active { transform: translateY(1px); }
    button:disabled { opacity: 0.45; }

    input[type="file"] { display: none; }

    input[type="number"] {
      width: 72px;
      border: 0;
      outline: 0;
      border-radius: 999px;
      padding: 9px 10px;
      background: rgba(255,255,255,0.14);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
      margin-left: 2px;
    }

    #readout {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
      min-height: 32px;
    }

    .pill {
      display: inline-block;
      padding: 3px 8px;
      margin-right: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,0.12);
      color: var(--muted);
    }

    #errorBox {
      display: none;
      top: 50%;
      left: 18px;
      right: 18px;
      transform: translateY(-50%);
      border-radius: 20px;
      padding: 18px;
      background: rgba(40, 10, 14, 0.92);
      color: #fff;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    #errorBox h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    #errorText {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
      color: rgba(255,255,255,0.82);
    }
  </style>
</head>
<body>
  <canvas id="camerafeed"></canvas>

  <div id="topPanel" class="ui">
    <div id="title">벽면 액자 배치 프로토타입</div>
    <div id="guide">초기화 중입니다. 카메라 권한을 허용하세요.</div>
  </div>

  <div id="centerReticle" class="ui" aria-hidden="true"></div>

  <div id="bottomPanel" class="ui">
    <div class="row">
      <button id="placeCenterBtn" class="primary" disabled>중앙에 배치</button>
      <button id="undoBtn" class="warn">되돌리기</button>
      <button id="resetBtn">초기화</button>
      <label class="fileLabel" for="imageInput">이미지 선택</label>
      <input id="imageInput" type="file" accept="image/*" />
    </div>
    <div class="row">
      <span class="label">가로폭(cm)</span>
      <input id="widthCm" type="number" min="10" max="300" step="5" value="80" />
      <span class="label">1) 벽-바닥 선 왼쪽 탭 → 2) 오른쪽 탭 → 3) 벽 위 배치 지점 탭</span>
    </div>
    <div id="readout" class="row"></div>
  </div>

  <div id="errorBox" class="ui">
    <h2>실행할 수 없습니다</h2>
    <p id="errorText"></p>
  </div>

  <script>
    'use strict'

    const els = {
      canvas: document.getElementById('camerafeed'),
      guide: document.getElementById('guide'),
      readout: document.getElementById('readout'),
      placeCenterBtn: document.getElementById('placeCenterBtn'),
      undoBtn: document.getElementById('undoBtn'),
      resetBtn: document.getElementById('resetBtn'),
      imageInput: document.getElementById('imageInput'),
      widthCm: document.getElementById('widthCm'),
      errorBox: document.getElementById('errorBox'),
      errorText: document.getElementById('errorText'),
    }

    const app = {
      xrReady: false,
      scene: null,
      camera: null,
      renderer: null,
      state: 'SEAM_1',
      seamPoints: [],
      seamMarkers: [],
      seamLine: null,
      wallPlane: null,
      wallNormal: null,
      wallDir: null,
      wallPreview: null,
      pictureMesh: null,
      texture: null,
      imageAspect: 4 / 3,
      lastPlacement: null,
      started: false,
      lastReadoutAt: 0,
      raycaster: new THREE.Raycaster(),
      up: new THREE.Vector3(0, 1, 0),
    }

    function showError(message) {
      els.errorText.textContent = message
      els.errorBox.style.display = 'block'
      els.guide.innerHTML = '<b>오류:</b> ' + message
    }

    function setGuide(html) {
      els.guide.innerHTML = html
    }

    function updateGuide() {
      if (!app.xrReady) {
        setGuide('초기화 중입니다. 카메라 권한을 허용하세요.')
        return
      }
      if (app.state === 'SEAM_1') {
        setGuide('<b>1/3</b> 벽과 바닥이 만나는 선의 <b>왼쪽 지점</b>을 탭하세요. 먼저 휴대폰을 좌우로 천천히 움직이면 추적이 안정됩니다.')
      } else if (app.state === 'SEAM_2') {
        setGuide('<b>2/3</b> 같은 벽-바닥 선의 <b>오른쪽 지점</b>을 탭하세요. 두 점은 50cm 이상 떨어질수록 좋습니다.')
      } else if (app.state === 'PLACE') {
        setGuide('<b>3/3</b> 벽의 원하는 위치를 탭하거나, 화면 중앙 십자선을 맞춘 뒤 <b>중앙에 배치</b>를 누르세요.')
      }
      els.placeCenterBtn.disabled = app.state !== 'PLACE'
    }

    function setReadout(extra = '') {
      let text = ''
      if (app.wallPlane && app.camera) {
        const d = Math.abs(app.wallPlane.distanceToPoint(app.camera.position))
        text += `<span class="pill">벽까지 약 ${d.toFixed(2)}m</span>`
      }
      if (app.lastPlacement) {
        text += `<span class="pill">이미지 중심 높이 ${app.lastPlacement.height.toFixed(2)}m</span>`
        text += `<span class="pill">가로 ${app.lastPlacement.width.toFixed(2)}m</span>`
      }
      if (extra) text += `<span class="pill">${extra}</span>`
      els.readout.innerHTML = text || '<span class="pill">대기 중</span>'
    }

    function vec3FromObj(p) {
      return new THREE.Vector3(p.x, p.y, p.z)
    }

    function normalizedScreenPoint(clientX, clientY) {
      const rect = els.canvas.getBoundingClientRect()
      const x = THREE.MathUtils.clamp((clientX - rect.left) / rect.width, 0, 1)
      const y = THREE.MathUtils.clamp((clientY - rect.top) / rect.height, 0, 1)
      return {x, y}
    }

    function getHitPoint(clientX, clientY) {
      const {x, y} = normalizedScreenPoint(clientX, clientY)
      const results = XR8.XrController.hitTest(x, y, ['FEATURE_POINT'])
      if (!results || results.length === 0) return null

      // 가까운 후보를 우선 선택하되, distance가 없으면 첫 번째 후보를 사용한다.
      const sorted = results.slice().sort((a, b) => {
        const da = Number.isFinite(a.distance) ? a.distance : Infinity
        const db = Number.isFinite(b.distance) ? b.distance : Infinity
        return da - db
      })
      return vec3FromObj(sorted[0].position)
    }

    function createMarker(position, color = 0x69e7b9) {
      const geometry = new THREE.SphereGeometry(0.035, 18, 18)
      const material = new THREE.MeshBasicMaterial({color})
      const marker = new THREE.Mesh(geometry, material)
      marker.position.copy(position)
      app.scene.add(marker)
      return marker
    }

    function updateSeamLine() {
      if (app.seamLine) {
        app.scene.remove(app.seamLine)
        app.seamLine.geometry.dispose()
        app.seamLine.material.dispose()
        app.seamLine = null
      }

      if (app.seamPoints.length < 2) return
      const geometry = new THREE.BufferGeometry().setFromPoints(app.seamPoints)
      const material = new THREE.LineBasicMaterial({color: 0x69e7b9, linewidth: 2})
      app.seamLine = new THREE.Line(geometry, material)
      app.scene.add(app.seamLine)
    }

    function makePlaceholderTexture() {
      const size = 1024
      const canvas = document.createElement('canvas')
      canvas.width = size
      canvas.height = Math.round(size * 0.75)
      const ctx = canvas.getContext('2d')
      const w = canvas.width
      const h = canvas.height

      ctx.fillStyle = '#f4efe6'
      ctx.fillRect(0, 0, w, h)
      ctx.fillStyle = '#222'
      ctx.fillRect(0, 0, w, 22)
      ctx.fillRect(0, h - 22, w, 22)
      ctx.fillRect(0, 0, 22, h)
      ctx.fillRect(w - 22, 0, 22, h)
      ctx.strokeStyle = '#8b6f47'
      ctx.lineWidth = 8
      ctx.strokeRect(44, 44, w - 88, h - 88)
      ctx.fillStyle = '#222'
      ctx.font = 'bold 54px sans-serif'
      ctx.textAlign = 'center'
      ctx.textBaseline = 'middle'
      ctx.fillText('WALL ART', w / 2, h / 2 - 20)
      ctx.font = '32px sans-serif'
      ctx.fillText('이미지를 선택할 수 있습니다', w / 2, h / 2 + 44)

      const texture = new THREE.CanvasTexture(canvas)
      texture.colorSpace = THREE.SRGBColorSpace
      app.imageAspect = w / h
      return texture
    }

    function buildWallPlane() {
      if (app.seamPoints.length < 2) return false

      const p1 = app.seamPoints[0].clone()
      const p2 = app.seamPoints[1].clone()
      const mid = p1.clone().add(p2).multiplyScalar(0.5)

      // 벽-바닥 선은 수평선이어야 하므로 y 오차를 제거한다.
      const wallDir = p2.clone().sub(p1)
      wallDir.y = 0
      if (wallDir.length() < 0.25) {
        setReadout('두 점이 너무 가깝습니다')
        return false
      }
      wallDir.normalize()

      // 수직 벽면 normal. normal이 현재 카메라 쪽을 향하도록 방향을 맞춘다.
      const normal = new THREE.Vector3().crossVectors(wallDir, app.up).normalize()
      if (app.camera && normal.dot(app.camera.position.clone().sub(mid)) < 0) {
        normal.negate()
      }

      app.wallDir = wallDir
      app.wallNormal = normal
      app.wallPlane = new THREE.Plane().setFromNormalAndCoplanarPoint(normal, p1)

      createWallPreview(p1, p2, wallDir, normal)
      app.state = 'PLACE'
      updateGuide()
      setReadout('벽면 평면 생성 완료')
      return true
    }

    function createWallPreview(p1, p2, wallDir, normal) {
      if (app.wallPreview) {
        app.scene.remove(app.wallPreview)
        app.wallPreview.geometry.dispose()
        app.wallPreview.material.dispose()
        app.wallPreview = null
      }

      const seamWidth = p1.distanceTo(p2)
      const previewWidth = THREE.MathUtils.clamp(seamWidth, 0.6, 3.0)
      const previewHeight = 1.8
      const baseMid = p1.clone().add(p2).multiplyScalar(0.5)
      const center = baseMid.clone().add(app.up.clone().multiplyScalar(previewHeight * 0.5))
      center.add(normal.clone().multiplyScalar(0.006))

      const geometry = new THREE.PlaneGeometry(previewWidth, previewHeight)
      const material = new THREE.MeshBasicMaterial({
        color: 0x69e7b9,
        transparent: true,
        opacity: 0.18,
        side: THREE.DoubleSide,
        depthWrite: false,
      })

      const mesh = new THREE.Mesh(geometry, material)
      mesh.position.copy(center)
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal)
      app.scene.add(mesh)
      app.wallPreview = mesh
    }

    function getRayPlaneIntersection(clientX, clientY) {
      if (!app.wallPlane || !app.camera) return null
      const {x, y} = normalizedScreenPoint(clientX, clientY)
      const ndc = new THREE.Vector2(x * 2 - 1, -(y * 2 - 1))
      app.raycaster.setFromCamera(ndc, app.camera)

      const ray = app.raycaster.ray
      const denom = app.wallPlane.normal.dot(ray.direction)
      if (Math.abs(denom) < 1e-5) return null

      const t = -(ray.origin.dot(app.wallPlane.normal) + app.wallPlane.constant) / denom
      if (t < 0.05) return null
      return ray.origin.clone().add(ray.direction.clone().multiplyScalar(t))
    }

    function placePictureAt(point) {
      if (!app.wallPlane || !app.wallNormal) return

      const width = THREE.MathUtils.clamp(Number(els.widthCm.value || 80) / 100, 0.1, 3.0)
      const height = width / app.imageAspect
      const texture = app.texture || makePlaceholderTexture()
      app.texture = texture

      if (app.pictureMesh) {
        app.scene.remove(app.pictureMesh)
        app.pictureMesh.geometry.dispose()
        app.pictureMesh.material.dispose()
        app.pictureMesh = null
      }

      const geometry = new THREE.PlaneGeometry(width, height)
      const material = new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.FrontSide,
        transparent: true,
      })

      const mesh = new THREE.Mesh(geometry, material)
      const p = point.clone().add(app.wallNormal.clone().multiplyScalar(0.012))
      mesh.position.copy(p)
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), app.wallNormal)
      app.scene.add(mesh)
      app.pictureMesh = mesh

      const baseY = (app.seamPoints[0].y + app.seamPoints[1].y) / 2
      app.lastPlacement = {
        point: p.clone(),
        height: p.y - baseY,
        width,
      }
      setReadout('이미지 배치 완료')
    }

    function handleWorldTap(clientX, clientY) {
      if (!app.xrReady) return

      if (app.state === 'SEAM_1' || app.state === 'SEAM_2') {
        const p = getHitPoint(clientX, clientY)
        if (!p) {
          setReadout('hitTest 실패: 휴대폰을 천천히 움직인 뒤 다시 탭')
          return
        }

        app.seamPoints.push(p)
        const marker = createMarker(p, app.state === 'SEAM_1' ? 0x69e7b9 : 0xffd66b)
        app.seamMarkers.push(marker)
        updateSeamLine()

        if (app.state === 'SEAM_1') {
          app.state = 'SEAM_2'
          updateGuide()
          setReadout('첫 번째 점 저장')
        } else {
          if (!buildWallPlane()) {
            // 두 번째 점이 부적절하면 제거하고 다시 받는다.
            const removed = app.seamPoints.pop()
            const m = app.seamMarkers.pop()
            app.scene.remove(m)
            m.geometry.dispose()
            m.material.dispose()
            updateSeamLine()
            app.state = 'SEAM_2'
            updateGuide()
          }
        }
        return
      }

      if (app.state === 'PLACE') {
        const p = getRayPlaneIntersection(clientX, clientY)
        if (!p) {
          setReadout('벽면과 광선 교차 실패: 벽을 더 정면으로 조준')
          return
        }
        placePictureAt(p)
      }
    }

    function resetAll() {
      if (!app.scene) return

      for (const m of app.seamMarkers) {
        app.scene.remove(m)
        m.geometry.dispose()
        m.material.dispose()
      }
      app.seamMarkers = []
      app.seamPoints = []

      for (const objKey of ['seamLine', 'wallPreview', 'pictureMesh']) {
        const obj = app[objKey]
        if (obj) {
          app.scene.remove(obj)
          if (obj.geometry) obj.geometry.dispose()
          if (obj.material) obj.material.dispose()
          app[objKey] = null
        }
      }

      app.wallPlane = null
      app.wallNormal = null
      app.wallDir = null
      app.lastPlacement = null
      app.state = 'SEAM_1'
      updateGuide()
      setReadout('초기화 완료')
    }

    function undo() {
      if (!app.scene) return

      if (app.pictureMesh) {
        app.scene.remove(app.pictureMesh)
        app.pictureMesh.geometry.dispose()
        app.pictureMesh.material.dispose()
        app.pictureMesh = null
        app.lastPlacement = null
        setReadout('이미지 제거')
        return
      }

      if (app.wallPreview) {
        app.scene.remove(app.wallPreview)
        app.wallPreview.geometry.dispose()
        app.wallPreview.material.dispose()
        app.wallPreview = null
      }
      app.wallPlane = null
      app.wallNormal = null
      app.wallDir = null

      if (app.seamPoints.length > 0) {
        app.seamPoints.pop()
        const m = app.seamMarkers.pop()
        if (m) {
          app.scene.remove(m)
          m.geometry.dispose()
          m.material.dispose()
        }
        updateSeamLine()
      }

      app.state = app.seamPoints.length === 0 ? 'SEAM_1' : 'SEAM_2'
      updateGuide()
      setReadout('되돌림')
    }

    function loadUserImage(file) {
      if (!file) return
      const url = URL.createObjectURL(file)
      const img = new Image()
      img.onload = () => {
        const texture = new THREE.Texture(img)
        texture.needsUpdate = true
        texture.colorSpace = THREE.SRGBColorSpace
        app.texture = texture
        app.imageAspect = img.width / img.height
        URL.revokeObjectURL(url)

        if (app.pictureMesh && app.lastPlacement) {
          placePictureAt(app.lastPlacement.point.clone().sub(app.wallNormal.clone().multiplyScalar(0.012)))
        }
        setReadout('이미지 로드 완료')
      }
      img.onerror = () => {
        URL.revokeObjectURL(url)
        setReadout('이미지 로드 실패')
      }
      img.src = url
    }

    function initScene() {
      const {scene, camera, renderer} = XR8.Threejs.xrScene()
      app.scene = scene
      app.camera = camera
      app.renderer = renderer

      renderer.outputColorSpace = THREE.SRGBColorSpace

      const ambient = new THREE.AmbientLight(0xffffff, 1.15)
      scene.add(ambient)

      const directional = new THREE.DirectionalLight(0xffffff, 0.6)
      directional.position.set(1, 3, 2)
      scene.add(directional)

      app.texture = makePlaceholderTexture()

      XR8.XrController.updateCameraProjectionMatrix({
        origin: camera.position,
        facing: camera.quaternion,
      })

      app.xrReady = true
      updateGuide()
      setReadout('AR 준비 완료')
    }

    function wallArtPipelineModule() {
      return {
        name: 'wall-art-placement',
        onStart: () => initScene(),
        onUpdate: () => {
          const now = performance.now()
          if (app.xrReady && now - app.lastReadoutAt > 250) {
            app.lastReadoutAt = now
            setReadout()
          }
        },
        onCameraStatusChange: ({status}) => {
          if (status === 'requesting') setGuide('카메라 권한을 요청 중입니다.')
          if (status === 'hasStream') updateGuide()
          if (status === 'failed') showError('카메라를 열 수 없습니다. HTTPS에서 실행 중인지, 브라우저 카메라 권한이 허용되어 있는지 확인하세요.')
        },
      }
    }

    function startXR() {
      if (app.started) return
      app.started = true

      if (!window.XR8 || !window.THREE) {
        app.started = false
        showError('8th Wall 또는 Three.js가 로드되지 않았습니다. 네트워크 연결을 확인하세요.')
        return
      }

      try {
        XR8.XrController.configure({
          disableWorldTracking: false,
          scale: 'absolute',
        })

        XR8.addCameraPipelineModules([
          XR8.XrController.pipelineModule(),
          XR8.GlTextureRenderer.pipelineModule(),
          XR8.Threejs.pipelineModule(),
          wallArtPipelineModule(),
        ])

        XR8.run({
          canvas: els.canvas,
          allowedDevices: XR8.XrConfig.device().ANY,
        })
      } catch (err) {
        app.started = false
        showError(err && err.message ? err.message : String(err))
      }
    }

    window.addEventListener('xrloaded', startXR)
    if (window.XR8) startXR()

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.ui')) return
      handleWorldTap(e.clientX, e.clientY)
    }, {passive: true})

    els.placeCenterBtn.addEventListener('click', () => {
      const p = getRayPlaneIntersection(window.innerWidth / 2, window.innerHeight / 2)
      if (!p) {
        setReadout('중앙 광선 교차 실패: 벽을 더 정면으로 조준')
        return
      }
      placePictureAt(p)
    })

    els.resetBtn.addEventListener('click', resetAll)
    els.undoBtn.addEventListener('click', undo)
    els.imageInput.addEventListener('change', (e) => loadUserImage(e.target.files && e.target.files[0]))
    els.widthCm.addEventListener('change', () => {
      if (app.pictureMesh && app.lastPlacement) {
        placePictureAt(app.lastPlacement.point.clone().sub(app.wallNormal.clone().multiplyScalar(0.012)))
      }
    })
  </script>
</body>
</html>

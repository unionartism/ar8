<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover
    "
  >

  <meta name="theme-color" content="#000000">

  <title>Wall Art AR</title>

  <style>
    :root {
      --app-height: 100dvh;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed !important;
      inset: 0 !important;

      width: 100vw !important;
      height: var(--app-height) !important;

      margin: 0 !important;
      padding: 0 !important;

      overflow: hidden !important;
      overscroll-behavior: none;
      touch-action: none;

      background: #000;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    /*
     * XR8 카메라 canvas
     *
     * 반드시 UI보다 아래에 위치시킵니다.
     */
    #camerafeed {
      position: fixed !important;
      inset: 0 !important;

      z-index: 0 !important;

      display: block !important;

      width: 100vw !important;
      height: var(--app-height) !important;

      max-width: none !important;
      max-height: none !important;

      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;

      background: #000 !important;

      object-fit: cover !important;
      pointer-events: none !important;
    }

    /*
     * 모든 HTML UI를 담는 최상위 레이어입니다.
     *
     * XR8이나 외부 스크립트가 canvas 위치 또는
     * z-index를 변경해도 화면 위에 남도록 합니다.
     */
    #arUiRoot {
      position: fixed !important;
      inset: 0 !important;

      z-index: 2147483647 !important;

      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;

      width: 100vw !important;
      height: var(--app-height) !important;

      overflow: hidden !important;

      pointer-events: none !important;

      isolation: isolate;
      transform: translateZ(0);
    }

    #status {
      position: absolute !important;

      top: max(
        14px,
        env(safe-area-inset-top)
      );

      left: 50%;

      z-index: 20;

      width: max-content;
      max-width: calc(100vw - 28px);

      padding: 10px 14px;

      overflow: hidden;

      border: 1px solid rgb(255 255 255 / 18%);
      border-radius: 999px;

      background: rgb(0 0 0 / 72%);
      color: #fff;

      font-size: 14px;
      font-weight: 600;
      line-height: 1.4;

      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;

      box-shadow: 0 5px 20px rgb(0 0 0 / 25%);
      backdrop-filter: blur(10px);

      transform: translateX(-50%);

      pointer-events: none;
    }

    #reticle {
      position: absolute !important;

      top: 50%;
      left: 50%;

      z-index: 15;

      width: 48px;
      height: 48px;

      border: 2px solid rgb(255 255 255 / 90%);
      border-radius: 50%;

      color: #fff;

      box-shadow:
        0 0 0 1px rgb(0 0 0 / 50%),
        0 0 18px rgb(255 255 255 / 18%);

      transform: translate(-50%, -50%);

      transition:
        width 160ms ease,
        height 160ms ease,
        color 160ms ease,
        border-color 160ms ease,
        box-shadow 160ms ease;

      pointer-events: none;
    }

    #reticle::before,
    #reticle::after {
      position: absolute;

      top: 50%;
      left: 50%;

      background: currentColor;

      content: "";

      transform: translate(-50%, -50%);
    }

    #reticle::before {
      width: 18px;
      height: 1px;
    }

    #reticle::after {
      width: 1px;
      height: 18px;
    }

    #reticle.ready {
      width: 58px;
      height: 58px;

      border-color: #58f59a;
      color: #58f59a;

      box-shadow:
        0 0 0 1px rgb(0 0 0 / 50%),
        0 0 28px rgb(88 245 154 / 55%);
    }

    #controls {
      position: absolute !important;

      right: 12px;
      bottom: max(
        18px,
        env(safe-area-inset-bottom)
      );
      left: 12px;

      z-index: 30;

      display: flex !important;

      align-items: center;
      justify-content: center;

      gap: 8px;

      pointer-events: auto !important;
    }

    button,
    .file-button {
      position: relative;

      display: inline-flex !important;

      min-height: 48px;

      align-items: center;
      justify-content: center;

      padding: 0 16px;

      border: 0;
      border-radius: 999px;

      background: rgb(255 255 255 / 96%);
      color: #111;

      font: inherit;
      font-size: 14px;
      font-weight: 750;

      white-space: nowrap;

      box-shadow:
        0 5px 20px rgb(0 0 0 / 32%);

      cursor: pointer;
      user-select: none;

      pointer-events: auto !important;
    }

    button:active,
    .file-button:active {
      transform: scale(0.97);
    }

    button:disabled,
    .file-button.disabled {
      opacity: 0.42;
      cursor: default;
      transform: none;
    }

    #placeButton:not(:disabled) {
      background: #58f59a;
    }

    #imageInput {
      position: absolute;

      width: 1px;
      height: 1px;

      overflow: hidden;

      opacity: 0;

      pointer-events: none;
    }

    #debug {
      position: absolute !important;

      right: 10px;

      bottom: calc(
        max(
          18px,
          env(safe-area-inset-bottom)
        ) + 68px
      );

      z-index: 25;

      max-width: 195px;

      padding: 8px 10px;

      border: 1px solid rgb(255 255 255 / 14%);
      border-radius: 9px;

      background: rgb(0 0 0 / 68%);
      color: #fff;

      font:
        10px/1.5
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

      white-space: pre-wrap;

      box-shadow: 0 5px 18px rgb(0 0 0 / 24%);
      backdrop-filter: blur(8px);

      pointer-events: none;
    }

    #errorPanel {
      position: absolute !important;
      inset: 0 !important;

      z-index: 100;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 24px;

      background: rgb(0 0 0 / 94%);
      color: #fff;

      text-align: center;

      pointer-events: auto !important;
    }

    #errorPanel.visible {
      display: flex !important;
    }

    #errorPanelContent {
      width: 100%;
      max-width: 460px;
    }

    #errorTitle {
      margin: 0 0 12px;

      font-size: 22px;
      line-height: 1.35;
    }

    #errorMessage {
      margin: 0 0 22px;

      color: rgb(255 255 255 / 78%);

      font-size: 15px;
      line-height: 1.65;

      white-space: pre-line;
    }

    #reloadButton {
      min-width: 150px;
    }

    @media (max-width: 420px) {
      button,
      .file-button {
        min-height: 46px;
        padding: 0 12px;
        font-size: 13px;
      }

      #debug {
        max-width: 165px;
        font-size: 9px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.172.0/build/three.module.min.js"
      }
    }
  </script>
</head>

<body>
  <!-- XR8 카메라 출력 -->
  <canvas id="camerafeed"></canvas>

  <!-- HTML 인터페이스 -->
  <div id="arUiRoot">
    <div id="status">
      애플리케이션을 준비하는 중입니다.
    </div>

    <div id="reticle"></div>

    <div id="debug">
      UI: READY
      XR8: WAIT
    </div>

    <div id="controls">
      <label
        id="fileButton"
        class="file-button disabled"
        for="imageInput"
      >
        이미지 선택

        <input
          id="imageInput"
          type="file"
          accept="image/*"
          disabled
        >
      </label>

      <button
        id="placeButton"
        type="button"
        disabled
      >
        벽에 배치
      </button>

      <button
        id="resetButton"
        type="button"
      >
        초기화
      </button>
    </div>

    <section id="errorPanel">
      <div id="errorPanelContent">
        <h1 id="errorTitle">
          AR을 실행할 수 없습니다
        </h1>

        <p id="errorMessage"></p>

        <button
          id="reloadButton"
          type="button"
        >
          다시 불러오기
        </button>
      </div>
    </section>
  </div>

  <script type="module">
    import * as THREE from 'three'

    /*
     * XR8의 Three.js 파이프라인이 참조할 수 있도록
     * Three.js를 전역에 등록합니다.
     */
    window.THREE = THREE

    const XR8_ENGINE_URL =
      'https://cdn.jsdelivr.net/npm/' +
      '@8thwall/engine-binary@1/dist/xr.js'

    const WORLD_UP =
      new THREE.Vector3(0, 1, 0)

    const CENTER_NDC =
      new THREE.Vector2(0, 0)

    /*
     * 화면 중앙 주변 표면 검사 지점
     */
    const WALL_SAMPLE_POINTS = {
      center: [0.50, 0.50],

      left: [0.44, 0.50],
      right: [0.56, 0.50],

      upper: [0.50, 0.44],
      lower: [0.50, 0.56],

      upperLeft: [0.44, 0.44],
      upperRight: [0.56, 0.44],

      lowerLeft: [0.44, 0.56],
      lowerRight: [0.56, 0.56],
    }

    const state = {
      scene: null,
      camera: null,
      renderer: null,

      artwork: null,
      artworkTexture: null,

      wallCandidate: null,
      wallCandidateLastSeen: 0,

      trackingStatus: 'INITIALIZING',
      trackingReason: null,

      sampleTimer: 0,
      debugTimer: 0,

      xrStarted: false,
      xrLoading: false,

      cameraStatus: 'IDLE',
    }

    const canvas =
      document.querySelector('#camerafeed')

    const uiRoot =
      document.querySelector('#arUiRoot')

    const statusElement =
      document.querySelector('#status')

    const reticleElement =
      document.querySelector('#reticle')

    const debugElement =
      document.querySelector('#debug')

    const imageInput =
      document.querySelector('#imageInput')

    const fileButton =
      document.querySelector('#fileButton')

    const placeButton =
      document.querySelector('#placeButton')

    const resetButton =
      document.querySelector('#resetButton')

    const errorPanel =
      document.querySelector('#errorPanel')

    const errorMessage =
      document.querySelector('#errorMessage')

    const reloadButton =
      document.querySelector('#reloadButton')

    /*
     * -------------------------------------------------------
     * 레이어 순서 강제
     * -------------------------------------------------------
     */

    function enforceLayerOrder() {
      /*
       * 카메라 canvas는 가장 아래에 둡니다.
       */
      canvas.style.setProperty(
        'position',
        'fixed',
        'important',
      )

      canvas.style.setProperty(
        'inset',
        '0',
        'important',
      )

      canvas.style.setProperty(
        'z-index',
        '0',
        'important',
      )

      canvas.style.setProperty(
        'display',
        'block',
        'important',
      )

      canvas.style.setProperty(
        'visibility',
        'visible',
        'important',
      )

      canvas.style.setProperty(
        'opacity',
        '1',
        'important',
      )

      canvas.style.setProperty(
        'width',
        '100vw',
        'important',
      )

      canvas.style.setProperty(
        'height',
        'var(--app-height)',
        'important',
      )

      /*
       * UI는 항상 canvas보다 위에 둡니다.
       */
      uiRoot.style.setProperty(
        'position',
        'fixed',
        'important',
      )

      uiRoot.style.setProperty(
        'inset',
        '0',
        'important',
      )

      uiRoot.style.setProperty(
        'z-index',
        '2147483647',
        'important',
      )

      uiRoot.style.setProperty(
        'display',
        'block',
        'important',
      )

      uiRoot.style.setProperty(
        'visibility',
        'visible',
        'important',
      )

      uiRoot.style.setProperty(
        'opacity',
        '1',
        'important',
      )

      uiRoot.style.setProperty(
        'pointer-events',
        'none',
        'important',
      )

      /*
       * 외부 코드가 다른 DOM 요소를 body 마지막에 넣었더라도
       * UI를 다시 마지막 자식으로 이동시킵니다.
       */
      if (
        uiRoot.parentElement !== document.body ||
        document.body.lastElementChild !== uiRoot
      ) {
        document.body.appendChild(uiRoot)
      }
    }

    enforceLayerOrder()

    /*
     * XR8이 실행 중 DOM 구조를 수정하는 경우에도
     * UI 레이어를 다시 최상단으로 복구합니다.
     */
    const bodyObserver =
      new MutationObserver(() => {
        window.requestAnimationFrame(
          enforceLayerOrder,
        )
      })

    bodyObserver.observe(
      document.body,
      {
        childList: true,
      },
    )

    /*
     * -------------------------------------------------------
     * 모바일 viewport
     * -------------------------------------------------------
     */

    function updateViewportSize() {
      const viewportHeight =
        window.visualViewport?.height ??
        window.innerHeight

      document.documentElement.style.setProperty(
        '--app-height',
        `${Math.round(viewportHeight)}px`,
      )

      enforceLayerOrder()
    }

    updateViewportSize()

    window.addEventListener(
      'resize',
      updateViewportSize,
      {passive: true},
    )

    window.addEventListener(
      'orientationchange',
      () => {
        window.setTimeout(
          updateViewportSize,
          100,
        )

        window.setTimeout(
          updateViewportSize,
          400,
        )

        window.setTimeout(
          updateViewportSize,
          800,
        )
      },
      {passive: true},
    )

    window.visualViewport?.addEventListener(
      'resize',
      updateViewportSize,
      {passive: true},
    )

    /*
     * -------------------------------------------------------
     * UI
     * -------------------------------------------------------
     */

    function setStatus(message) {
      statusElement.textContent = message
    }

    function showError(message) {
      errorMessage.textContent = message

      errorPanel.classList.add(
        'visible',
      )

      enforceLayerOrder()
    }

    function hideError() {
      errorPanel.classList.remove(
        'visible',
      )
    }

    function enableImageInput(enabled) {
      imageInput.disabled = !enabled

      fileButton.classList.toggle(
        'disabled',
        !enabled,
      )
    }

    function setReticleReady(ready) {
      reticleElement.classList.toggle(
        'ready',
        ready,
      )

      placeButton.disabled =
        !ready ||
        !state.artwork ||
        state.trackingStatus !== 'NORMAL'
    }

    function updateDebug(extra = {}) {
      const lines = [
        'UI: READY',
        `XR8: ${window.XR8 ? 'READY' : 'WAIT'}`,
        `camera: ${state.cameraStatus}`,
        `tracking: ${state.trackingStatus}`,
        `reason: ${state.trackingReason || '-'}`,
        `wall: ${
          state.wallCandidate
            ? 'READY'
            : 'SEARCHING'
        }`,
        `artwork: ${
          state.artwork
            ? 'YES'
            : 'NO'
        }`,
      ]

      for (
        const [key, value]
        of Object.entries(extra)
      ) {
        lines.push(
          `${key}: ${value}`,
        )
      }

      debugElement.textContent =
        lines.join('\n')
    }

    /*
     * -------------------------------------------------------
     * XR8 엔진 로딩
     * -------------------------------------------------------
     */

    function loadXR8Engine() {
      return new Promise(
        (resolve, reject) => {
          if (window.XR8) {
            resolve(window.XR8)
            return
          }

          const timeoutMilliseconds =
            30000

          let completed = false
          let pollingId = null

          const timeoutId =
            window.setTimeout(() => {
              finishWithError(
                new Error(
                  'XR8 초기화 시간이 초과되었습니다.\n' +
                  '네트워크 연결과 CDN 접근 상태를 확인해 주세요.',
                ),
              )
            }, timeoutMilliseconds)

          function cleanup() {
            window.clearTimeout(
              timeoutId,
            )

            if (pollingId !== null) {
              window.clearInterval(
                pollingId,
              )
            }

            window.removeEventListener(
              'xrloaded',
              handleXRLoaded,
            )
          }

          function finishWithXR8() {
            if (
              completed ||
              !window.XR8
            ) {
              return
            }

            completed = true
            cleanup()

            resolve(window.XR8)
          }

          function finishWithError(error) {
            if (completed) {
              return
            }

            completed = true
            cleanup()

            reject(error)
          }

          function handleXRLoaded() {
            finishWithXR8()
          }

          /*
           * 스크립트를 넣기 전에 이벤트부터 등록합니다.
           */
          window.addEventListener(
            'xrloaded',
            handleXRLoaded,
          )

          pollingId =
            window.setInterval(
              finishWithXR8,
              100,
            )

          const existingScript =
            document.querySelector(
              'script[data-xr8-engine="true"]',
            )

          if (existingScript) {
            finishWithXR8()
            return
          }

          const script =
            document.createElement(
              'script',
            )

          script.src =
            XR8_ENGINE_URL

          script.async = true
          script.crossOrigin =
            'anonymous'

          script.dataset.xr8Engine =
            'true'

          script.setAttribute(
            'data-preload-chunks',
            'slam',
          )

          script.addEventListener(
            'load',
            finishWithXR8,
            {once: true},
          )

          script.addEventListener(
            'error',
            () => {
              finishWithError(
                new Error(
                  '8th Wall XR 엔진 파일을 불러오지 못했습니다.',
                ),
              )
            },
            {once: true},
          )

          document.head.appendChild(
            script,
          )
        },
      )
    }

    /*
     * -------------------------------------------------------
     * Three.js 이미지
     * -------------------------------------------------------
     */

    function disposeMaterial(material) {
      if (!material) {
        return
      }

      if (Array.isArray(material)) {
        for (const item of material) {
          item.dispose()
        }

        return
      }

      material.dispose()
    }

    function disposeArtwork() {
      if (state.artwork) {
        state.artwork.removeFromParent()
        state.artwork.geometry?.dispose()

        disposeMaterial(
          state.artwork.material,
        )

        state.artwork = null
      }

      if (state.artworkTexture) {
        state.artworkTexture.dispose()

        state.artworkTexture = null
      }

      placeButton.disabled = true
    }

    async function createResizedCanvas(file) {
      const bitmap =
        await createImageBitmap(file)

      try {
        const maxTextureSize = 2048

        const resizeRatio = Math.min(
          1,
          maxTextureSize /
            Math.max(
              bitmap.width,
              bitmap.height,
            ),
        )

        const outputWidth =
          Math.max(
            1,
            Math.round(
              bitmap.width *
              resizeRatio,
            ),
          )

        const outputHeight =
          Math.max(
            1,
            Math.round(
              bitmap.height *
              resizeRatio,
            ),
          )

        const imageCanvas =
          document.createElement(
            'canvas',
          )

        imageCanvas.width =
          outputWidth

        imageCanvas.height =
          outputHeight

        const context =
          imageCanvas.getContext(
            '2d',
            {
              alpha: true,
            },
          )

        if (!context) {
          throw new Error(
            '이미지 처리용 Canvas를 만들 수 없습니다.',
          )
        }

        context.drawImage(
          bitmap,
          0,
          0,
          outputWidth,
          outputHeight,
        )

        return imageCanvas
      } finally {
        bitmap.close()
      }
    }

    async function loadArtwork(file) {
      if (!state.scene) {
        throw new Error(
          'AR 공간이 아직 준비되지 않았습니다.',
        )
      }

      if (
        !file.type.startsWith(
          'image/',
        )
      ) {
        throw new Error(
          '이미지 파일만 선택할 수 있습니다.',
        )
      }

      disposeArtwork()

      setStatus(
        '이미지를 처리하는 중입니다.',
      )

      const imageCanvas =
        await createResizedCanvas(
          file,
        )

      const texture =
        new THREE.CanvasTexture(
          imageCanvas,
        )

      texture.colorSpace =
        THREE.SRGBColorSpace

      texture.needsUpdate = true

      if (state.renderer) {
        texture.anisotropy =
          Math.min(
            8,
            state.renderer
              .capabilities
              .getMaxAnisotropy(),
          )
      }

      /*
       * 기본 실제 가로 크기 60cm
       */
      const widthMeters = 0.6

      const heightMeters =
        widthMeters *
        imageCanvas.height /
        imageCanvas.width

      const geometry =
        new THREE.PlaneGeometry(
          widthMeters,
          heightMeters,
        )

      const material =
        new THREE.MeshBasicMaterial({
          map: texture,

          transparent: true,

          side:
            THREE.DoubleSide,

          toneMapped: false,

          depthTest: true,
          depthWrite: true,
        })

      const artwork =
        new THREE.Mesh(
          geometry,
          material,
        )

      artwork.name =
        'wall-artwork'

      artwork.visible = false
      artwork.renderOrder = 10

      state.scene.add(
        artwork,
      )

      state.artwork =
        artwork

      state.artworkTexture =
        texture

      setReticleReady(
        Boolean(
          state.wallCandidate,
        ),
      )

      if (state.wallCandidate) {
        setStatus(
          '벽이 감지되었습니다. 배치 버튼을 누르세요.',
        )
      } else {
        setStatus(
          '벽을 향해 휴대폰을 천천히 움직이세요.',
        )
      }
    }

    /*
     * -------------------------------------------------------
     * 벽면 추정
     * -------------------------------------------------------
     */

    function pickBestSurfaceHit(hits) {
      if (!Array.isArray(hits)) {
        return null
      }

      return (
        hits.find(
          hit =>
            hit.type ===
            'DETECTED_SURFACE',
        ) ||
        hits.find(
          hit =>
            hit.type ===
            'ESTIMATED_SURFACE',
        ) ||
        null
      )
    }

    function hitPositionToVector(hit) {
      return new THREE.Vector3(
        hit.position.x,
        hit.position.y,
        hit.position.z,
      )
    }

    function averagePositions(
      hitMap,
      names,
    ) {
      const result =
        new THREE.Vector3()

      let count = 0

      for (const name of names) {
        const hit =
          hitMap[name]

        if (!hit) {
          continue
        }

        result.x +=
          hit.position.x

        result.y +=
          hit.position.y

        result.z +=
          hit.position.z

        count += 1
      }

      if (count === 0) {
        return null
      }

      return result.multiplyScalar(
        1 / count,
      )
    }

    function calculateCentroid(hits) {
      const centroid =
        new THREE.Vector3()

      for (const hit of hits) {
        centroid.x +=
          hit.position.x

        centroid.y +=
          hit.position.y

        centroid.z +=
          hit.position.z
      }

      return centroid.multiplyScalar(
        1 / hits.length,
      )
    }

    function median(values) {
      if (!values.length) {
        return 0
      }

      const sorted =
        [...values].sort(
          (a, b) => a - b,
        )

      const middle =
        Math.floor(
          sorted.length / 2,
        )

      if (
        sorted.length % 2 === 1
      ) {
        return sorted[middle]
      }

      return (
        sorted[middle - 1] +
        sorted[middle]
      ) / 2
    }

    function createWallQuaternion(
      inputNormal,
    ) {
      const normal =
        inputNormal
          .clone()
          .normalize()

      const right =
        new THREE.Vector3()
          .crossVectors(
            WORLD_UP,
            normal,
          )

      if (
        right.lengthSq() <
        0.000001
      ) {
        return null
      }

      right.normalize()

      const wallUp =
        new THREE.Vector3()
          .crossVectors(
            normal,
            right,
          )
          .normalize()

      const matrix =
        new THREE.Matrix4()
          .makeBasis(
            right,
            wallUp,
            normal,
          )

      return new THREE.Quaternion()
        .setFromRotationMatrix(
          matrix,
        )
    }

    function estimateWallCandidate(XR8) {
      if (!state.camera) {
        return null
      }

      const hitMap = {}
      const validHits = []

      for (
        const [name, coordinates]
        of Object.entries(
          WALL_SAMPLE_POINTS,
        )
      ) {
        const [x, y] =
          coordinates

        let results = []

        try {
          results =
            XR8.XrController.hitTest(
              x,
              y,
            ) || []
        } catch (error) {
          console.warn(
            'hitTest failed:',
            error,
          )

          continue
        }

        const hit =
          pickBestSurfaceHit(
            results,
          )

        if (!hit) {
          continue
        }

        hitMap[name] = hit
        validHits.push(hit)
      }

      if (validHits.length < 5) {
        return null
      }

      const leftCenter =
        averagePositions(
          hitMap,
          [
            'left',
            'upperLeft',
            'lowerLeft',
          ],
        )

      const rightCenter =
        averagePositions(
          hitMap,
          [
            'right',
            'upperRight',
            'lowerRight',
          ],
        )

      const upperCenter =
        averagePositions(
          hitMap,
          [
            'upper',
            'upperLeft',
            'upperRight',
          ],
        )

      const lowerCenter =
        averagePositions(
          hitMap,
          [
            'lower',
            'lowerLeft',
            'lowerRight',
          ],
        )

      if (
        !leftCenter ||
        !rightCenter ||
        !upperCenter ||
        !lowerCenter
      ) {
        return null
      }

      const horizontal =
        rightCenter
          .clone()
          .sub(leftCenter)

      const vertical =
        upperCenter
          .clone()
          .sub(lowerCenter)

      if (
        horizontal.lengthSq() <
          0.0001 ||
        vertical.lengthSq() <
          0.0001
      ) {
        return null
      }

      horizontal.normalize()
      vertical.normalize()

      const normal =
        new THREE.Vector3()
          .crossVectors(
            horizontal,
            vertical,
          )

      if (
        normal.lengthSq() <
        0.000001
      ) {
        return null
      }

      normal.normalize()

      const centroid =
        calculateCentroid(
          validHits,
        )

      state.camera.updateMatrixWorld(
        true,
      )

      const cameraPosition =
        new THREE.Vector3()

      state.camera.getWorldPosition(
        cameraPosition,
      )

      const wallToCamera =
        cameraPosition
          .clone()
          .sub(centroid)

      /*
       * normal을 카메라 방향으로 정렬
       */
      if (
        normal.dot(
          wallToCamera,
        ) < 0
      ) {
        normal.negate()
      }

      /*
       * 바닥과 천장 제외
       */
      const normalY =
        Math.abs(
          normal.dot(
            WORLD_UP,
          ),
        )

      if (normalY > 0.35) {
        return null
      }

      let squaredErrorSum = 0

      for (const hit of validHits) {
        const point =
          hitPositionToVector(
            hit,
          )

        const planeDistance =
          point
            .sub(centroid)
            .dot(normal)

        squaredErrorSum +=
          planeDistance *
          planeDistance
      }

      const rmsError =
        Math.sqrt(
          squaredErrorSum /
          validHits.length,
        )

      if (rmsError > 0.06) {
        return null
      }

      const wallPlane =
        new THREE.Plane()
          .setFromNormalAndCoplanarPoint(
            normal,
            centroid,
          )

      const raycaster =
        new THREE.Raycaster()

      raycaster.setFromCamera(
        CENTER_NDC,
        state.camera,
      )

      const placementPosition =
        raycaster.ray.intersectPlane(
          wallPlane,
          new THREE.Vector3(),
        )

      if (!placementPosition) {
        return null
      }

      const calculatedDistance =
        cameraPosition.distanceTo(
          placementPosition,
        )

      if (
        calculatedDistance < 0.25 ||
        calculatedDistance > 8
      ) {
        return null
      }

      const reportedDistances =
        validHits
          .map(
            hit => hit.distance,
          )
          .filter(
            Number.isFinite,
          )

      const reportedDistance =
        median(
          reportedDistances,
        )

      if (reportedDistance > 0) {
        const allowedDifference =
          Math.max(
            0.35,
            reportedDistance *
              0.25,
          )

        if (
          Math.abs(
            calculatedDistance -
            reportedDistance,
          ) >
          allowedDifference
        ) {
          return null
        }
      }

      const quaternion =
        createWallQuaternion(
          normal,
        )

      if (!quaternion) {
        return null
      }

      return {
        position:
          placementPosition,

        normal,
        quaternion,

        distance:
          calculatedDistance,

        reportedDistance,
        rmsError,

        hitCount:
          validHits.length,
      }
    }

    /*
     * -------------------------------------------------------
     * 벽 후보 smoothing
     * -------------------------------------------------------
     */

    function sampleWallCandidate(XR8) {
      if (
        state.trackingStatus !==
        'NORMAL'
      ) {
        state.wallCandidate = null

        setReticleReady(false)

        setStatus(
          '공간 추적을 복구하는 중입니다.',
        )

        return
      }

      const candidate =
        estimateWallCandidate(
          XR8,
        )

      if (!candidate) {
        const elapsed =
          performance.now() -
          state.wallCandidateLastSeen

        if (elapsed > 500) {
          state.wallCandidate = null

          setReticleReady(false)

          setStatus(
            '벽을 향해 천천히 움직여 주세요.',
          )
        }

        return
      }

      state.wallCandidateLastSeen =
        performance.now()

      if (!state.wallCandidate) {
        state.wallCandidate =
          candidate
      } else {
        state.wallCandidate
          .position
          .lerp(
            candidate.position,
            0.35,
          )

        state.wallCandidate
          .normal
          .lerp(
            candidate.normal,
            0.25,
          )
          .normalize()

        const quaternion =
          createWallQuaternion(
            state.wallCandidate
              .normal,
          )

        if (quaternion) {
          state.wallCandidate
            .quaternion
            .slerp(
              quaternion,
              0.35,
            )
        }

        state.wallCandidate.distance =
          candidate.distance

        state.wallCandidate.rmsError =
          candidate.rmsError

        state.wallCandidate.hitCount =
          candidate.hitCount
      }

      setReticleReady(true)

      setStatus(
        `벽 감지됨 · 약 ${
          state.wallCandidate
            .distance
            .toFixed(2)
        }m`,
      )
    }

    /*
     * -------------------------------------------------------
     * 이미지 배치
     * -------------------------------------------------------
     */

    function placeArtwork() {
      const candidate =
        state.wallCandidate

      const artwork =
        state.artwork

      if (!candidate) {
        setStatus(
          '먼저 안정적인 벽을 인식해 주세요.',
        )

        return
      }

      if (!artwork) {
        setStatus(
          '먼저 배치할 이미지를 선택해 주세요.',
        )

        return
      }

      artwork.position.copy(
        candidate.position,
      )

      /*
       * z-fighting 방지:
       * 벽 normal 방향으로 6mm 이동
       */
      artwork.position.addScaledVector(
        candidate.normal,
        0.006,
      )

      artwork.quaternion.copy(
        candidate.quaternion,
      )

      artwork.visible = true

      setStatus(
        `이미지를 약 ${
          candidate.distance
            .toFixed(2)
        }m 거리의 벽에 배치했습니다.`,
      )
    }

    function resetPlacement() {
      if (state.artwork) {
        state.artwork.visible =
          false
      }

      state.wallCandidate = null

      state.wallCandidateLastSeen =
        0

      setReticleReady(false)

      setStatus(
        '벽을 향해 휴대폰을 천천히 움직여 주세요.',
      )
    }

    /*
     * -------------------------------------------------------
     * XR8 파이프라인
     * -------------------------------------------------------
     */

    function createApplicationPipelineModule(
      XR8,
    ) {
      return {
        name:
          'wall-art-single-html',

        /*
         * 카메라 권한 상태 확인
         */
        onCameraStatusChange({
          status,
        }) {
          state.cameraStatus =
            status || 'UNKNOWN'

          enforceLayerOrder()

          if (status === 'requesting') {
            setStatus(
              '카메라 권한을 요청하는 중입니다.',
            )
          }

          if (status === 'hasStream') {
            setStatus(
              '카메라를 시작하는 중입니다.',
            )
          }

          if (status === 'hasVideo') {
            setStatus(
              '공간 인식을 시작합니다.',
            )
          }

          if (status === 'failed') {
            showError(
              '카메라를 시작하지 못했습니다.\n' +
              '브라우저의 카메라 권한을 확인해 주세요.',
            )
          }
        },

        onStart() {
          const {
            scene,
            camera,
            renderer,
          } =
            XR8.Threejs.xrScene()

          state.scene = scene
          state.camera = camera
          state.renderer = renderer

          enforceLayerOrder()
          updateViewportSize()

          enableImageInput(true)

          setStatus(
            '주변을 천천히 움직여 공간을 인식하세요.',
          )

          updateDebug()
        },

        onAttach() {
          enforceLayerOrder()
        },

        onCanvasSizeChange() {
          updateViewportSize()
          enforceLayerOrder()
        },

        onDeviceOrientationChange() {
          window.setTimeout(
            updateViewportSize,
            100,
          )

          window.setTimeout(
            enforceLayerOrder,
            150,
          )
        },

        onUpdate({
          processCpuResult,
          processGpuResult,
        }) {
          const reality =
            processCpuResult?.reality

          if (!reality) {
            return
          }

          state.trackingStatus =
            reality.trackingStatus ||
            'UNKNOWN'

          state.trackingReason =
            reality.trackingReason ||
            null

          const now =
            performance.now()

          /*
           * 벽 표면 검사 약 8Hz
           */
          if (
            now -
            state.sampleTimer >
            125
          ) {
            state.sampleTimer = now

            sampleWallCandidate(
              XR8,
            )
          }

          /*
           * 디버그 표시 약 4Hz
           */
          if (
            now -
            state.debugTimer >
            250
          ) {
            state.debugTimer = now

            updateDebug({
              points:
                reality.worldPoints
                  ?.length || 0,

              distance:
                state.wallCandidate
                  ? `${
                      state.wallCandidate
                        .distance
                        .toFixed(2)
                    }m`
                  : '-',

              planeError:
                state.wallCandidate
                  ? `${
                      (
                        state.wallCandidate
                          .rmsError *
                        100
                      ).toFixed(1)
                    }cm`
                  : '-',

              samples:
                state.wallCandidate
                  ?.hitCount || 0,

              gpu:
                processGpuResult
                  ? 'READY'
                  : 'WAIT',
            })
          }
        },

        onPaused() {
          setReticleReady(false)

          setStatus(
            '카메라가 일시 중지되었습니다.',
          )
        },

        onResume() {
          state.wallCandidate = null

          state.wallCandidateLastSeen =
            0

          updateViewportSize()
          enforceLayerOrder()

          setStatus(
            '공간 추적을 복구하는 중입니다.',
          )
        },

        onException(error) {
          console.error(
            'XR pipeline error:',
            error,
          )

          enforceLayerOrder()

          showError(
            'AR 실행 중 오류가 발생했습니다.\n' +
            '페이지를 새로고침하고 카메라 권한을 확인해 주세요.',
          )
        },
      }
    }

    function startXR(XR8) {
      if (state.xrStarted) {
        return
      }

      if (!XR8) {
        throw new Error(
          'XR8 엔진 인스턴스가 없습니다.',
        )
      }

      state.xrStarted = true

      enforceLayerOrder()

      XR8.XrController.configure({
        disableWorldTracking:
          false,

        enableWorldPoints:
          true,

        enableLighting:
          true,

        scale:
          'absolute',
      })

      /*
       * XRExtras는 사용하지 않습니다.
       *
       * FullWindowCanvas의 DOM 이동과
       * Loading overlay가 UI를 가리는 가능성을 제거합니다.
       */
      XR8.addCameraPipelineModules([
        XR8.GlTextureRenderer
          .pipelineModule(),

        XR8.Threejs
          .pipelineModule(),

        XR8.XrController
          .pipelineModule(),

        createApplicationPipelineModule(
          XR8,
        ),
      ])

      XR8.run({
        canvas,

        allowedDevices:
          XR8.XrConfig.device()
            .ANY,
      })
    }

    /*
     * -------------------------------------------------------
     * 사용자 입력
     * -------------------------------------------------------
     */

    imageInput.addEventListener(
      'change',
      async event => {
        const file =
          event.target.files?.[0]

        if (!file) {
          return
        }

        try {
          await loadArtwork(file)
        } catch (error) {
          console.error(error)

          setStatus(
            error instanceof Error
              ? error.message
              : '이미지를 불러오지 못했습니다.',
          )
        } finally {
          event.target.value = ''
        }
      },
    )

    placeButton.addEventListener(
      'click',
      event => {
        event.preventDefault()
        event.stopPropagation()

        placeArtwork()
      },
    )

    resetButton.addEventListener(
      'click',
      event => {
        event.preventDefault()
        event.stopPropagation()

        resetPlacement()
      },
    )

    reloadButton.addEventListener(
      'click',
      () => {
        window.location.reload()
      },
    )

    /*
     * UI 레이어 터치가 canvas로 전달되지 않도록 합니다.
     */
    controls.addEventListener?.(
      'touchstart',
      event => {
        event.stopPropagation()
      },
      {
        passive: true,
      },
    )

    /*
     * -------------------------------------------------------
     * 초기화
     * -------------------------------------------------------
     */

    async function initialize() {
      if (state.xrLoading) {
        return
      }

      state.xrLoading = true

      hideError()
      enableImageInput(false)

      enforceLayerOrder()
      updateDebug()

      try {
        if (!window.isSecureContext) {
          throw new Error(
            '카메라 사용에는 HTTPS 연결이 필요합니다.\n' +
            'GitHub Pages HTTPS 주소에서 실행해 주세요.',
          )
        }

        setStatus(
          'AR 추적 엔진을 불러오는 중입니다.',
        )

        const XR8 =
          await loadXR8Engine()

        enforceLayerOrder()

        setStatus(
          'AR 카메라를 시작하는 중입니다.',
        )

        startXR(XR8)
      } catch (error) {
        console.error(
          'Initialization error:',
          error,
        )

        enforceLayerOrder()

        showError(
          error instanceof Error
            ? error.message
            : 'AR 초기화에 실패했습니다.',
        )
      } finally {
        state.xrLoading = false
      }
    }

    initialize()
  </script>
</body>
</html>

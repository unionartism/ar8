<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1,
             maximum-scale=1, user-scalable=no,
             viewport-fit=cover"
  >

  <title>Wall Art AR</title>

  <!--

    Niantic Spatial, Inc.

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui, sans-serif;
      touch-action: none;
    }

    #camerafeed {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #ui {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
    }

    #status {
      position: absolute;
      top: max(16px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100% - 32px);
      padding: 10px 14px;
      border-radius: 999px;
      background: rgb(0 0 0 / 65%);
      color: white;
      font-size: 14px;
      text-align: center;
      white-space: nowrap;
    }

    #reticle {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 44px;
      height: 44px;
      transform: translate(-50%, -50%);
      border: 2px solid white;
      border-radius: 50%;
      transition:
        border-color 150ms,
        transform 150ms;
    }

    #reticle.ready {
      border-color: #54ff9b;
      transform: translate(-50%, -50%) scale(1.15);
    }

    #controls {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: max(20px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      gap: 10px;
      pointer-events: auto;
    }

    button,
    .file-button {
      min-height: 48px;
      padding: 0 18px;
      border: 0;
      border-radius: 999px;
      background: white;
      color: black;
      font-size: 15px;
      font-weight: 700;
    }

    button:disabled {
      opacity: 0.45;
    }

    #imageInput {
      display: none;
    }

    #debug {
      position: absolute;
      right: 10px;
      bottom: 90px;
      padding: 8px;
      border-radius: 8px;
      background: rgb(0 0 0 / 60%);
      color: #fff;
      font: 11px/1.4 monospace;
      white-space: pre;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.172.0/build/three.module.min.js"
      }
    }
  </script>
</head>

<body>
  <canvas id="camerafeed"></canvas>

  <div id="ui">
    <div id="status">AR 엔진을 불러오는 중입니다.</div>
    <div id="reticle"></div>

    <div id="debug"></div>

    <div id="controls">
      <label class="file-button">
        이미지 선택
        <input
          id="imageInput"
          type="file"
          accept="image/*"
        >
      </label>

      <button id="placeButton" disabled>
        벽에 배치
      </button>

      <button id="resetButton">
        초기화
      </button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three'

    /*
     * XR8.Threejs가 동일한 THREE namespace를 사용할 수 있도록
     * 엔진보다 먼저 전역에 등록합니다.
     */
    window.THREE = {...THREE}

    const state = {
      scene: null,
      camera: null,
      renderer: null,

      artwork: null,
      artworkTexture: null,

      latestHit: null,
      trackingStatus: 'INITIALIZING',

      sampleTimer: 0,
    }

    const canvas =
      document.querySelector('#camerafeed')

    const statusElement =
      document.querySelector('#status')

    const reticleElement =
      document.querySelector('#reticle')

    const debugElement =
      document.querySelector('#debug')

    const imageInput =
      document.querySelector('#imageInput')

    const placeButton =
      document.querySelector('#placeButton')

    const resetButton =
      document.querySelector('#resetButton')

    function setStatus(message) {
      statusElement.textContent = message
    }

    function setReticleReady(ready) {
      reticleElement.classList.toggle('ready', ready)
      placeButton.disabled = !ready || !state.artwork
    }

    function updateDebug(data = {}) {
      debugElement.textContent = [
        `tracking: ${state.trackingStatus}`,
        `hit: ${state.latestHit ? 'YES' : 'NO'}`,
        `artwork: ${state.artwork ? 'YES' : 'NO'}`,
        ...Object.entries(data).map(
          ([key, value]) => `${key}: ${value}`
        ),
      ].join('\n')
    }

    function disposeArtwork() {
      if (state.artwork) {
        state.artwork.removeFromParent()
        state.artwork.geometry?.dispose()
        state.artwork.material?.dispose()
        state.artwork = null
      }

      if (state.artworkTexture) {
        state.artworkTexture.dispose()
        state.artworkTexture = null
      }

      placeButton.disabled = true
    }

    async function loadArtwork(file) {
      if (!state.scene) {
        throw new Error('Three.js scene is not ready')
      }

      disposeArtwork()

      const bitmap = await createImageBitmap(file)

      const maxTextureSize = 2048
      const ratio = Math.min(
        1,
        maxTextureSize / Math.max(bitmap.width, bitmap.height),
      )

      const outputWidth =
        Math.max(1, Math.round(bitmap.width * ratio))

      const outputHeight =
        Math.max(1, Math.round(bitmap.height * ratio))

      const imageCanvas =
        document.createElement('canvas')

      imageCanvas.width = outputWidth
      imageCanvas.height = outputHeight

      const context =
        imageCanvas.getContext('2d')

      if (!context) {
        bitmap.close()
        throw new Error('Canvas 2D context is unavailable')
      }

      context.drawImage(
        bitmap,
        0,
        0,
        outputWidth,
        outputHeight,
      )

      bitmap.close()

      const texture =
        new THREE.CanvasTexture(imageCanvas)

      texture.colorSpace = THREE.SRGBColorSpace
      texture.needsUpdate = true

      const widthMeters = 0.6
      const heightMeters =
        widthMeters * outputHeight / outputWidth

      const geometry =
        new THREE.PlaneGeometry(
          widthMeters,
          heightMeters,
        )

      const material =
        new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true,
          side: THREE.DoubleSide,
          toneMapped: false,
        })

      const artwork =
        new THREE.Mesh(geometry, material)

      artwork.visible = false
      artwork.renderOrder = 10

      state.scene.add(artwork)
      state.artwork = artwork
      state.artworkTexture = texture

      setStatus('벽을 향해 천천히 휴대폰을 움직이세요.')
      setReticleReady(Boolean(state.latestHit))
    }

    function sampleCenterHit(XR8) {
      if (state.trackingStatus !== 'NORMAL') {
        state.latestHit = null
        setReticleReady(false)
        return
      }

      const hits =
        XR8.XrController.hitTest(0.5, 0.5) || []

      const hit = hits.find((candidate) => {
        return (
          candidate.type === 'DETECTED_SURFACE' ||
          candidate.type === 'ESTIMATED_SURFACE' ||
          candidate.type === 'FEATURE_POINT'
        )
      })

      state.latestHit = hit || null

      if (!hit) {
        setStatus('표면을 찾는 중입니다.')
        setReticleReady(false)
        return
      }

      setStatus('표면 후보입니다. 배치 버튼을 누르세요.')
      setReticleReady(true)
    }

    function placeArtwork() {
      const hit = state.latestHit
      const artwork = state.artwork

      if (!hit || !artwork) {
        return
      }

      artwork.position.set(
        hit.position.x,
        hit.position.y,
        hit.position.z,
      )

      /*
       * 초기 MVP에서는 hit rotation을 사용합니다.
       * 이후 이 부분을 다중 샘플 + RANSAC 벽 추정으로 교체합니다.
       */
      artwork.quaternion.set(
        hit.rotation.x,
        hit.rotation.y,
        hit.rotation.z,
        hit.rotation.w,
      )

      /*
       * z-fighting 방지용 아주 작은 오프셋입니다.
       * 정확한 벽 normal을 계산한 뒤에는 normal 방향으로 적용합니다.
       */
      const localNormal =
        new THREE.Vector3(0, 0, 1)
          .applyQuaternion(artwork.quaternion)

      artwork.position.addScaledVector(
        localNormal,
        0.008,
      )

      artwork.visible = true
      setStatus('이미지를 배치했습니다.')
    }

    function createPipelineModule(XR8) {
      return {
        name: 'wall-art-single-html',

        onStart() {
          const {
            scene,
            camera,
            renderer,
          } = XR8.Threejs.xrScene()

          state.scene = scene
          state.camera = camera
          state.renderer = renderer

          renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2),
          )

          setStatus('주변을 천천히 움직여 공간을 인식하세요.')
        },

        onUpdate({
          processCpuResult,
          processGpuResult,
        }) {
          const reality =
            processCpuResult?.reality

          if (!reality) {
            return
          }

          state.trackingStatus =
            reality.trackingStatus || 'UNKNOWN'

          const now = performance.now()

          /*
           * hitTest는 매 프레임 실행하지 않고
           * 약 8Hz로 제한합니다.
           */
          if (now - state.sampleTimer > 125) {
            state.sampleTimer = now
            sampleCenterHit(XR8)
          }

          updateDebug({
            reason:
              reality.trackingReason || '-',

            points:
              reality.worldPoints?.length || 0,

            gpu:
              processGpuResult ? 'READY' : 'WAIT',
          })
        },

        onPaused() {
          setStatus('카메라가 일시 중지되었습니다.')
        },

        onResume() {
          setStatus('추적을 복구하는 중입니다.')
        },

        onException(error) {
          console.error(error)
          setStatus('AR 실행 중 오류가 발생했습니다.')
        },
      }
    }

    function startXR() {
      const XR8 = window.XR8

      if (!XR8) {
        setStatus('XR8 엔진을 불러오지 못했습니다.')
        return
      }

      XR8.XrController.configure({
        disableWorldTracking: false,
        enableWorldPoints: true,
        enableLighting: true,
        scale: 'absolute',
      })

      XR8.addCameraPipelineModules([
        XR8.GlTextureRenderer.pipelineModule(),
        XR8.Threejs.pipelineModule(),
        XR8.XrController.pipelineModule(),
        createPipelineModule(XR8),
      ])

      XR8.run({
        canvas,
        allowedDevices:
          XR8.XrConfig.device().ANY,
      })
    }

    function loadXR8Engine() {
      const script =
        document.createElement('script')

      script.src =
        'https://cdn.jsdelivr.net/npm/' +
        '@8thwall/engine-binary@1/dist/xr.js'

      script.async = true
      script.crossOrigin = 'anonymous'
      script.dataset.preloadChunks = 'slam'

      script.addEventListener('error', () => {
        setStatus('8th Wall 엔진 로딩에 실패했습니다.')
      })

      document.head.appendChild(script)

      if (window.XR8) {
        startXR()
      } else {
        window.addEventListener(
          'xrloaded',
          startXR,
          {once: true},
        )
      }
    }

    imageInput.addEventListener(
      'change',
      async (event) => {
        const file =
          event.target.files?.[0]

        if (!file) {
          return
        }

        try {
          await loadArtwork(file)
        } catch (error) {
          console.error(error)
          setStatus('이미지를 불러오지 못했습니다.')
        } finally {
          event.target.value = ''
        }
      },
    )

    placeButton.addEventListener(
      'click',
      placeArtwork,
    )

    resetButton.addEventListener(
      'click',
      () => {
        if (state.artwork) {
          state.artwork.visible = false
        }

        state.latestHit = null
        setReticleReady(false)
        setStatus('주변을 천천히 움직여 다시 인식하세요.')
      },
    )

    loadXR8Engine()
  </script>
</body>
</html>

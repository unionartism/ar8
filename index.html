function loadTexture(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file);new THREE.TextureLoader().load(url,t=>{URL.revokeObjectURL(url);resolve(t)},undefined,e=>{URL.revokeObjectURL(url);reject(e)})})}

const finite=p=>p&&Number.isFinite(p.x)&&Number.isFinite(p.y)&&Number.isFinite(p.z)

function prune(time){const map=new Map(),cell=.025;for(const item of s.samples){if(item.time<time-CFG.history)continue;const key=[Math.round(item.p.x/cell),Math.round(item.p.y/cell),Math.round(item.p.z/cell)].join(':');const old=map.get(key);if(!old||item.w>old.w||item.time>old.time)map.set(key,item)}s.samples=[...map.values()].sort((a,b)=>b.time-a.time).slice(0,CFG.maxSamples)}

function estimate(samples){if(!s.camera||samples.length<CFG.minSamples)return{wall:null,reason:`점 부족 ${samples.length}/${CFG.minSamples}`};s.camera.updateMatrixWorld(true);const cp=new THREE.Vector3();s.camera.getWorldPosition(cp);const threshold=THREE.MathUtils.clamp(.028+median(samples.map(x=>cp.distanceTo(x.p)))*.012,.035,.075);let best=null;for(let i=0;i<CFG.iterations;i++){const[a,b]=pair(samples.length),p=samples[a].p,q=samples[b].p,dx=q.x-p.x,dz=q.z-p.z,len=Math.hypot(dx,dz);if(len<.06)continue;const n=new THREE.Vector3(dz/len,0,-dx/len),inliers=[];let score=0,err=0;for(const x of samples){const d=Math.abs(n.x*(x.p.x-p.x)+n.z*(x.p.z-p.z));if(d<=threshold){inliers.push(x);score+=x.w;err+=d*d}}if(inliers.length<CFG.minInliers)continue;const quality=score+inliers.length*.2-Math.sqrt(err/inliers.length)*45;if(!best||quality>best.quality)best={inliers,quality}}if(!best)return{wall:null,reason:'수직 평면 후보 없음'};let total=0;const center=new THREE.Vector3();for(const x of best.inliers){center.addScaledVector(x.p,x.w);total+=x.w}center.multiplyScalar(1/Math.max(total,1e-6));let xx=0,xz=0,zz=0;for(const x of best.inliers){const dx=x.p.x-center.x,dz=x.p.z-center.z;xx+=x.w*dx*dx;xz+=x.w*dx*dz;zz+=x.w*dz*dz}const angle=.5*Math.atan2(2*xz,xx-zz),dir=new THREE.Vector3(Math.cos(angle),0,Math.sin(angle)),normal=new THREE.Vector3(-dir.z,0,dir.x).normalize();if(normal.dot(cp.clone().sub(center))<0)normal.negate();const inliers=[];let err=0;for(const x of samples){const d=Math.abs(normal.x*(x.p.x-center.x)+normal.z*(x.p.z-center.z));if(d<=threshold){inliers.push(x);err+=d*d}}if(inliers.length<CFG.minInliers)return{wall:null,reason:'평면 일치점 부족'};const right=new THREE.Vector3().crossVectors(UP,normal).normalize();let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;for(const x of inliers){const d=x.p.clone().sub(center),hx=d.dot(right),vy=d.y;minX=Math.min(minX,hx);maxX=Math.max(maxX,hx);minY=Math.min(minY,vy);maxY=Math.max(maxY,vy)}const extentWidth=maxX-minX,extentHeight=ma function scan(XR8,points,time){if(s.locked)return;if(s.tracking!=='NORMAL'){s.scanReason='추적 안정화 중';setMode(MODE.SCAN);return setStatus('공간 추적을 준비하는 중입니다. 주변을 천천히 비춰 주세요.')}collectHits(XR8,time);collectWorldPoints(points,time);prune(time);updateCandidate(estimate(s.samples),time)}
function cloneWall(w){return{position:w.position.clone(),normal:w.normal.clone(),quaternion:w.quaternion.clone(),plane:w.plane.clone(),distance:w.distance,extentWidth:w.extentWidth,extentHeight:w.extentHeight,rms:w.rms,confidence:w.confidence}}
function confirmWall(){if(!s.candidate?.confirmable)return setStatus('녹색 벽 후보가 나타난 뒤 다시 시도하세요.');s.locked=cloneWall(s.candidate);s.samples=[];showPreview(s.locked,'locked');setMode(MODE.LOCKED);setStatus('벽을 고정했습니다. 이미지를 선택한 뒤 배치하세요.')}
function placeArt(){if(!s.locked)return setStatus('먼저 벽을 확정하세요.');if(!s.art)return setStatus('먼저 이미지를 선택하세요.');s.art.position.copy(s.locked.position).addScaledVector(s.locked.normal,.008);s.art.quaternion.copy(s.locked.quaternion);s.art.visible=true;hidePreview();setMode(MODE.PLACED);setStatus('이미지를 고정된 벽에 배치했습니다.')}
function clearWall(){s.samples=[];s.raw=null;s.candidate=null;s.locked=null;s.stable=0;s.lastCandidate=0;s.scanReason='다시 스캔';if(s.art)s.art.visible=false;hidePreview();setMode(MODE.SCAN);setStatus('벽의 무늬나 모서리를 비추며 천천히 좌우로 움직이세요.')}
function resetAll(){clearWall();disposeArt();setStatus('초기화했습니다. 공간을 다시 스캔하세요.')}

function appModule(XR8){return{name:'wall-confirm-app',onCameraStatusChange({status}){s.cameraStatus=status||'UNKNOWN';if(status==='requesting')setStatus('카메라 권한을 요청하는 중입니다.');else if(status==='hasStream')setStatus('카메라 스트림을 준비하는 중입니다.');else if(status==='hasVideo')setStatus('공간 추적을 시작합니다.');else if(status==='failed')showError('카메라를 시작하지 못했습니다.\n브라우저의 카메라 권한을 확인하세요.')},onStart(){const{scene,camera,renderer}=XR8.Threejs.xrScene();s.scene=scene;s.camera=camera;s.renderer=renderer;makePreview();enableFile(true);setMode(MODE.SCAN);scheduleFit();setStatus('벽의 무늬나 모서리를 비추며 천천히 좌우로 움직이세요.')},onAttach({videoWidth,videoHeight,orientation}){s.videoWidth=videoWidth||s.videoWidth;s.videoHeight=videoHeight||s.videoHeight;s.orientation=orientation??s.orientation;scheduleFit()},onCanvasSizeChange(){if(!s.resizing)scheduleFit(20)},onVideoSizeChange({videoWidth,videoHeight,orientation}){s.videoWidth=videoWidth||s.videoWidth;s.videoHeight=videoHeight||s.videoHeight;s.orientation=orientation??s.orientation;scheduleFit(20)},onDeviceOrientationChange({videoWidth,videoHeight,orientation}){s.videoWidth=videoWidth||s.videoWidth;s.videoHeight=videoHeight||s.videoHeight;s.orientation=orientation??s.orientation;s.lastW=0;s.lastH=0;scheduleFit(150)},onUpdate({processCpuResult,processGpuResult}){const reality=processCpuResult?.reality;if(!reality)return;s.tracking=reality.trackingStatus||'UNKNOWN';s.trackingReason=reality.trackingReason||null;const now=performance.now();if(!s.locked&&now-s.scanAt>=CFG.interval){s.scanAt=now;scan(XR8,reality.worldPoints||[],now)}if(now-s.debugAt>=300){s.debugAt=now;updateDebug({inliers:s.candidate?`${s.candidate.inlierCount}/${s.candidate.totalCount}`:'-',error:s.candidate?`${(s.candidate.rms*100).toFixed(1)}cm`:'-',extent:s.candidate?`${s.candidate.extentWidth.toFixed(2)}×${s.candidate.extentHeight.toFixed(2)}m`:'-',confidence:s.candidate?s.candidate.confidence.toFixed(2):'-',distance:s.candidate?`${s.candidate.distance.toFixed(2)}m`:s.locked?`${s.locked.distance.toFixed(2)}m`:'-',gpu:processGpuResult?'READY':'WAIT'});scheduleFit()}},onPaused(){setStatus('카메라가 일시 중지되었습니다.')},onResume(){if(!s.locked)clearWall();scheduleFit(100)},onException(e){console.error(e);showError('AR 실행 중 오류가 발생했습니다.\n페이지를 새로고침하고 다시 시도하세요.')}}}
function startXR(XR8){if(s.started)return;s.started=true;s.XR8=XR8;XR8.XrController.configure({disableWorldTracking:false,enableWorldPoints:true,enableLighting:true,scale:'absolute'});XR8.addCameraPipelineModules([XR8.GlTextureRenderer.pipelineModule(),XR8.Threejs.pipelineModule(),XR8.XrController.pipelineModule(),appModule(XR8)]);const options={canvas};if(XR8.XrConfig?.device)options.allowedDevices=XR8.XrConfig.device().ANY;XR8.run(options)}

confirmBtn.addEventListener('click',e=>{e.preventDefault();confirmWall()})
fileInput.addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{await loadArt(file)}catch(err){console.error(err);setStatus(err instanceof Error?err.message:'이미지를 불러오지 못했습니다.')}finally{e.target.value=''}})
placeBtn.addEventListener('click',e=>{e.preventDefault();placeArt()})
rescanBtn.addEventListener('click',e=>{e.preventDefault();clearWall()})
resetBtn.addEventListener('click',e=>{e.preventDefault();resetAll()})
reloadBtn.addEventListener('click',()=>location.reload())
controls.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true})
addEventListener('resize',()=>scheduleFit(50),{passive:true});addEventListener('orientationchange',()=>scheduleFit(180),{passive:true});window.visualViewport?.addEventListener('resize',()=>scheduleFit(50),{passive:true})
new MutationObserver(()=>requestAnimationFrame(enforceUi)).observe(document.body,{childList:true})

async function init(){if(s.loading)return;s.loading=true;errorPanel.classList.remove('show');enableFile(false);enforceUi();fitCanvas();updateDebug();try{if(!isSecureContext)throw new Error('카메라 사용에는 HTTPS 연결이 필요합니다.\nGitHub Pages의 HTTPS 주소에서 실행하세요.');setStatus('AR 추적 엔진을 불러오는 중입니다.');const XR8=await loadXR();setStatus('AR 카메라를 시작하는 중입니다.');startXR(XR8)}catch(e){console.error(e);showError(e instanceof Error?e.message:'AR 초기화에 실패했습니다.')}finally{s.loading=false}}
init()
</script>
</body>
</html>

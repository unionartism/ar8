<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>8th Wall 벽면 거리 측정 및 이미지 배치 AR 테스트 (수정본)</title>

    <!-- 8th Wall Engine Binary -->
    <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous"
        data-preload-chunks="slam"></script>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            touch-action: none;
        }

        #camerafeed {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            display: block;
            background: #000;
        }

        #start-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at center, rgba(0, 122, 255, 0.28), rgba(0, 0, 0, 0.95) 62%),
                #000;
        }

        .start-card {
            width: min(420px, 100%);
            padding: 26px 22px;
            border-radius: 24px;
            background: rgba(12, 16, 24, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
            text-align: center;
            backdrop-filter: blur(14px);
        }

        .start-title {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .start-desc {
            font-size: 14px;
            line-height: 1.5;
            opacity: 0.82;
            margin-bottom: 20px;
        }

        #start-btn {
            width: 100%;
            padding: 16px 18px;
            border: 0;
            border-radius: 15px;
            font-size: 17px;
            font-weight: 900;
            color: #fff;
            background: #007aff;
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(0, 122, 255, 0.35);
        }

        #start-btn:active {
            transform: scale(0.98);
        }

        #start-btn:disabled {
            opacity: 0.65;
            cursor: default;
        }

        #start-error {
            margin-top: 14px;
            font-size: 13px;
            line-height: 1.45;
            color: #ffcc00;
            min-height: 18px;
        }

        #ui-layer {
            position: fixed;
            inset: 0;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #top-panel {
            padding: 20px;
            padding-top: calc(12px + env(safe-area-inset-top, 0px));
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.82), rgba(0, 0, 0, 0));
        }

        #step-title {
            font-size: 18px;
            font-weight: 900;
            color: #00ff66;
            margin-bottom: 6px;
        }

        #guide-text {
            font-size: 14px;
            line-height: 1.45;
            opacity: 0.92;
        }

        #bottom-panel {
            display: none;
            padding: 15px;
            padding-bottom: calc(15px + env(safe-area-inset-bottom, 0px));
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(12px);
            pointer-events: auto;
        }

        .row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            min-height: 54px;
            padding: 14px 12px;
            border: 0;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 900;
            color: #fff;
            background: #007aff;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
        }

        button.danger {
            flex: 0.38;
            background: #2f333a;
            color: #d1d5db;
            font-size: 14px;
        }

        button:active {
            transform: scale(0.97);
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        #result {
            padding: 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.11);
            font-size: 15px;
            line-height: 1.5;
            text-align: center;
            min-height: 54px;
        }

        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 30px;
            height: 30px;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
            border: 2px solid #00ff66;
            border-radius: 50%;
            display: none;
        }

        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: currentColor;
            color: inherit;
        }

        #crosshair::before {
            top: 50%;
            left: -5px;
            right: -5px;
            height: 2px;
            transform: translateY(-50%);
        }

        #crosshair::after {
            left: 50%;
            top: -5px;
            bottom: -5px;
            width: 2px;
            transform: translateX(-50%);
        }

        body.step-wallFloor #crosshair {
            color: #00d4ff;
            border-color: #00d4ff;
        }

        body.step-toe #crosshair {
            color: #ffe600;
            border-color: #ffe600;
        }

        body.step-placeImage #crosshair {
            color: #ff00ff;
            border-color: #ff00ff;
        }

        body.step-done #crosshair {
            color: #fff;
            border-color: #fff;
        }
    </style>
</head>

<body>
    <canvas id="camerafeed"></canvas>

    <div id="crosshair"></div>

    <div id="start-screen">
        <div class="start-card">
            <div class="start-title">AR 측정 시작</div>
            <div class="start-desc">
                카메라 권한을 허용한 뒤, 벽과 바닥이 만나는 지점을 기준으로 거리를 측정하고 이미지를 배치합니다.
            </div>
            <button id="start-btn">START AR</button>
            <div id="start-error"></div>
        </div>
    </div>

    <div id="ui-layer">
        <div id="top-panel">
            <div id="step-title">AR 준비</div>
            <div id="guide-text">아래 [START AR] 버튼을 눌러 카메라와 공간 인식을 시작하세요.</div>
        </div>

        <div id="bottom-panel">
            <div id="result">주변 공간을 천천히 비춰주세요.</div>
            <div class="row">
                <button id="action-btn">기준점 찍기</button>
                <button id="reset-btn" class="danger">초기화</button>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        window.THREE = THREE;

        const canvas = document.getElementById('camerafeed');
        const startScreen = document.getElementById('start-screen');
        const startBtn = document.getElementById('start-btn');
        const startError = document.getElementById('start-error');

        const uiBottom = document.getElementById('bottom-panel');
        const stepTitle = document.getElementById('step-title');
        const guideText = document.getElementById('guide-text');
        const resultEl = document.getElementById('result');
        const actionBtn = document.getElementById('action-btn');
        const resetBtn = document.getElementById('reset-btn');
        const crosshair = document.getElementById('crosshair');

        let scene = null;
        let camera = null;
        let renderer = null;

        let xrStarted = false;
        let pipelineInstalled = false;
        let step = 'ready';

        let currentHitPosition = null;
        let lastHitPosition = null;
        let stableHitFrames = 0;
        let hasRecentHit = false;

        let wallFloorMesh = null;
        let toeMesh = null;
        let lineMesh = null;
        let imagePlane = null;

        let savedDistanceText = '';
        let imageLoadToken = 0;
        let isLoadingImage = false;
        let autoStatusLockedUntil = 0;

        const TARGET_IMAGE_WIDTH_M = 0.4;
        const TARGET_IMAGE_HEIGHT_M = 0.5;
        const IMAGE_URL = 'https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=500';

        // 개선 1: 흔들림 방지를 위해 특징점 뿐만 아니라 정밀 추정 표면 레이어(ESTIMATED_SURFACE)를 함께 활용
        const HIT_TYPES = ['ESTIMATED_SURFACE', 'FEATURE_POINT'];

        const HIT_STABLE_DISTANCE_M = 0.05;
        const HIT_STABLE_FRAMES_REQUIRED = 3;
        const DISTANCE_LINE_RADIUS_M = 0.006;
        const MIN_IMAGE_DISTANCE_M = 0.3; // 벽면 레이캐스트 안전 마진 최적화

        startBtn.addEventListener('click', startAR);
        actionBtn.addEventListener('click', onActionTriggered);
        resetBtn.addEventListener('click', resetMeasurement);

        window.addEventListener('resize', () => {
            if (!renderer) return;
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function setResultHTML(html, lockMs = 0) {
            resultEl.innerHTML = html;
            if (lockMs > 0) {
                autoStatusLockedUntil = performance.now() + lockMs;
            }
        }

        function setResultText(text, lockMs = 0) {
            resultEl.textContent = text;
            if (lockMs > 0) {
                autoStatusLockedUntil = performance.now() + lockMs;
            }
        }

        function waitForXR8() {
            return new Promise((resolve, reject) => {
                if (window.XR8) {
                    resolve(window.XR8);
                    return;
                }
                const timeoutId = setTimeout(() => {
                    reject(new Error('8th Wall Engine을 불러오지 못했습니다.'));
                }, 12000);

                window.addEventListener('xrloaded', () => {
                    clearTimeout(timeoutId);
                    resolve(window.XR8);
                }, { once: true });
            });
        }

        async function startAR() {
            if (xrStarted) return;
            startBtn.disabled = true;
            startBtn.textContent = 'AR 준비 중...';
            startError.textContent = '';

            try {
                const XR8 = await waitForXR8();

                XR8.XrController.configure({
                    disableWorldTracking: false,
                    scale: 'absolute'
                });

                if (!pipelineInstalled) {
                    XR8.addCameraPipelineModules([
                        XR8.GlTextureRenderer.pipelineModule(),
                        XR8.Threejs.pipelineModule(),
                        XR8.XrController.pipelineModule(),
                        arMeasurePipelineModule()
                    ]);
                    pipelineInstalled = true;
                }

                XR8.run({
                    canvas,
                    allowedDevices: XR8.XrConfig.device().ANY
                });

                xrStarted = true;
                startScreen.style.display = 'none';
                uiBottom.style.display = 'block';
                crosshair.style.display = 'block';

                setStep('wallFloor');
            } catch (error) {
                startBtn.disabled = false;
                startBtn.textContent = 'START AR';
                startError.textContent = error.message || 'AR 시작 중 오류가 발생했습니다.';
            }
        }

        function arMeasurePipelineModule() {
            return {
                name: 'unionart-ar-measure',
                onStart: () => {
                    const XR8 = window.XR8;
                    const xrScene = XR8.Threejs.xrScene();

                    scene = xrScene.scene;
                    camera = xrScene.camera;
                    renderer = xrScene.renderer;

                    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
                    renderer.setSize(window.innerWidth, window.innerHeight);

                    scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3));
                    const light = new THREE.DirectionalLight(0xffffff, 1.2);
                    light.position.set(0.5, 1, 0.25);
                    scene.add(light);
                },
                onUpdate: () => {
                    updateHitTest();
                    // 애니메이션 및 줄자 실시간 업데이트 유지
                    if (step === 'placeImage' && lineMesh && wallFloorMesh && toeMesh) {
                        updateDistanceLineMesh(lineMesh, wallFloorMesh.position, toeMesh.position);
                    }
                    updateStatusText();
                }
            };
        }

        function updateHitTest() {
            const XR8 = window.XR8;
            if (!XR8 || !canvas) {
                resetHitStability();
                return;
            }

            let hitResults = [];
            try {
                hitResults = XR8.XrController.hitTest(0.5, 0.5, HIT_TYPES) || [];
            } catch (error) {
                hitResults = [];
            }

            const hit = hitResults[0];
            const position = hit ? getPositionFromHit(hit) : null;

            if (!position) {
                resetHitStability();
                return;
            }
            updateHitStability(position);
        }

        function updateHitStability(position) {
            if (lastHitPosition && lastHitPosition.distanceTo(position) < HIT_STABLE_DISTANCE_M) {
                stableHitFrames = Math.min(stableHitFrames + 1, HIT_STABLE_FRAMES_REQUIRED);
            } else {
                stableHitFrames = 1;
            }

            lastHitPosition = position.clone();
            currentHitPosition = position.clone();
            hasRecentHit = stableHitFrames >= HIT_STABLE_FRAMES_REQUIRED;
        }

        function resetHitStability() {
            currentHitPosition = null;
            lastHitPosition = null;
            stableHitFrames = 0;
            hasRecentHit = false;
        }

        function getPositionFromHit(hit) {
            const candidates = [
                hit.position, hit.worldPosition, hit.point, hit.intersection,
                hit.transform && hit.transform.position, hit.pose && hit.pose.position
            ];

            for (const p of candidates) {
                if (!p) continue;
                if (Array.isArray(p) && p.length >= 3) {
                    const x = Number(p[0]), y = Number(p[1]), z = Number(p[2]);
                    if (Number.isFinite(x) && Number.isFinite(y) && Number.isFinite(z)) {
                        return new THREE.Vector3(x, y, z);
                    }
                }
                if (typeof p.x === 'number' && typeof p.y === 'number' && typeof p.z === 'number' &&
                    Number.isFinite(p.x) && Number.isFinite(p.y) && Number.isFinite(z)) {
                    return new THREE.Vector3(p.x, p.y, p.z);
                }
            }
            return null;
        }

        function setStep(nextStep) {
            step = nextStep;
            document.body.classList.remove('step-ready', 'step-wallFloor', 'step-toe', 'step-placeImage', 'step-done');
            document.body.classList.add(`step-${step}`);

            if (step === 'wallFloor') {
                stepTitle.textContent = '1단계: 벽/바닥 기준점';
                stepTitle.style.color = '#00d4ff';
                guideText.textContent = '벽면과 바닥이 만나는 모서리 지점을 조준점에 맞추고 버튼을 누르세요.';
                actionBtn.textContent = '기준점 찍기';
                actionBtn.style.background = '#00d4ff';
                actionBtn.style.color = '#fff';
            } else if (step === 'toe') {
                stepTitle.textContent = '2단계: 사용자의 발끝';
                stepTitle.style.color = '#ffe600';
                guideText.textContent = '한 걸음 물러선 대상의 발끝 지점을 조준점에 맞추고 버튼을 누르세요.';
                actionBtn.textContent = '발끝 찍기';
                actionBtn.style.background = '#ffe600';
                actionBtn.style.color = '#000';
            } else if (step === 'placeImage') {
                stepTitle.textContent = '3단계: 벽면 이미지 배치';
                stepTitle.style.color = '#ff00ff';
                guideText.textContent = '원하는 벽면 위치를 조준점에 맞춘 뒤 버튼을 눌러 이미지를 배치하세요.';
                actionBtn.textContent = '작품 배치하기';
                actionBtn.style.background = '#ff00ff';
                actionBtn.style.color = '#fff';
            } else if (step === 'done') {
                stepTitle.textContent = '배치 완료';
                stepTitle.style.color = '#00ff66';
                guideText.textContent = '줄자와 이미지가 고정되었습니다. 자유롭게 확인해 보세요.';
                actionBtn.textContent = '완료됨';
                actionBtn.style.background = '#374151';
                actionBtn.style.color = '#fff';
            }
        }

        function onActionTriggered() {
            if (!scene || !camera) {
                setResultHTML('<span style="color:#ffcc00; font-weight:900;">AR 장면을 준비 중입니다.</span>', 1800);
                return;
            }
            if (isLoadingImage) return;

            if (!hasRecentHit && step !== 'placeImage') {
                setResultHTML('<span style="color:#ffcc00; font-weight:900;">위치가 안정적으로 인식되지 않았습니다. 조준점을 잠시 고정해주세요.</span>', 1800);
                return;
            }

            if (step === 'wallFloor') {
                const confirmedPosition = currentHitPosition.clone();
                wallFloorMesh = createPointMesh(0x00d4ff);
                wallFloorMesh.position.copy(confirmedPosition);
                scene.add(wallFloorMesh);

                // 개선 2: Three.js 강제 업데이트를 통해 다음 연산에서 NaN 에러 완전 원천 봉쇄
                wallFloorMesh.updateMatrixWorld(true);

                setResultHTML('벽/바닥 기준점 등록 완료!', 900);
                setStep('toe');

            } else if (step === 'toe') {
                const confirmedPosition = currentHitPosition.clone();
                toeMesh = createPointMesh(0xffe600);
                toeMesh.position.copy(confirmedPosition);
                scene.add(toeMesh);
                
                toeMesh.updateMatrixWorld(true);

                lineMesh = createDistanceLineMesh(0x00ff66);
                scene.add(lineMesh);

                // Y축(높이) 편차를 완전히 소거하여 순수 바닥 평면상의 2D 거리 도출
                const dx = wallFloorMesh.position.x - toeMesh.position.x;
                const dz = wallFloorMesh.position.z - toeMesh.position.z;
                const distanceInMeters = Math.sqrt(dx * dx + dz * dz);
                const distanceInCm = Math.round(distanceInMeters * 100);

                savedDistanceText = `<span style="font-size:1.2em; color:#ffe600; font-weight:900;">★ 벽 ↔ 발끝 거리: ${distanceInCm}cm</span>`;
                setResultHTML(savedDistanceText + '<br><span style="color:#ff00ff;">원하는 벽면 위치를 조준점에 맞추고 버튼을 누르세요.</span>', 2000);

                // 줄자 메쉬 즉시 강제 갱신
                updateDistanceLineMesh(lineMesh, wallFloorMesh.position, toeMesh.position);
                setStep('placeImage');

            } else if (step === 'placeImage') {
                placeImageOnVirtualWall();
            }
        }

        function createPointMesh(color) {
            const geometry = new THREE.SphereGeometry(0.02, 32, 32);
            const material = new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0 });
            return new THREE.Mesh(geometry, material);
        }

        function createDistanceLineMesh(color) {
            const geometry = new THREE.CylinderGeometry(DISTANCE_LINE_RADIUS_M, DISTANCE_LINE_RADIUS_M, 1, 16);
            const material = new THREE.MeshBasicMaterial({ color });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.visible = false;
            return mesh;
        }

        function updateDistanceLineMesh(mesh, start, end) {
            const direction = new THREE.Vector3().subVectors(end, start);
            const length = direction.length();

            if (length < 0.001) {
                mesh.visible = false;
                return;
            }
            mesh.visible = true;
            const midpoint = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
            mesh.position.copy(midpoint);

            const yAxis = new THREE.Vector3(0, 1, 0);
            direction.normalize();
            mesh.quaternion.setFromUnitVectors(yAxis, direction);
            mesh.scale.set(1, length, 1);
            mesh.updateMatrixWorld(true);
        }

        function placeImageOnVirtualWall() {
            if (!wallFloorMesh || !toeMesh || !camera) return;

            const cameraWorldPosition = new THREE.Vector3();
            camera.updateMatrixWorld(true);
            camera.getWorldPosition(cameraWorldPosition);

            // 가상 벽면 법선 추출
            let wallNormal = new THREE.Vector3().subVectors(toeMesh.position, wallFloorMesh.position);
            wallNormal.y = 0;
            if (wallNormal.lengthSq() < 0.0001) {
                const camDir = new THREE.Vector3();
                camera.getWorldDirection(camDir);
                wallNormal.copy(camDir).multiplyScalar(-1);
                wallNormal.y = 0;
            }
            wallNormal.normalize();

            const wallPlane = new THREE.Plane().setFromNormalAndCoplanarPoint(wallNormal, wallFloorMesh.position);
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            let targetPoint = new THREE.Vector3();
            const intersects = raycaster.ray.intersectPlane(wallPlane, targetPoint);

            // 개선 3: 가상 평면 충돌 감지 유실 예외 처리(사라짐 방지 안전장치)
            if (!intersects) {
                const cameraDirection = new THREE.Vector3();
                camera.getWorldDirection(cameraDirection);
                targetPoint.copy(cameraWorldPosition).addScaledVector(cameraDirection, 1.5);
                targetPoint.y = wallFloorMesh.position.y + 1.0; // 바닥 기준 약 1m 높이에 강제 고정
            }

            // z-fighting 제거 및 벽면 평행 배치 설정
            const imageWorldPosition = targetPoint.clone().addScaledVector(wallNormal, 0.02);
            const imageQuaternion = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), wallNormal);

            const token = ++imageLoadToken;
            isLoadingImage = true;
            actionBtn.disabled = true;

            setResultHTML(savedDistanceText + '<br><span style="color:#ff00ff;">이미지를 불러오는 중입니다...</span>');

            const textureLoader = new THREE.TextureLoader();
            textureLoader.setCrossOrigin('anonymous');
            textureLoader.load(
                IMAGE_URL,
                (texture) => {
                    if (token !== imageLoadToken || step !== 'placeImage') {
                        texture.dispose();
                        return;
                    }
                    isLoadingImage = false;
                    actionBtn.disabled = false;

                    if (texture.colorSpace !== undefined) {
                        texture.colorSpace = THREE.SRGBColorSpace;
                    }

                    const imageGeometry = new THREE.PlaneGeometry(TARGET_IMAGE_WIDTH_M, TARGET_IMAGE_HEIGHT_M);
                    const imageMaterial = new THREE.MeshBasicMaterial({
                        map: texture,
                        side: THREE.DoubleSide,
                        toneMapped: false
                    });

                    imagePlane = new THREE.Mesh(imageGeometry, imageMaterial);
                    imagePlane.position.copy(imageWorldPosition);
                    imagePlane.quaternion.copy(imageQuaternion);
                    scene.add(imagePlane);

                    // 개선 4: 렌더 트리 고정 행렬 선언으로 흔들림(Drift) 현상 근본적 제거
                    imagePlane.matrixAutoUpdate = false;
                    imagePlane.updateMatrix();
                    imagePlane.updateMatrixWorld(true);

                    setResultHTML(savedDistanceText + '<br><span style="color:#00ff66;">가상 벽면에 이미지 배치 완료!</span>');
                    setStep('done');
                },
                undefined,
                () => {
                    isLoadingImage = false;
                    actionBtn.disabled = false;
                    setResultHTML(savedDistanceText + '<br><span style="color:#ffcc00;">이미지 로딩 실패. CORS를 확인하세요.</span>', 2600);
                }
            );
        }

        function updateStatusText() {
            if (performance.now() < autoStatusLockedUntil) return;
            if (step === 'wallFloor') {
                setResultText(hasRecentHit ? '조준 완료! [기준점 찍기]를 누르세요.' : '벽과 바닥이 만나는 지점을 정조준 하세요.');
            } else if (step === 'toe') {
                setResultText(hasRecentHit ? '조준 완료! [발끝 찍기]를 누르세요.' : '사용자 발끝 지점을 정조준 하세요.');
            }
        }

        function resetMeasurement() {
            imageLoadToken++;
            isLoadingImage = false;
            autoStatusLockedUntil = 0;

            if (wallFloorMesh) { disposeObject(wallFloorMesh); wallFloorMesh = null; }
            if (toeMesh) { disposeObject(toeMesh); toeMesh = null; }
            if (lineMesh) { disposeObject(lineMesh); lineMesh = null; }
            if (imagePlane) { disposeObject(imagePlane); imagePlane = null; }

            savedDistanceText = '';
            setStep('wallFloor');
            setResultText('초기화되었습니다. 주변 공간을 다시 비춰주세요.', 1500);
        }

        function disposeObject(obj) {
            if (!obj) return;
            scene.remove(obj);
            if (obj.geometry) obj.geometry.dispose();
            if (obj.material) {
                if (Array.isArray(obj.material)) {
                    obj.material.forEach(m => {
                        if (m.map) m.map.dispose();
                        m.dispose();
                    });
                } else {
                    if (obj.material.map) obj.material.map.dispose();
                    obj.material.dispose();
                }
            }
        }
    </script>
</body>

</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#000000" />
  <title>Wall Art AR</title>

  <style>
    :root {
      --app-height: 100dvh;
      --safe-top: max(14px, env(safe-area-inset-top));
      --safe-bottom: max(14px, env(safe-area-inset-bottom));
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #000;
    }

    body {
      position: fixed;
      inset: 0;
      height: var(--app-height);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
    }

    #camerafeed {
      position: fixed !important;
      inset: 0 !important;
      z-index: 0 !important;
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      background: #000 !important;
    }

    #gestureLayer {
      position: fixed;
      inset: 0;
      z-index: 20;
      touch-action: none;
      pointer-events: auto;
    }

    #uiRoot {
      position: fixed !important;
      inset: 0 !important;
      z-index: 2147483647 !important;
      display: block !important;
      width: 100vw !important;
      height: var(--app-height) !important;
      pointer-events: none !important;
      isolation: isolate;
    }

    #topPanel {
      position: absolute;
      top: var(--safe-top);
      left: 50%;
      z-index: 50;
      width: min(92vw, 520px);
      transform: translateX(-50%);
      pointer-events: none;
    }

    #stepBadge {
      width: max-content;
      max-width: 100%;
      margin: 0 auto 8px;
      padding: 7px 11px;
      overflow: hidden;
      border: 1px solid rgb(255 255 255 / 18%);
      border-radius: 999px;
      background: rgb(0 0 0 / 70%);
      color: #9fe7ff;
      font-size: 12px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
      backdrop-filter: blur(12px);
    }

    #status {
      padding: 12px 14px;
      border: 1px solid rgb(255 255 255 / 18%);
      border-radius: 16px;
      background: rgb(0 0 0 / 72%);
      color: #fff;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.45;
      text-align: center;
      box-shadow: 0 8px 28px rgb(0 0 0 / 28%);
      backdrop-filter: blur(12px);
    }

    #distanceBadge {
      display: none;
      width: max-content;
      max-width: calc(100vw - 28px);
      margin: 8px auto 0;
      padding: 7px 11px;
      overflow: hidden;
      border: 1px solid rgb(91 214 255 / 30%);
      border-radius: 999px;
      background: rgb(0 34 48 / 78%);
      color: #bcefff;
      font-size: 12px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
      backdrop-filter: blur(10px);
    }

    #distanceBadge.visible {
      display: block;
    }

    #reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 40;
      width: 52px;
      height: 52px;
      border: 2px solid rgb(255 255 255 / 92%);
      border-radius: 50%;
      color: #fff;
      transform: translate(-50%, -50%);
      box-shadow:
        0 0 0 1px rgb(0 0 0 / 55%),
        0 0 22px rgb(255 255 255 / 18%);
      pointer-events: none;
      transition: 160ms ease;
    }

    #reticle::before,
    #reticle::after {
      position: absolute;
      top: 50%;
      left: 50%;
      background: currentColor;
      content: "";
      transform: translate(-50%, -50%);
    }

    #reticle::before {
      width: 20px;
      height: 1px;
    }

    #reticle::after {
      width: 1px;
      height: 20px;
    }

    #reticle.ready {
      width: 60px;
      height: 60px;
      border-color: #59f49a;
      color: #59f49a;
      box-shadow:
        0 0 0 1px rgb(0 0 0 / 55%),
        0 0 30px rgb(89 244 154 / 48%);
    }

    #reticle.warning {
      border-color: #ffd166;
      color: #ffd166;
    }

    #hintArrow {
      position: absolute;
      top: calc(50% + 42px);
      left: 50%;
      z-index: 41;
      padding: 6px 9px;
      border-radius: 999px;
      background: rgb(0 0 0 / 60%);
      color: rgb(255 255 255 / 88%);
      font-size: 11px;
      font-weight: 700;
      transform: translateX(-50%);
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    #bottomPanel {
      position: absolute;
      right: 12px;
      bottom: var(--safe-bottom);
      left: 12px;
      z-index: 60;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      pointer-events: none;
    }

    #primaryActions,
    #secondaryActions {
      display: flex;
      width: 100%;
      max-width: 560px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      pointer-events: auto;
    }

    button,
    .fileButton {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      border: 0;
      border-radius: 999px;
      background: rgb(255 255 255 / 96%);
      color: #111;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
      box-shadow: 0 7px 22px rgb(0 0 0 / 34%);
      cursor: pointer;
      user-select: none;
      pointer-events: auto;
    }

    button.primary {
      min-width: min(72vw, 280px);
      background: #59f49a;
    }

    button.blue {
      background: #65d7ff;
    }

    button.dark {
      border: 1px solid rgb(255 255 255 / 20%);
      background: rgb(0 0 0 / 72%);
      color: #fff;
      backdrop-filter: blur(10px);
    }

    button:active,
    .fileButton:active {
      transform: scale(0.97);
    }

    button:disabled,
    .fileButton.disabled {
      cursor: default;
      opacity: 0.4;
      transform: none;
    }

    #imageInput {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    #gestureHelp {
      display: none;
      padding: 8px 12px;
      border: 1px solid rgb(255 255 255 / 15%);
      border-radius: 999px;
      background: rgb(0 0 0 / 68%);
      color: rgb(255 255 255 / 86%);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      backdrop-filter: blur(10px);
      pointer-events: none;
    }

    #gestureHelp.visible {
      display: block;
    }

    #debug {
      position: absolute;
      right: 8px;
      bottom: calc(var(--safe-bottom) + 116px);
      z-index: 45;
      display: none;
      max-width: 220px;
      padding: 8px 10px;
      border: 1px solid rgb(255 255 255 / 14%);
      border-radius: 9px;
      background: rgb(0 0 0 / 68%);
      color: #fff;
      font: 10px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    #debug.visible {
      display: block;
    }

    #errorPanel {
      position: absolute;
      inset: 0;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgb(0 0 0 / 95%);
      text-align: center;
      pointer-events: auto;
    }

    #errorPanel.visible {
      display: flex;
    }

    #errorPanelContent {
      width: min(100%, 460px);
    }

    #errorTitle {
      margin: 0 0 12px;
      font-size: 22px;
    }

    #errorMessage {
      margin: 0 0 22px;
      color: rgb(255 255 255 / 78%);
      font-size: 15px;
      line-height: 1.65;
      white-space: pre-line;
    }

    @media (max-width: 390px) {
      button,
      .fileButton {
        min-height: 44px;
        padding: 0 12px;
        font-size: 12px;
      }

      #status {
        font-size: 13px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.172.0/build/three.module.min.js"
      }
    }
  </script>
</head>

<body>
  <canvas id="camerafeed"></canvas>
  <div id="gestureLayer" aria-hidden="true"></div>

  <div id="uiRoot">
    <section id="topPanel">
      <div id="stepBadge">준비 중</div>
      <div id="status">AR 엔진을 불러오는 중입니다.</div>
      <div id="distanceBadge"></div>
    </section>

    <div id="reticle"></div>
    <div id="hintArrow">화면 중앙을 기준점에 맞추세요</div>

    <pre id="debug"></pre>

    <section id="bottomPanel">
      <div id="gestureHelp">한 손가락 드래그: 위치 이동 · 두 손가락 핀치: 크기 조절</div>

      <div id="primaryActions">
        <button id="captureButton" class="primary" type="button" disabled>
          ① 벽 아래점 찍기
        </button>
      </div>

      <div id="secondaryActions">
        <label id="fileButton" class="fileButton disabled" for="imageInput">
          이미지 선택
          <input id="imageInput" type="file" accept="image/*" disabled />
        </label>

        <button id="replaceButton" class="dark" type="button" hidden>
          다시 측정
        </button>

        <button id="resetButton" class="dark" type="button">
          전체 초기화
        </button>

        <button id="debugButton" class="dark" type="button">
          진단
        </button>
      </div>
    </section>

    <section id="errorPanel">
      <div id="errorPanelContent">
        <h1 id="errorTitle">AR을 실행할 수 없습니다</h1>
        <p id="errorMessage"></p>
        <button id="reloadButton" type="button">다시 불러오기</button>
      </div>
    </section>
  </div>

  <script type="module">
    import * as THREE from 'three'

    window.THREE = THREE

    const XR8_ENGINE_URL =
      'https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js'

    const WORLD_UP = new THREE.Vector3(0, 1, 0)
    const CENTER_NDC = new THREE.Vector2(0, 0)

    const MODES = Object.freeze({
      WALL_POINT: 'WALL_POINT',
      FOOT_POINT: 'FOOT_POINT',
      AIM: 'AIM',
      PLACED: 'PLACED',
    })

    const state = {
      XR8: null,
      scene: null,
      camera: null,
      renderer: null,

      mode: MODES.WALL_POINT,
      xrStarted: false,
      xrLoading: false,
      trackingStatus: 'INITIALIZING',
      trackingReason: null,
      cameraStatus: 'IDLE',

      currentCenterHit: null,
      lastHitSampleTime: 0,
      lastDebugTime: 0,

      wallFloorPoint: null,
      footPoint: null,
      wallNormal: null,
      wallPlane: null,
      wallQuaternion: null,
      wallDistance: 0,

      artworkGroup: null,
      artworkMesh: null,
      artworkTexture: null,
      artworkWidth: 0.7,
      artworkHeight: 0.5,
      artworkScale: 1,
      artworkLoaded: false,
      previewPosition: null,

      wallPointMarker: null,
      footPointMarker: null,
      measureLine: null,
      wallBaseLine: null,

      pointers: new Map(),
      dragOffset: new THREE.Vector3(),
      dragActive: false,
      pinchStartDistance: 0,
      pinchStartScale: 1,
    }

    const canvas = document.querySelector('#camerafeed')
    const gestureLayer = document.querySelector('#gestureLayer')
    const uiRoot = document.querySelector('#uiRoot')
    const stepBadge = document.querySelector('#stepBadge')
    const statusElement = document.querySelector('#status')
    const distanceBadge = document.querySelector('#distanceBadge')
    const reticle = document.querySelector('#reticle')
    const hintArrow = document.querySelector('#hintArrow')
    const captureButton = document.querySelector('#captureButton')
    const imageInput = document.querySelector('#imageInput')
    const fileButton = document.querySelector('#fileButton')
    const replaceButton = document.querySelector('#replaceButton')
    const resetButton = document.querySelector('#resetButton')
    const debugButton = document.querySelector('#debugButton')
    const debugElement = document.querySelector('#debug')
    const gestureHelp = document.querySelector('#gestureHelp')
    const errorPanel = document.querySelector('#errorPanel')
    const errorMessage = document.querySelector('#errorMessage')
    const reloadButton = document.querySelector('#reloadButton')

    function setStatus(message) {
      statusElement.textContent = message
    }

    function setStep(label) {
      stepBadge.textContent = label
    }

    function showError(message) {
      errorMessage.textContent = message
      errorPanel.classList.add('visible')
      enforceLayerOrder()
    }

    function hideError() {
      errorPanel.classList.remove('visible')
    }

    function enableImageInput(enabled) {
      imageInput.disabled = !enabled
      fileButton.classList.toggle('disabled', !enabled)
    }

    function updateViewportHeight() {
      const height = Math.round(window.visualViewport?.height ?? window.innerHeight)
      document.documentElement.style.setProperty('--app-height', `${height}px`)
    }

    function enforceLayerOrder() {
      canvas.style.setProperty('z-index', '0', 'important')
      gestureLayer.style.setProperty('z-index', '20', 'important')
      uiRoot.style.setProperty('z-index', '2147483647', 'important')

      if (document.body.lastElementChild !== uiRoot) {
        document.body.appendChild(uiRoot)
      }
    }

    function updateReticle() {
      reticle.classList.remove('ready', 'warning')

      if (state.mode === MODES.WALL_POINT) {
        if (state.currentCenterHit) {
          reticle.classList.add('ready')
        } else {
          reticle.classList.add('warning')
        }
        return
      }

      if (state.mode === MODES.FOOT_POINT) {
        reticle.classList.add('ready')
        return
      }

      if (state.mode === MODES.AIM) {
        if (state.previewPosition) {
          reticle.classList.add('ready')
        } else {
          reticle.classList.add('warning')
        }
        return
      }

      reticle.classList.add('ready')
    }

    function updateUi() {
      replaceButton.hidden = state.mode === MODES.WALL_POINT
      gestureHelp.classList.toggle('visible', state.mode === MODES.PLACED)

      if (state.mode === MODES.WALL_POINT) {
        setStep('1 / 3 · 벽 기준점')
        setStatus('벽과 바닥이 만나는 선을 화면 중앙에 맞춘 뒤 버튼을 누르세요.')
        captureButton.textContent = '① 벽 아래점 찍기'
        captureButton.disabled = !state.currentCenterHit
        captureButton.className = 'primary'
        hintArrow.textContent = '벽 아래 모서리를 중앙에 맞추세요'
        hintArrow.hidden = false
        distanceBadge.classList.remove('visible')
        return
      }

      if (state.mode === MODES.FOOT_POINT) {
        setStep('2 / 3 · 사용자 위치')
        setStatus('벽을 정면으로 바라본 상태에서 현재 서 있는 위치를 기록하세요.')
        captureButton.textContent = '② 내 발밑 위치 기록'
        captureButton.disabled = !state.camera
        captureButton.className = 'primary blue'
        hintArrow.textContent = '벽을 정면으로 바라보고 서세요'
        hintArrow.hidden = false
        distanceBadge.classList.remove('visible')
        return
      }

      if (state.mode === MODES.AIM) {
        setStep('3 / 3 · 배치 위치')

        if (!state.artworkLoaded) {
          setStatus('이미지를 선택한 뒤, 벽에서 원하는 높이를 화면 중앙에 맞추세요.')
        } else {
          setStatus('카메라를 올려 원하는 위치를 중앙에 맞춘 뒤 배치하세요.')
        }

        captureButton.textContent = '③ 여기에 이미지 배치'
        captureButton.disabled = !state.previewPosition || !state.artworkLoaded
        captureButton.className = 'primary'
        hintArrow.textContent = '원하는 높이를 중앙에 맞추세요'
        hintArrow.hidden = false
        distanceBadge.textContent = `벽까지 약 ${state.wallDistance.toFixed(2)}m`
        distanceBadge.classList.add('visible')
        return
      }

      setStep('배치 완료')
      setStatus('한 손가락으로 옮기고, 두 손가락으로 크기를 조절하세요.')
      captureButton.textContent = '배치 완료'
      captureButton.disabled = true
      captureButton.className = 'primary'
      hintArrow.hidden = true
      distanceBadge.textContent = `측정 거리 ${state.wallDistance.toFixed(2)}m`
      distanceBadge.classList.add('visible')
    }

    function loadXR8Engine() {
      return new Promise((resolve, reject) => {
        if (window.XR8) {
          resolve(window.XR8)
          return
        }

        let complete = false
        let pollId = null

        const timeoutId = window.setTimeout(() => {
          finishError(new Error('XR8 초기화 시간이 초과되었습니다.'))
        }, 30000)

        function cleanup() {
          window.clearTimeout(timeoutId)
          if (pollId !== null) window.clearInterval(pollId)
          window.removeEventListener('xrloaded', finishSuccess)
        }

        function finishSuccess() {
          if (complete || !window.XR8) return
          complete = true
          cleanup()
          resolve(window.XR8)
        }

        function finishError(error) {
          if (complete) return
          complete = true
          cleanup()
          reject(error)
        }

        window.addEventListener('xrloaded', finishSuccess)
        pollId = window.setInterval(finishSuccess, 100)

        const existing = document.querySelector('script[data-xr8-engine="true"]')
        if (existing) {
          finishSuccess()
          return
        }

        const script = document.createElement('script')
        script.src = XR8_ENGINE_URL
        script.async = true
        script.crossOrigin = 'anonymous'
        script.dataset.xr8Engine = 'true'
        script.setAttribute('data-preload-chunks', 'slam')
        script.addEventListener('load', finishSuccess, {once: true})
        script.addEventListener(
          'error',
          () => finishError(new Error('8th Wall XR 엔진을 불러오지 못했습니다.')),
          {once: true},
        )
        document.head.appendChild(script)
      })
    }

    function hitTypePriority(type) {
      if (type === 'DETECTED_SURFACE') return 3
      if (type === 'ESTIMATED_SURFACE') return 2
      if (type === 'FEATURE_POINT') return 1
      return 0
    }

    function isFinitePosition(position) {
      return (
        position &&
        Number.isFinite(position.x) &&
        Number.isFinite(position.y) &&
        Number.isFinite(position.z)
      )
    }

    function pickBestHit(hits) {
      if (!Array.isArray(hits)) return null

      return (
        hits
          .filter(hit => hitTypePriority(hit.type) > 0 && isFinitePosition(hit.position))
          .sort((a, b) => {
            const typeDifference = hitTypePriority(b.type) - hitTypePriority(a.type)
            if (typeDifference !== 0) return typeDifference

            const aDistance = Number.isFinite(a.distance) ? a.distance : Infinity
            const bDistance = Number.isFinite(b.distance) ? b.distance : Infinity
            return aDistance - bDistance
          })[0] || null
      )
    }

    function sampleCenterHit() {
      if (!state.XR8?.XrController) return null

      const offsets = [
        [0, 0],
        [-0.025, 0],
        [0.025, 0],
        [0, -0.025],
        [0, 0.025],
        [-0.018, -0.018],
        [0.018, -0.018],
        [-0.018, 0.018],
        [0.018, 0.018],
      ]

      const candidates = []

      for (const [dx, dy] of offsets) {
        try {
          const hits =
            state.XR8.XrController.hitTest(0.5 + dx, 0.5 + dy, [
              'DETECTED_SURFACE',
              'ESTIMATED_SURFACE',
              'FEATURE_POINT',
            ]) || []

          const hit = pickBestHit(hits)
          if (hit) candidates.push(hit)
        } catch (error) {
          console.warn('hitTest warning:', error)
        }
      }

      if (!candidates.length) return null

      candidates.sort((a, b) => hitTypePriority(b.type) - hitTypePriority(a.type))
      const strongestType = candidates[0].type
      const strongest = candidates.filter(hit => hit.type === strongestType)

      const xs = strongest.map(hit => hit.position.x).sort((a, b) => a - b)
      const ys = strongest.map(hit => hit.position.y).sort((a, b) => a - b)
      const zs = strongest.map(hit => hit.position.z).sort((a, b) => a - b)

      const middle = values => {
        const index = Math.floor(values.length / 2)
        return values.length % 2 ? values[index] : (values[index - 1] + values[index]) / 2
      }

      return {
        type: strongestType,
        position: new THREE.Vector3(middle(xs), middle(ys), middle(zs)),
      }
    }

    function createMarker(color) {
      return new THREE.Mesh(
        new THREE.SphereGeometry(0.045, 20, 20),
        new THREE.MeshBasicMaterial({
          color,
          depthTest: false,
          transparent: true,
          opacity: 0.95,
        }),
      )
    }

    function createLine(points, color, dashed = false) {
      const geometry = new THREE.BufferGeometry().setFromPoints(points)
      const material = dashed
        ? new THREE.LineDashedMaterial({
            color,
            dashSize: 0.08,
            gapSize: 0.045,
            depthTest: false,
          })
        : new THREE.LineBasicMaterial({color, depthTest: false})

      const line = new THREE.Line(geometry, material)
      if (dashed) line.computeLineDistances()
      return line
    }

    function removeObject(object) {
      if (!object) return
      object.removeFromParent()
      object.geometry?.dispose?.()
      object.material?.dispose?.()
    }

    function clearMeasurementObjects() {
      removeObject(state.wallPointMarker)
      removeObject(state.footPointMarker)
      removeObject(state.measureLine)
      removeObject(state.wallBaseLine)

      state.wallPointMarker = null
      state.footPointMarker = null
      state.measureLine = null
      state.wallBaseLine = null
    }

    function showWallPointMarker() {
      removeObject(state.wallPointMarker)
      state.wallPointMarker = createMarker(0xff5f6d)
      state.wallPointMarker.position.copy(state.wallFloorPoint)
      state.wallPointMarker.position.y += 0.045
      state.scene.add(state.wallPointMarker)
    }

    function showMeasurementObjects() {
      removeObject(state.footPointMarker)
      removeObject(state.measureLine)
      removeObject(state.wallBaseLine)

      state.footPointMarker = createMarker(0x65d7ff)
      state.footPointMarker.position.copy(state.footPoint)
      state.footPointMarker.position.y += 0.045
      state.scene.add(state.footPointMarker)

      state.measureLine = createLine(
        [
          state.wallFloorPoint.clone().add(new THREE.Vector3(0, 0.025, 0)),
          state.footPoint.clone().add(new THREE.Vector3(0, 0.025, 0)),
        ],
        0x65d7ff,
        true,
      )
      state.scene.add(state.measureLine)

      const right = new THREE.Vector3().crossVectors(WORLD_UP, state.wallNormal).normalize()
      const halfWidth = 1.4
      const baseStart = state.wallFloorPoint.clone().addScaledVector(right, -halfWidth)
      const baseEnd = state.wallFloorPoint.clone().addScaledVector(right, halfWidth)
      baseStart.y += 0.018
      baseEnd.y += 0.018

      state.wallBaseLine = createLine([baseStart, baseEnd], 0x59f49a)
      state.scene.add(state.wallBaseLine)
    }

    function createWallQuaternion(normal) {
      const normalized = normal.clone().normalize()
      const right = new THREE.Vector3().crossVectors(WORLD_UP, normalized)

      if (right.lengthSq() < 1e-8) return null
      right.normalize()

      const wallUp = new THREE.Vector3().crossVectors(normalized, right).normalize()
      const matrix = new THREE.Matrix4().makeBasis(right, wallUp, normalized)
      return new THREE.Quaternion().setFromRotationMatrix(matrix)
    }

    function defineWallFromPoints() {
      if (!state.wallFloorPoint || !state.footPoint) {
        throw new Error('벽 기준점과 사용자 위치가 필요합니다.')
      }

      const normal = state.footPoint.clone().sub(state.wallFloorPoint)
      normal.y = 0

      const distance = normal.length()
      if (distance < 0.45) {
        throw new Error('벽과 사용자 위치가 너무 가깝습니다. 최소 45cm 이상 떨어져 주세요.')
      }

      if (distance > 8) {
        throw new Error('측정 거리가 너무 큽니다. 벽 가까이에서 다시 측정해 주세요.')
      }

      normal.normalize()

      if (state.camera) {
        const cameraFloor = new THREE.Vector3()
        state.camera.getWorldPosition(cameraFloor)
        cameraFloor.y = 0

        if (normal.dot(cameraFloor.clone().sub(state.wallFloorPoint)) < 0) {
          normal.negate()
        }
      }

      const quaternion = createWallQuaternion(normal)
      if (!quaternion) throw new Error('벽 방향을 계산하지 못했습니다.')

      state.wallNormal = normal
      state.wallDistance = distance
      state.wallQuaternion = quaternion
      state.wallPlane = new THREE.Plane().setFromNormalAndCoplanarPoint(
        normal,
        state.wallFloorPoint,
      )

      showMeasurementObjects()
    }

    function disposeArtwork() {
      if (state.artworkGroup) {
        state.artworkGroup.removeFromParent()
        state.artworkGroup.traverse(object => {
          object.geometry?.dispose?.()
          if (Array.isArray(object.material)) {
            object.material.forEach(material => material.dispose?.())
          } else {
            object.material?.dispose?.()
          }
        })
      }

      state.artworkTexture?.dispose?.()
      state.artworkTexture = null
      state.artworkGroup = null
      state.artworkMesh = null
      state.artworkLoaded = false
      state.artworkScale = 1
    }

    function buildArtworkGroup(width, height, texture = null) {
      if (!state.scene) throw new Error('AR 장면이 아직 준비되지 않았습니다.')

      if (state.artworkGroup) {
        state.artworkGroup.removeFromParent()
        state.artworkGroup.traverse(object => {
          object.geometry?.dispose?.()
          if (Array.isArray(object.material)) {
            object.material.forEach(material => material.dispose?.())
          } else {
            object.material?.dispose?.()
          }
        })
      }

      const group = new THREE.Group()
      group.name = 'artwork-group'
      group.visible = false

      const backing = new THREE.Mesh(
        new THREE.PlaneGeometry(width + 0.045, height + 0.045),
        new THREE.MeshBasicMaterial({
          color: 0x111111,
          side: THREE.DoubleSide,
          toneMapped: false,
        }),
      )
      backing.position.z = -0.003
      group.add(backing)

      const material = texture
        ? new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            side: THREE.DoubleSide,
            toneMapped: false,
          })
        : new THREE.MeshBasicMaterial({
            color: 0x59f49a,
            transparent: true,
            opacity: 0.24,
            side: THREE.DoubleSide,
            depthWrite: false,
          })

      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(width, height), material)
      mesh.renderOrder = 20
      group.add(mesh)

      const outline = new THREE.LineSegments(
        new THREE.EdgesGeometry(new THREE.PlaneGeometry(width + 0.01, height + 0.01)),
        new THREE.LineBasicMaterial({
          color: texture ? 0xffffff : 0x59f49a,
          transparent: true,
          opacity: 0.9,
          depthTest: false,
        }),
      )
      outline.position.z = 0.004
      group.add(outline)

      state.scene.add(group)
      state.artworkGroup = group
      state.artworkMesh = mesh
      state.artworkWidth = width
      state.artworkHeight = height
      state.artworkScale = 1
    }

    function ensurePlaceholderArtwork() {
      if (state.artworkGroup) return
      buildArtworkGroup(0.7, 0.5, null)
    }

    async function fileToCanvas(file) {
      const maxSize = 2048

      if ('createImageBitmap' in window) {
        const bitmap = await createImageBitmap(file)
        try {
          const ratio = Math.min(1, maxSize / Math.max(bitmap.width, bitmap.height))
          const width = Math.max(1, Math.round(bitmap.width * ratio))
          const height = Math.max(1, Math.round(bitmap.height * ratio))
          const output = document.createElement('canvas')
          output.width = width
          output.height = height
          const context = output.getContext('2d', {alpha: true})
          if (!context) throw new Error('이미지 처리용 Canvas를 만들 수 없습니다.')
          context.drawImage(bitmap, 0, 0, width, height)
          return output
        } finally {
          bitmap.close()
        }
      }

      const objectUrl = URL.createObjectURL(file)
      try {
        const image = await new Promise((resolve, reject) => {
          const element = new Image()
          element.onload = () => resolve(element)
          element.onerror = () => reject(new Error('이미지를 읽지 못했습니다.'))
          element.src = objectUrl
        })

        const ratio = Math.min(1, maxSize / Math.max(image.naturalWidth, image.naturalHeight))
        const width = Math.max(1, Math.round(image.naturalWidth * ratio))
        const height = Math.max(1, Math.round(image.naturalHeight * ratio))
        const output = document.createElement('canvas')
        output.width = width
        output.height = height
        const context = output.getContext('2d', {alpha: true})
        if (!context) throw new Error('이미지 처리용 Canvas를 만들 수 없습니다.')
        context.drawImage(image, 0, 0, width, height)
        return output
      } finally {
        URL.revokeObjectURL(objectUrl)
      }
    }

    async function loadArtwork(file) {
      if (!file.type.startsWith('image/')) {
        throw new Error('이미지 파일만 선택할 수 있습니다.')
      }

      setStatus('이미지를 준비하는 중입니다.')
      const imageCanvas = await fileToCanvas(file)

      state.artworkTexture?.dispose?.()
      const texture = new THREE.CanvasTexture(imageCanvas)
      texture.colorSpace = THREE.SRGBColorSpace
      texture.needsUpdate = true

      if (state.renderer) {
        texture.anisotropy = Math.min(
          8,
          state.renderer.capabilities.getMaxAnisotropy(),
        )
      }

      const width = 0.7
      const height = width * (imageCanvas.height / imageCanvas.width)
      buildArtworkGroup(width, height, texture)

      state.artworkTexture = texture
      state.artworkLoaded = true

      if (state.mode === MODES.AIM) {
        updateArtworkPreview()
      } else if (state.mode === MODES.PLACED && state.previewPosition) {
        state.artworkGroup.position.copy(state.previewPosition)
        state.artworkGroup.quaternion.copy(state.wallQuaternion)
        state.artworkGroup.scale.setScalar(state.artworkScale)
        state.artworkGroup.visible = true
      }

      updateUi()
    }

    function getCameraFloorPoint() {
      if (!state.camera) return null
      const point = new THREE.Vector3()
      state.camera.updateMatrixWorld(true)
      state.camera.getWorldPosition(point)
      point.y = 0
      return point
    }

    function updateArtworkPreview() {
      state.previewPosition = null

      if (!state.wallPlane || !state.camera || state.mode !== MODES.AIM) {
        if (state.artworkGroup && state.mode !== MODES.PLACED) {
          state.artworkGroup.visible = false
        }
        updateReticle()
        updateUi()
        return
      }

      ensurePlaceholderArtwork()
      state.camera.updateMatrixWorld(true)

      const raycaster = new THREE.Raycaster()
      raycaster.setFromCamera(CENTER_NDC, state.camera)

      const intersection = raycaster.ray.intersectPlane(
        state.wallPlane,
        new THREE.Vector3(),
      )

      if (!intersection || intersection.y < 0.25 || intersection.y > 4.5) {
        state.artworkGroup.visible = false
        updateReticle()
        updateUi()
        return
      }

      const cameraPosition = new THREE.Vector3()
      state.camera.getWorldPosition(cameraPosition)
      const distance = cameraPosition.distanceTo(intersection)

      if (distance < 0.25 || distance > 10) {
        state.artworkGroup.visible = false
        updateReticle()
        updateUi()
        return
      }

      state.previewPosition = intersection.clone().addScaledVector(state.wallNormal, 0.012)
      state.artworkGroup.position.copy(state.previewPosition)
      state.artworkGroup.quaternion.copy(state.wallQuaternion)
      state.artworkGroup.scale.setScalar(state.artworkScale)
      state.artworkGroup.visible = true

      updateReticle()
      updateUi()
    }

    function captureWallPoint() {
      if (!state.currentCenterHit || !state.scene) return

      const point = state.currentCenterHit.position.clone()
      point.y = 0
      state.wallFloorPoint = point
      showWallPointMarker()

      state.mode = MODES.FOOT_POINT
      updateUi()
      updateReticle()
    }

    function captureFootPoint() {
      const point = getCameraFloorPoint()
      if (!point) return

      state.footPoint = point

      try {
        defineWallFromPoints()
      } catch (error) {
        state.footPoint = null
        showError(error instanceof Error ? error.message : '벽 방향 계산에 실패했습니다.')
        return
      }

      state.mode = MODES.AIM
      ensurePlaceholderArtwork()
      updateArtworkPreview()
      updateUi()
    }

    function placeArtwork() {
      if (!state.previewPosition || !state.artworkLoaded || !state.artworkGroup) return

      state.artworkGroup.position.copy(state.previewPosition)
      state.artworkGroup.quaternion.copy(state.wallQuaternion)
      state.artworkGroup.scale.setScalar(state.artworkScale)
      state.artworkGroup.visible = true

      state.mode = MODES.PLACED
      updateUi()
      updateReticle()
    }

    function resetMeasurement({keepArtwork = true} = {}) {
      clearMeasurementObjects()

      state.wallFloorPoint = null
      state.footPoint = null
      state.wallNormal = null
      state.wallPlane = null
      state.wallQuaternion = null
      state.wallDistance = 0
      state.previewPosition = null
      state.mode = MODES.WALL_POINT
      state.currentCenterHit = null
      state.pointers.clear()
      state.dragActive = false

      if (state.artworkGroup) {
        state.artworkGroup.visible = false
      }

      if (!keepArtwork) {
        disposeArtwork()
      }

      updateUi()
      updateReticle()
    }

    function screenPointToWall(clientX, clientY) {
      if (!state.wallPlane || !state.camera) return null

      const rect = gestureLayer.getBoundingClientRect()
      const ndc = new THREE.Vector2(
        ((clientX - rect.left) / rect.width) * 2 - 1,
        -((clientY - rect.top) / rect.height) * 2 + 1,
      )

      const raycaster = new THREE.Raycaster()
      raycaster.setFromCamera(ndc, state.camera)
      return raycaster.ray.intersectPlane(state.wallPlane, new THREE.Vector3())
    }

    function pointerDistance() {
      const values = [...state.pointers.values()]
      if (values.length < 2) return 0
      return Math.hypot(values[0].x - values[1].x, values[0].y - values[1].y)
    }

    function handlePointerDown(event) {
      if (state.mode !== MODES.PLACED || !state.artworkGroup) return

      gestureLayer.setPointerCapture?.(event.pointerId)
      state.pointers.set(event.pointerId, {x: event.clientX, y: event.clientY})

      if (state.pointers.size === 1) {
        const intersection = screenPointToWall(event.clientX, event.clientY)
        if (intersection) {
          state.dragOffset.copy(state.artworkGroup.position).sub(intersection)
          state.dragActive = true
        }
      } else if (state.pointers.size === 2) {
        state.dragActive = false
        state.pinchStartDistance = pointerDistance()
        state.pinchStartScale = state.artworkScale
      }
    }

    function handlePointerMove(event) {
      if (!state.pointers.has(event.pointerId) || state.mode !== MODES.PLACED) return

      state.pointers.set(event.pointerId, {x: event.clientX, y: event.clientY})

      if (state.pointers.size === 1 && state.dragActive) {
        const intersection = screenPointToWall(event.clientX, event.clientY)
        if (!intersection) return

        const nextPosition = intersection.add(state.dragOffset)
        nextPosition.y = THREE.MathUtils.clamp(nextPosition.y, 0.25, 4.5)
        state.artworkGroup.position.copy(nextPosition)
        state.previewPosition = nextPosition.clone()
        return
      }

      if (state.pointers.size === 2 && state.pinchStartDistance > 0) {
        const currentDistance = pointerDistance()
        const nextScale = THREE.MathUtils.clamp(
          state.pinchStartScale * (currentDistance / state.pinchStartDistance),
          0.35,
          3,
        )
        state.artworkScale = nextScale
        state.artworkGroup.scale.setScalar(nextScale)
      }
    }

    function handlePointerUp(event) {
      state.pointers.delete(event.pointerId)
      gestureLayer.releasePointerCapture?.(event.pointerId)

      if (state.pointers.size < 2) {
        state.pinchStartDistance = 0
      }

      if (state.pointers.size === 0) {
        state.dragActive = false
      }
    }

    function updateDebug(extra = {}) {
      const cameraPosition = state.camera ? new THREE.Vector3() : null
      if (cameraPosition) state.camera.getWorldPosition(cameraPosition)

      const lines = [
        `mode: ${state.mode}`,
        `XR8: ${window.XR8 ? 'READY' : 'WAIT'}`,
        `camera: ${state.cameraStatus}`,
        `tracking: ${state.trackingStatus}`,
        `reason: ${state.trackingReason || '-'}`,
        `centerHit: ${state.currentCenterHit?.type || '-'}`,
        `wallPoint: ${state.wallFloorPoint ? vectorText(state.wallFloorPoint) : '-'}`,
        `footPoint: ${state.footPoint ? vectorText(state.footPoint) : '-'}`,
        `cameraPos: ${cameraPosition ? vectorText(cameraPosition) : '-'}`,
        `wallDistance: ${state.wallDistance ? state.wallDistance.toFixed(2) : '-'}m`,
        `image: ${state.artworkLoaded ? 'YES' : 'NO'}`,
        `scale: ${state.artworkScale.toFixed(2)}`,
      ]

      for (const [key, value] of Object.entries(extra)) {
        lines.push(`${key}: ${value}`)
      }

      debugElement.textContent = lines.join('\n')
    }

    function vectorText(vector) {
      return `${vector.x.toFixed(2)}, ${vector.y.toFixed(2)}, ${vector.z.toFixed(2)}`
    }

    function createApplicationPipelineModule(XR8) {
      return {
        name: 'wall-distance-reconstruction',

        onCameraStatusChange({status}) {
          state.cameraStatus = status || 'UNKNOWN'

          if (status === 'requesting') setStatus('카메라 권한을 요청하는 중입니다.')
          if (status === 'hasStream') setStatus('카메라를 시작하는 중입니다.')
          if (status === 'hasVideo') setStatus('공간 추적을 시작합니다.')
          if (status === 'failed') {
            showError('카메라를 시작하지 못했습니다.\n브라우저의 카메라 권한을 확인해 주세요.')
          }
        },

        onStart() {
          const {scene, camera, renderer} = XR8.Threejs.xrScene()
          state.scene = scene
          state.camera = camera
          state.renderer = renderer

          enableImageInput(true)
          updateViewportHeight()
          enforceLayerOrder()
          updateUi()
        },

        onUpdate({processCpuResult, processGpuResult}) {
          const reality = processCpuResult?.reality
          if (reality) {
            state.trackingStatus = reality.trackingStatus || 'UNKNOWN'
            state.trackingReason = reality.trackingReason || null
          }

          const now = performance.now()

          if (now - state.lastHitSampleTime >= 180) {
            state.lastHitSampleTime = now

            if (state.mode === MODES.WALL_POINT) {
              state.currentCenterHit = sampleCenterHit()
              updateReticle()
              updateUi()
            } else if (state.mode === MODES.AIM) {
              updateArtworkPreview()
            }
          }

          if (now - state.lastDebugTime >= 300) {
            state.lastDebugTime = now
            updateDebug({
              worldPoints: reality?.worldPoints?.length || 0,
              gpu: processGpuResult ? 'READY' : 'WAIT',
            })
          }
        },

        onCanvasSizeChange() {
          updateViewportHeight()
          enforceLayerOrder()
        },

        onDeviceOrientationChange() {
          window.setTimeout(updateViewportHeight, 100)
        },

        onPaused() {
          setStatus('카메라가 일시 중지되었습니다.')
        },

        onResume() {
          setStatus('공간 추적을 복구하는 중입니다.')
          window.setTimeout(() => {
            updateUi()
          }, 600)
        },

        onException(error) {
          console.error('XR pipeline error:', error)
          showError('AR 실행 중 오류가 발생했습니다.\n페이지를 새로고침해 주세요.')
        },
      }
    }

    function startXR(XR8) {
      if (state.xrStarted) return

      state.xrStarted = true
      state.XR8 = XR8

      XR8.XrController.configure({
        disableWorldTracking: false,
        enableWorldPoints: true,
        enableLighting: true,
        scale: 'absolute',
      })

      XR8.addCameraPipelineModules([
        XR8.GlTextureRenderer.pipelineModule(),
        XR8.Threejs.pipelineModule(),
        XR8.XrController.pipelineModule(),
        createApplicationPipelineModule(XR8),
      ])

      const options = {canvas}
      if (XR8.XrConfig?.device) {
        options.allowedDevices = XR8.XrConfig.device().ANY
      }

      XR8.run(options)
    }

    captureButton.addEventListener('click', event => {
      event.preventDefault()
      event.stopPropagation()

      if (state.mode === MODES.WALL_POINT) {
        captureWallPoint()
      } else if (state.mode === MODES.FOOT_POINT) {
        captureFootPoint()
      } else if (state.mode === MODES.AIM) {
        placeArtwork()
      }
    })

    imageInput.addEventListener('change', async event => {
      const file = event.target.files?.[0]
      if (!file) return

      try {
        await loadArtwork(file)
      } catch (error) {
        console.error(error)
        showError(error instanceof Error ? error.message : '이미지를 불러오지 못했습니다.')
      } finally {
        event.target.value = ''
      }
    })

    replaceButton.addEventListener('click', event => {
      event.preventDefault()
      event.stopPropagation()
      resetMeasurement({keepArtwork: true})
    })

    resetButton.addEventListener('click', event => {
      event.preventDefault()
      event.stopPropagation()
      resetMeasurement({keepArtwork: false})
    })

    debugButton.addEventListener('click', event => {
      event.preventDefault()
      event.stopPropagation()
      debugElement.classList.toggle('visible')
    })

    reloadButton.addEventListener('click', () => {
      window.location.reload()
    })

    gestureLayer.addEventListener('pointerdown', handlePointerDown)
    gestureLayer.addEventListener('pointermove', handlePointerMove)
    gestureLayer.addEventListener('pointerup', handlePointerUp)
    gestureLayer.addEventListener('pointercancel', handlePointerUp)

    window.addEventListener('resize', updateViewportHeight, {passive: true})
    window.addEventListener(
      'orientationchange',
      () => window.setTimeout(updateViewportHeight, 150),
      {passive: true},
    )
    window.visualViewport?.addEventListener('resize', updateViewportHeight, {passive: true})

    const bodyObserver = new MutationObserver(() => {
      window.requestAnimationFrame(enforceLayerOrder)
    })
    bodyObserver.observe(document.body, {childList: true})

    async function initialize() {
      if (state.xrLoading) return
      state.xrLoading = true

      hideError()
      enableImageInput(false)
      updateViewportHeight()
      enforceLayerOrder()
      updateUi()

      try {
        if (!window.isSecureContext) {
          throw new Error(
            '카메라 사용에는 HTTPS 연결이 필요합니다.\nGitHub Pages HTTPS 주소에서 실행해 주세요.',
          )
        }

        setStatus('AR 추적 엔진을 불러오는 중입니다.')
        const XR8 = await loadXR8Engine()
        setStatus('AR 카메라를 시작하는 중입니다.')
        startXR(XR8)
      } catch (error) {
        console.error('Initialization error:', error)
        showError(error instanceof Error ? error.message : 'AR 초기화에 실패했습니다.')
      } finally {
        state.xrLoading = false
      }
    }

    initialize()
  </script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#000000" />
  <title>Wall Art AR</title>

  <style>
    :root {
      --app-height: 100dvh;
      --safe-top: max(14px, env(safe-area-inset-top));
      --safe-bottom: max(14px, env(safe-area-inset-bottom));
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #000;
    }

    body {
      position: fixed;
      inset: 0;
      height: var(--app-height);
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
    }

    /*
      카메라 원본 영상과 AR 캔버스를 같은 사각형에 배치한다.
      화면 비율이 다르면 검은 여백을 남겨 카메라 영상을 자르지 않는다.
    */
    #cameraVideo,
    #camerafeed {
      position: fixed !important;
      top: 50%;
      left: 50%;
      display: block !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      transform: translate(-50%, -50%);
    }

    #cameraVideo {
      z-index: 0 !important;
      width: 100vw;
      height: 100vh;
      background: #000;
      object-fit: fill;
      pointer-events: none;
    }

    #camerafeed {
      z-index: 1 !important;
      width: 100vw;
      height: 100vh;
      background: transparent !important;
      pointer-events: none;
    }

    #gestureLayer {
      position: fixed;
      inset: 0;
      z-index: 20;
      touch-action: none;
      pointer-events: auto;
    }

    #uiRoot {
      position: fixed !important;
      inset: 0 !important;
      z-index: 2147483647 !important;
      width: 100vw !important;
      height: var(--app-height) !important;
      pointer-events: none !important;
      isolation: isolate;
    }

    #topPanel {
      position: absolute;
      top: var(--safe-top);
      left: 50%;
      width: min(92vw, 540px);
      transform: translateX(-50%);
      pointer-events: none;
    }

    #stepBadge,
    #distanceBadge,
    #trackingBadge {
      width: max-content;
      max-width: 100%;
      margin: 0 auto 8px;
      padding: 7px 11px;
      overflow: hidden;
      border: 1px solid rgb(255 255 255 / 18%);
      border-radius: 999px;
      background: rgb(0 0 0 / 72%);
      font-size: 12px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
      backdrop-filter: blur(12px);
    }

    #stepBadge {
      color: #aeeeff;
    }

    #trackingBadge {
      color: #ffd166;
    }

    #trackingBadge.ready {
      color: #7dffb1;
    }

    #distanceBadge {
      display: none;
      color: #bcefff;
    }

    #distanceBadge.visible {
      display: block;
    }

    #status {
      padding: 12px 14px;
      border: 1px solid rgb(255 255 255 / 18%);
      border-radius: 16px;
      background: rgb(0 0 0 / 74%);
      color: #fff;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.45;
      text-align: center;
      box-shadow: 0 8px 28px rgb(0 0 0 / 30%);
      backdrop-filter: blur(12px);
    }

    #reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 56px;
      height: 56px;
      border: 2px solid rgb(255 255 255 / 92%);
      border-radius: 50%;
      color: #fff;
      transform: translate(-50%, -50%);
      box-shadow:
        0 0 0 1px rgb(0 0 0 / 65%),
        0 0 22px rgb(255 255 255 / 20%);
      pointer-events: none;
      transition: 160ms ease;
    }

    #reticle::before,
    #reticle::after {
      position: absolute;
      top: 50%;
      left: 50%;
      background: currentColor;
      content: "";
      transform: translate(-50%, -50%);
    }

    #reticle::before {
      width: 22px;
      height: 1px;
    }

    #reticle::after {
      width: 1px;
      height: 22px;
    }

    #reticle.ready {
      width: 62px;
      height: 62px;
      border-color: #59f49a;
      color: #59f49a;
      box-shadow:
        0 0 0 1px rgb(0 0 0 / 65%),
        0 0 30px rgb(89 244 154 / 48%);
    }

    #reticle.warning {
      border-color: #ffd166;
      color: #ffd166;
    }

    #reticle.measuring {
      border-style: dashed;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    #hint {
      position: absolute;
      top: calc(50% + 43px);
      left: 50%;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgb(0 0 0 / 66%);
      color: rgb(255 255 255 / 90%);
      font-size: 11px;
      font-weight: 750;
      transform: translateX(-50%);
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    #measureProgress {
      position: absolute;
      top: calc(50% + 78px);
      left: 50%;
      display: none;
      width: min(210px, 60vw);
      height: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: rgb(255 255 255 / 20%);
      transform: translateX(-50%);
    }

    #measureProgress.visible {
      display: block;
    }

    #measureProgressBar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: #59f49a;
      transition: width 70ms linear;
    }

    #bottomPanel {
      position: absolute;
      right: 12px;
      bottom: var(--safe-bottom);
      left: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      pointer-events: none;
    }

    #primaryActions,
    #secondaryActions {
      display: flex;
      width: 100%;
      max-width: 580px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      pointer-events: auto;
    }

    button,
    .fileButton {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      border: 0;
      border-radius: 999px;
      background: rgb(255 255 255 / 96%);
      color: #111;
      font: inherit;
      font-size: 14px;
      font-weight: 850;
      white-space: nowrap;
      box-shadow: 0 7px 22px rgb(0 0 0 / 36%);
      cursor: pointer;
      user-select: none;
      pointer-events: auto;
    }

    button.primary {
      min-width: min(76vw, 310px);
      background: #59f49a;
    }

    button.blue {
      background: #65d7ff;
    }

    button.secondary,
    .fileButton.secondary {
      min-height: 42px;
      padding: 0 14px;
      background: rgb(0 0 0 / 72%);
      color: #fff;
      border: 1px solid rgb(255 255 255 / 23%);
      font-size: 13px;
      backdrop-filter: blur(10px);
    }

    button:disabled,
    .fileButton.disabled {
      opacity: 0.42;
      cursor: default;
    }

    #imageInput {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      white-space: nowrap;
    }

    #gestureHelp {
      display: none;
      padding: 8px 11px;
      border-radius: 999px;
      background: rgb(0 0 0 / 68%);
      color: rgb(255 255 255 / 90%);
      font-size: 12px;
      font-weight: 750;
      backdrop-filter: blur(8px);
    }

    #gestureHelp.visible {
      display: block;
    }

    #debug {
      position: absolute;
      top: calc(var(--safe-top) + 150px);
      right: 10px;
      display: none;
      max-width: min(88vw, 390px);
      max-height: 42vh;
      margin: 0;
      padding: 10px;
      overflow: auto;
      border: 1px solid rgb(255 255 255 / 18%);
      border-radius: 12px;
      background: rgb(0 0 0 / 80%);
      color: #baf3ff;
      font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
      pointer-events: auto;
      white-space: pre-wrap;
      backdrop-filter: blur(10px);
    }

    #debug.visible {
      display: block;
    }

    #errorPanel {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgb(0 0 0 / 88%);
      pointer-events: auto;
    }

    #errorPanel.visible {
      display: flex;
    }

    #errorCard {
      width: min(92vw, 440px);
      padding: 20px;
      border: 1px solid rgb(255 255 255 / 18%);
      border-radius: 20px;
      background: #171717;
      text-align: center;
      box-shadow: 0 18px 70px rgb(0 0 0 / 50%);
    }

    #errorMessage {
      margin: 0 0 16px;
      line-height: 1.55;
      white-space: pre-line;
    }

    [hidden] {
      display: none !important;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.172.0/build/three.module.min.js"
      }
    }
  </script>
</head>
<body>
  <video id="cameraVideo" autoplay muted playsinline></video>
  <canvas id="camerafeed"></canvas>
  <div id="gestureLayer" aria-hidden="true"></div>

  <main id="uiRoot">
    <section id="topPanel">
      <div id="stepBadge">AR 준비 중</div>
      <div id="trackingBadge">공간 추적 준비 중</div>
      <div id="status">카메라를 시작하고 있습니다.</div>
      <div id="distanceBadge"></div>
    </section>

    <div id="reticle" class="warning"></div>
    <div id="hint">바닥의 무늬가 보이도록 천천히 움직이세요</div>
    <div id="measureProgress"><div id="measureProgressBar"></div></div>

    <section id="bottomPanel">
      <div id="gestureHelp">한 손가락 이동 · 두 손가락 크기 조절</div>

      <div id="primaryActions">
        <button id="captureButton" class="primary" disabled>준비 중</button>
      </div>

      <div id="secondaryActions">
        <label id="fileButton" class="fileButton secondary disabled" for="imageInput">
          이미지 선택
        </label>
        <input id="imageInput" type="file" accept="image/*" disabled />
        <button id="retakeButton" class="secondary" hidden>다시 측정</button>
        <button id="resetButton" class="secondary">전체 초기화</button>
        <button id="debugButton" class="secondary">상태</button>
      </div>
    </section>

    <pre id="debug"></pre>

    <section id="errorPanel">
      <div id="errorCard">
        <p id="errorMessage"></p>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <button id="closeErrorButton" class="secondary">확인</button>
          <button id="reloadButton">새로고침</button>
        </div>
      </div>
    </section>
  </main>

  <script type="module">
    import * as THREE from 'three'

    window.THREE = THREE

    const XR8_ENGINE_URL =
      'https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js'

    const WORLD_UP = new THREE.Vector3(0, 1, 0)
    const CENTER_NDC = new THREE.Vector2(0, 0)

    const MODES = Object.freeze({
      WALL_POINT: 'WALL_POINT',
      FOOT_POINT: 'FOOT_POINT',
      AIM: 'AIM',
      PLACED: 'PLACED',
    })

    const state = {
      XR8: null,
      scene: null,
      camera: null,
      renderer: null,
      stream: null,

      mode: MODES.WALL_POINT,
      xrStarted: false,
      xrLoading: false,
      measuring: false,

      cameraStatus: 'IDLE',
      trackingStatus: 'INITIALIZING',
      trackingReason: 'INITIALIZING',
      trackingStableFrames: 0,
      trackingReady: false,

      videoWidth: 0,
      videoHeight: 0,
      orientation: 0,
      displayWidth: 0,
      displayHeight: 0,
      applyingGeometry: false,
      geometryTimer: null,

      currentCenterHit: null,
      lastHitSampleTime: 0,
      lastPreviewTime: 0,
      lastDebugTime: 0,

      wallFloorPoint: null,
      footFloorPoint: null,
      floorY: 0,
      wallNormal: null,
      wallPlane: null,
      wallQuaternion: null,
      wallDistance: 0,

      artworkGroup: null,
      artworkTexture: null,
      artworkLoaded: false,
      artworkWidth: 0.7,
      artworkHeight: 0.5,
      artworkScale: 1,
      previewPosition: null,
      lockedPosition: null,
      lockedQuaternion: null,
      lockedScale: 1,

      wallMarker: null,
      footMarker: null,
      measureLine: null,
      wallBaseLine: null,

      pointers: new Map(),
      dragOffset: new THREE.Vector3(),
      dragActive: false,
      pinchStartDistance: 0,
      pinchStartScale: 1,
    }

    const cameraVideo = document.querySelector('#cameraVideo')
    const canvas = document.querySelector('#camerafeed')
    const gestureLayer = document.querySelector('#gestureLayer')
    const uiRoot = document.querySelector('#uiRoot')
    const stepBadge = document.querySelector('#stepBadge')
    const trackingBadge = document.querySelector('#trackingBadge')
    const statusElement = document.querySelector('#status')
    const distanceBadge = document.querySelector('#distanceBadge')
    const reticle = document.querySelector('#reticle')
    const hint = document.querySelector('#hint')
    const measureProgress = document.querySelector('#measureProgress')
    const measureProgressBar = document.querySelector('#measureProgressBar')
    const captureButton = document.querySelector('#captureButton')
    const imageInput = document.querySelector('#imageInput')
    const fileButton = document.querySelector('#fileButton')
    const retakeButton = document.querySelector('#retakeButton')
    const resetButton = document.querySelector('#resetButton')
    const debugButton = document.querySelector('#debugButton')
    const debugElement = document.querySelector('#debug')
    const gestureHelp = document.querySelector('#gestureHelp')
    const errorPanel = document.querySelector('#errorPanel')
    const errorMessage = document.querySelector('#errorMessage')
    const closeErrorButton = document.querySelector('#closeErrorButton')
    const reloadButton = document.querySelector('#reloadButton')

    function setStatus(message) {
      statusElement.textContent = message
    }

    function setStep(message) {
      stepBadge.textContent = message
    }

    function showError(message) {
      errorMessage.textContent = message
      errorPanel.classList.add('visible')
      enforceLayerOrder()
    }

    function hideError() {
      errorPanel.classList.remove('visible')
    }

    function updateViewportHeight() {
      const height = Math.round(window.visualViewport?.height ?? window.innerHeight)
      document.documentElement.style.setProperty('--app-height', `${height}px`)
    }

    function enforceLayerOrder() {
      cameraVideo.style.setProperty('z-index', '0', 'important')
      canvas.style.setProperty('z-index', '1', 'important')
      gestureLayer.style.setProperty('z-index', '20', 'important')
      uiRoot.style.setProperty('z-index', '2147483647', 'important')

      if (document.body.lastElementChild !== uiRoot) {
        document.body.appendChild(uiRoot)
      }
    }

    function setImageInputEnabled(enabled) {
      imageInput.disabled = !enabled
      fileButton.classList.toggle('disabled', !enabled)
    }

    function updateTrackingBadge() {
      trackingBadge.classList.toggle('ready', state.trackingReady)

      if (state.trackingReady) {
        trackingBadge.textContent = '공간 추적 안정됨'
      } else if (state.trackingReason === 'INITIALIZING') {
        trackingBadge.textContent = '바닥을 비추며 천천히 움직이세요'
      } else {
        trackingBadge.textContent = '추적이 불안정합니다'
      }
    }

    function updateReticle() {
      reticle.classList.remove('ready', 'warning', 'measuring')

      if (state.measuring) {
        reticle.classList.add('ready', 'measuring')
        return
      }

      if (state.mode === MODES.AIM) {
        reticle.classList.add(state.previewPosition ? 'ready' : 'warning')
        return
      }

      if (state.mode === MODES.PLACED) {
        reticle.classList.add('ready')
        return
      }

      const canMeasure = Boolean(state.currentCenterHit && state.trackingReady)
      reticle.classList.add(canMeasure ? 'ready' : 'warning')
    }

    function updateUi() {
      updateTrackingBadge()
      updateReticle()

      retakeButton.hidden = state.mode === MODES.WALL_POINT
      gestureHelp.classList.toggle('visible', state.mode === MODES.PLACED)
      measureProgress.classList.toggle('visible', state.measuring)

      if (state.measuring) {
        captureButton.disabled = true
        return
      }

      if (state.mode === MODES.WALL_POINT) {
        setStep('1 / 3 · 벽 아래 바닥점')
        setStatus('벽과 바닥이 만나는 선 바로 앞의 바닥을 중앙에 맞추세요.')
        hint.textContent = state.trackingReady
          ? '벽 모서리 바로 앞 바닥을 조준하세요'
          : '바닥의 무늬가 보이도록 천천히 움직이세요'
        hint.hidden = false
        captureButton.textContent = '① 벽 아래 바닥 기록'
        captureButton.className = 'primary'
        captureButton.disabled = !(state.currentCenterHit && state.trackingReady)
        distanceBadge.classList.remove('visible')
        return
      }

      if (state.mode === MODES.FOOT_POINT) {
        setStep('2 / 3 · 사용자 쪽 바닥점')
        setStatus('휴대폰을 내 발 앞쪽 바닥으로 돌려 중앙에 맞추세요.')
        hint.textContent = '발끝에서 약 20~40cm 앞 바닥을 조준하세요'
        hint.hidden = false
        captureButton.textContent = '② 내 앞 바닥 기록'
        captureButton.className = 'primary blue'
        captureButton.disabled = !(state.currentCenterHit && state.trackingReady)
        distanceBadge.classList.remove('visible')
        return
      }

      if (state.mode === MODES.AIM) {
        setStep('3 / 3 · 이미지 위치')
        setStatus(
          state.artworkLoaded
            ? '카메라를 벽의 원하는 위치로 올린 뒤 배치하세요.'
            : '이미지를 선택하고 카메라를 원하는 위치로 올리세요.',
        )
        hint.textContent = '원하는 이미지 중심을 중앙에 맞추세요'
        hint.hidden = false
        captureButton.textContent = '③ 여기에 고정'
        captureButton.className = 'primary'
        captureButton.disabled = !(state.previewPosition && state.artworkLoaded)
        distanceBadge.textContent = `측정된 벽 거리 약 ${state.wallDistance.toFixed(2)}m`
        distanceBadge.classList.add('visible')
        return
      }

      setStep('배치 완료 · 월드 좌표 고정')
      setStatus(
        state.trackingReady
          ? '이미지가 고정되었습니다. 손가락으로 위치와 크기만 조절할 수 있습니다.'
          : '추적이 불안정합니다. 휴대폰을 천천히 움직여 위치를 복구하세요.',
      )
      hint.hidden = true
      captureButton.textContent = '배치 완료'
      captureButton.className = 'primary'
      captureButton.disabled = true
      distanceBadge.textContent = `측정 거리 ${state.wallDistance.toFixed(2)}m`
      distanceBadge.classList.add('visible')
    }

    function loadXR8Engine() {
      return new Promise((resolve, reject) => {
        if (window.XR8) {
          resolve(window.XR8)
          return
        }

        let completed = false
        let pollId = null

        const timeoutId = window.setTimeout(() => {
          finishError(new Error('XR8 초기화 시간이 초과되었습니다.'))
        }, 30000)

        function cleanup() {
          window.clearTimeout(timeoutId)
          if (pollId !== null) window.clearInterval(pollId)
          window.removeEventListener('xrloaded', finishSuccess)
        }

        function finishSuccess() {
          if (completed || !window.XR8) return
          completed = true
          cleanup()
          resolve(window.XR8)
        }

        function finishError(error) {
          if (completed) return
          completed = true
          cleanup()
          reject(error)
        }

        window.addEventListener('xrloaded', finishSuccess)
        pollId = window.setInterval(finishSuccess, 100)

        const existing = document.querySelector('script[data-xr8-engine="true"]')
        if (existing) return

        const script = document.createElement('script')
        script.src = XR8_ENGINE_URL
        script.async = true
        script.crossOrigin = 'anonymous'
        script.dataset.xr8Engine = 'true'
        script.setAttribute('data-preload-chunks', 'slam')
        script.addEventListener('load', finishSuccess, {once: true})
        script.addEventListener(
          'error',
          () => finishError(new Error('8th Wall XR 엔진을 불러오지 못했습니다.')),
          {once: true},
        )
        document.head.appendChild(script)
      })
    }

    function chooseDisplayAspect(videoWidth, videoHeight) {
      if (!(videoWidth > 0 && videoHeight > 0)) {
        return window.innerWidth / Math.max(1, window.innerHeight)
      }

      const viewportAspect = window.innerWidth / Math.max(1, window.innerHeight)
      const raw = videoWidth / videoHeight
      const swapped = videoHeight / videoWidth
      const rawError = Math.abs(Math.log(raw / viewportAspect))
      const swappedError = Math.abs(Math.log(swapped / viewportAspect))
      return rawError <= swappedError ? raw : swapped
    }

    function scheduleDisplayGeometry() {
      window.clearTimeout(state.geometryTimer)
      state.geometryTimer = window.setTimeout(applyDisplayGeometry, 80)
    }

    function applyDisplayGeometry() {
      if (!state.renderer || !state.XR8 || state.applyingGeometry) return

      const viewportWidth = Math.max(1, Math.round(window.visualViewport?.width ?? window.innerWidth))
      const viewportHeight = Math.max(1, Math.round(window.visualViewport?.height ?? window.innerHeight))
      const viewportAspect = viewportWidth / viewportHeight
      const videoAspect = chooseDisplayAspect(state.videoWidth, state.videoHeight)

      let cssWidth
      let cssHeight

      if (videoAspect > viewportAspect) {
        cssWidth = viewportWidth
        cssHeight = cssWidth / videoAspect
      } else {
        cssHeight = viewportHeight
        cssWidth = cssHeight * videoAspect
      }

      cssWidth = Math.max(1, Math.round(cssWidth))
      cssHeight = Math.max(1, Math.round(cssHeight))

      if (
        Math.abs(state.displayWidth - cssWidth) < 2 &&
        Math.abs(state.displayHeight - cssHeight) < 2
      ) {
        return
      }

      state.displayWidth = cssWidth
      state.displayHeight = cssHeight
      state.applyingGeometry = true

      const widthValue = `${cssWidth}px`
      const heightValue = `${cssHeight}px`

      cameraVideo.style.width = widthValue
      cameraVideo.style.height = heightValue
      canvas.style.width = widthValue
      canvas.style.height = heightValue

      try {
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2)
        state.renderer.setPixelRatio(pixelRatio)
        state.renderer.setSize(cssWidth, cssHeight, false)
        state.renderer.setClearColor(0x000000, 0)
        state.renderer.setClearAlpha(0)

        state.XR8.XrController.updateCameraProjectionMatrix({
          cam: {
            pixelRectWidth: canvas.width,
            pixelRectHeight: canvas.height,
            nearClipPlane: 0.01,
            farClipPlane: 100,
          },
        })
      } catch (error) {
        console.warn('display geometry warning:', error)
      } finally {
        state.applyingGeometry = false
      }
    }

    async function attachCameraStream(stream) {
      if (!stream || cameraVideo.srcObject === stream) return
      state.stream = stream
      cameraVideo.srcObject = stream
      cameraVideo.muted = true
      cameraVideo.playsInline = true

      try {
        await cameraVideo.play()
      } catch (error) {
        console.warn('video play warning:', error)
      }
    }

    function hitTypePriority(type) {
      if (type === 'DETECTED_SURFACE') return 3
      if (type === 'ESTIMATED_SURFACE') return 2
      if (type === 'FEATURE_POINT') return 1
      return 0
    }

    function finitePosition(position) {
      return (
        position &&
        Number.isFinite(position.x) &&
        Number.isFinite(position.y) &&
        Number.isFinite(position.z)
      )
    }

    function median(values) {
      if (!values.length) return NaN
      const sorted = [...values].sort((a, b) => a - b)
      const middle = Math.floor(sorted.length / 2)
      return sorted.length % 2
        ? sorted[middle]
        : (sorted[middle - 1] + sorted[middle]) / 2
    }

    function medianVector(points) {
      return new THREE.Vector3(
        median(points.map(point => point.x)),
        median(points.map(point => point.y)),
        median(points.map(point => point.z)),
      )
    }

    function pickBestHit(hits) {
      if (!Array.isArray(hits)) return null

      return (
        hits
          .filter(hit => hitTypePriority(hit.type) > 0 && finitePosition(hit.position))
          .filter(hit => !Number.isFinite(hit.distance) || (hit.distance > 0.12 && hit.distance < 10))
          .sort((a, b) => {
            const priority = hitTypePriority(b.type) - hitTypePriority(a.type)
            if (priority !== 0) return priority
            const ad = Number.isFinite(a.distance) ? a.distance : Infinity
            const bd = Number.isFinite(b.distance) ? b.distance : Infinity
            return ad - bd
          })[0] || null
      )
    }

    /*
      hitTest의 X/Y는 0~1 범위이며 화면 중앙은 0.5, 0.5다.
      중앙 주변 9개 위치를 조회해 단일 hit의 노이즈를 줄인다.
    */
    function sampleCenterHit() {
      if (!state.XR8?.XrController) return null

      const offsets = [
        [0, 0],
        [-0.022, 0],
        [0.022, 0],
        [0, -0.022],
        [0, 0.022],
        [-0.016, -0.016],
        [0.016, -0.016],
        [-0.016, 0.016],
        [0.016, 0.016],
      ]

      const hits = []

      for (const [dx, dy] of offsets) {
        try {
          const results =
            state.XR8.XrController.hitTest(0.5 + dx, 0.5 + dy, [
              'FEATURE_POINT',
              'ESTIMATED_SURFACE',
              'DETECTED_SURFACE',
            ]) || []
          const hit = pickBestHit(results)
          if (hit) hits.push(hit)
        } catch (error) {
          console.warn('hitTest warning:', error)
        }
      }

      if (!hits.length) return null

      const maxPriority = Math.max(...hits.map(hit => hitTypePriority(hit.type)))
      const strongest = hits.filter(hit => hitTypePriority(hit.type) === maxPriority)
      const positions = strongest.map(hit => new THREE.Vector3(
        hit.position.x,
        hit.position.y,
        hit.position.z,
      ))

      const center = medianVector(positions)
      const distances = positions.map(position => position.distanceTo(center))
      const spread = median(distances)
      const threshold = THREE.MathUtils.clamp(spread * 3 + 0.035, 0.055, 0.22)
      const inliers = positions.filter(position => position.distanceTo(center) <= threshold)
      const finalPoints = inliers.length >= 2 ? inliers : positions

      return {
        type: strongest[0].type,
        position: medianVector(finalPoints),
        sampleCount: finalPoints.length,
      }
    }

    async function captureStableFloorPoint(label) {
      if (state.measuring) return null
      if (!state.trackingReady) {
        throw new Error('공간 추적이 아직 안정되지 않았습니다. 바닥을 천천히 비춘 뒤 다시 시도해 주세요.')
      }

      state.measuring = true
      measureProgressBar.style.width = '0%'
      setStatus(`${label}을 여러 번 측정하고 있습니다. 휴대폰을 잠시 고정하세요.`)
      updateUi()

      const samples = []
      const duration = 850
      const interval = 70
      const start = performance.now()

      try {
        while (performance.now() - start < duration) {
          const hit = sampleCenterHit()
          if (hit) samples.push(hit.position.clone())

          const progress = Math.min(100, ((performance.now() - start) / duration) * 100)
          measureProgressBar.style.width = `${progress.toFixed(0)}%`
          await new Promise(resolve => window.setTimeout(resolve, interval))
        }
      } finally {
        state.measuring = false
        measureProgressBar.style.width = '0%'
      }

      if (samples.length < 5) {
        updateUi()
        throw new Error('바닥 위치를 충분히 측정하지 못했습니다. 무늬가 있는 바닥을 중앙에 맞춰 다시 시도해 주세요.')
      }

      const center = medianVector(samples)
      const residuals = samples.map(point => point.distanceTo(center))
      const medianResidual = median(residuals)
      const threshold = THREE.MathUtils.clamp(medianResidual * 3 + 0.04, 0.07, 0.28)
      const inliers = samples.filter(point => point.distanceTo(center) <= threshold)

      if (inliers.length < 4) {
        updateUi()
        throw new Error('측정값이 너무 흔들렸습니다. 휴대폰을 고정하고 다시 측정해 주세요.')
      }

      const result = medianVector(inliers)
      updateUi()
      return result
    }

    function createMarker(color) {
      return new THREE.Mesh(
        new THREE.SphereGeometry(0.045, 18, 18),
        new THREE.MeshBasicMaterial({
          color,
          transparent: true,
          opacity: 0.95,
          depthTest: false,
          toneMapped: false,
        }),
      )
    }

    function createLine(points, color, dashed = false) {
      const geometry = new THREE.BufferGeometry().setFromPoints(points)
      const material = dashed
        ? new THREE.LineDashedMaterial({
            color,
            dashSize: 0.08,
            gapSize: 0.045,
            depthTest: false,
            toneMapped: false,
          })
        : new THREE.LineBasicMaterial({color, depthTest: false, toneMapped: false})
      const line = new THREE.Line(geometry, material)
      if (dashed) line.computeLineDistances()
      return line
    }

    function removeObject(object) {
      if (!object) return
      object.removeFromParent()
      object.geometry?.dispose?.()
      if (Array.isArray(object.material)) {
        object.material.forEach(material => material.dispose?.())
      } else {
        object.material?.dispose?.()
      }
    }

    function clearMeasurementObjects() {
      removeObject(state.wallMarker)
      removeObject(state.footMarker)
      removeObject(state.measureLine)
      removeObject(state.wallBaseLine)
      state.wallMarker = null
      state.footMarker = null
      state.measureLine = null
      state.wallBaseLine = null
    }

    function showWallMarker() {
      removeObject(state.wallMarker)
      state.wallMarker = createMarker(0xff6675)
      state.wallMarker.position.copy(state.wallFloorPoint)
      state.wallMarker.position.y += 0.045
      state.scene.add(state.wallMarker)
    }

    function showMeasurementObjects() {
      removeObject(state.footMarker)
      removeObject(state.measureLine)
      removeObject(state.wallBaseLine)

      state.footMarker = createMarker(0x65d7ff)
      state.footMarker.position.copy(state.footFloorPoint)
      state.footMarker.position.y += 0.045
      state.scene.add(state.footMarker)

      state.measureLine = createLine(
        [
          state.wallFloorPoint.clone().add(new THREE.Vector3(0, 0.025, 0)),
          state.footFloorPoint.clone().add(new THREE.Vector3(0, 0.025, 0)),
        ],
        0x65d7ff,
        true,
      )
      state.scene.add(state.measureLine)

      const right = new THREE.Vector3().crossVectors(WORLD_UP, state.wallNormal).normalize()
      const start = state.wallFloorPoint.clone().addScaledVector(right, -1.35)
      const end = state.wallFloorPoint.clone().addScaledVector(right, 1.35)
      start.y += 0.02
      end.y += 0.02
      state.wallBaseLine = createLine([start, end], 0x59f49a)
      state.scene.add(state.wallBaseLine)
    }

    function createWallQuaternion(normal) {
      const wallNormal = normal.clone().normalize()
      const right = new THREE.Vector3().crossVectors(WORLD_UP, wallNormal)
      if (right.lengthSq() < 1e-8) return null
      right.normalize()
      const up = new THREE.Vector3().crossVectors(wallNormal, right).normalize()
      const matrix = new THREE.Matrix4().makeBasis(right, up, wallNormal)
      return new THREE.Quaternion().setFromRotationMatrix(matrix)
    }

    function defineWallFromFloorPoints() {
      if (!state.wallFloorPoint || !state.footFloorPoint) {
        throw new Error('두 개의 바닥점이 모두 필요합니다.')
      }

      const yDifference = Math.abs(state.wallFloorPoint.y - state.footFloorPoint.y)
      if (yDifference > 0.24) {
        throw new Error('두 지점이 같은 바닥으로 측정되지 않았습니다. 두 점을 모두 바닥에 맞춰 다시 측정해 주세요.')
      }

      state.floorY = median([state.wallFloorPoint.y, state.footFloorPoint.y])
      state.wallFloorPoint.y = state.floorY
      state.footFloorPoint.y = state.floorY

      const normal = state.footFloorPoint.clone().sub(state.wallFloorPoint)
      normal.y = 0
      const distance = normal.length()

      if (distance < 0.45) {
        throw new Error('두 지점 사이가 너무 가깝습니다. 벽에서 45cm 이상 떨어진 위치를 두 번째 점으로 찍어 주세요.')
      }
      if (distance > 8) {
        throw new Error('측정 거리가 너무 큽니다. 벽 가까이에서 다시 측정해 주세요.')
      }

      normal.normalize()
      const quaternion = createWallQuaternion(normal)
      if (!quaternion) throw new Error('벽 방향을 계산하지 못했습니다.')

      state.wallNormal = normal.clone()
      state.wallQuaternion = quaternion.clone()
      state.wallDistance = distance
      state.wallPlane = new THREE.Plane().setFromNormalAndCoplanarPoint(
        state.wallNormal,
        state.wallFloorPoint,
      )

      showWallMarker()
      showMeasurementObjects()
    }

    function disposeArtwork() {
      if (state.artworkGroup) {
        state.artworkGroup.removeFromParent()
        state.artworkGroup.traverse(object => {
          object.geometry?.dispose?.()
          if (Array.isArray(object.material)) {
            object.material.forEach(material => material.dispose?.())
          } else {
            object.material?.dispose?.()
          }
        })
      }

      state.artworkTexture?.dispose?.()
      state.artworkTexture = null
      state.artworkGroup = null
      state.artworkLoaded = false
      state.artworkScale = 1
      state.lockedPosition = null
      state.lockedQuaternion = null
    }

    function buildArtworkGroup(width, height, texture = null) {
      if (!state.scene) throw new Error('AR 장면이 아직 준비되지 않았습니다.')

      if (state.artworkGroup) {
        state.artworkGroup.removeFromParent()
        state.artworkGroup.traverse(object => {
          object.geometry?.dispose?.()
          if (Array.isArray(object.material)) {
            object.material.forEach(material => material.dispose?.())
          } else {
            object.material?.dispose?.()
          }
        })
      }

      const group = new THREE.Group()
      group.name = 'world-locked-artwork'
      group.visible = false

      const backing = new THREE.Mesh(
        new THREE.PlaneGeometry(width + 0.045, height + 0.045),
        new THREE.MeshBasicMaterial({
          color: 0x111111,
          side: THREE.DoubleSide,
          toneMapped: false,
        }),
      )
      backing.position.z = -0.004
      group.add(backing)

      const material = texture
        ? new THREE.MeshBasicMaterial({
            map: texture,
            transparent: true,
            side: THREE.DoubleSide,
            toneMapped: false,
          })
        : new THREE.MeshBasicMaterial({
            color: 0x59f49a,
            transparent: true,
            opacity: 0.25,
            side: THREE.DoubleSide,
            depthWrite: false,
            toneMapped: false,
          })

      const imageMesh = new THREE.Mesh(new THREE.PlaneGeometry(width, height), material)
      imageMesh.renderOrder = 20
      group.add(imageMesh)

      const outline = new THREE.LineSegments(
        new THREE.EdgesGeometry(new THREE.PlaneGeometry(width + 0.012, height + 0.012)),
        new THREE.LineBasicMaterial({
          color: texture ? 0xffffff : 0x59f49a,
          transparent: true,
          opacity: 0.92,
          depthTest: false,
          toneMapped: false,
        }),
      )
      outline.position.z = 0.005
      group.add(outline)

      state.scene.add(group)
      state.artworkGroup = group
      state.artworkWidth = width
      state.artworkHeight = height
      state.artworkScale = 1
    }

    function ensurePlaceholderArtwork() {
      if (!state.artworkGroup) buildArtworkGroup(0.7, 0.5, null)
    }

    async function fileToCanvas(file) {
      const maxSize = 2048
      const objectUrl = URL.createObjectURL(file)

      try {
        const image = await new Promise((resolve, reject) => {
          const element = new Image()
          element.onload = () => resolve(element)
          element.onerror = () => reject(new Error('이미지를 읽지 못했습니다.'))
          element.src = objectUrl
        })

        const ratio = Math.min(1, maxSize / Math.max(image.naturalWidth, image.naturalHeight))
        const width = Math.max(1, Math.round(image.naturalWidth * ratio))
        const height = Math.max(1, Math.round(image.naturalHeight * ratio))
        const output = document.createElement('canvas')
        output.width = width
        output.height = height
        const context = output.getContext('2d', {alpha: true})
        if (!context) throw new Error('이미지 처리용 Canvas를 만들 수 없습니다.')
        context.drawImage(image, 0, 0, width, height)
        return output
      } finally {
        URL.revokeObjectURL(objectUrl)
      }
    }

    async function loadArtwork(file) {
      if (!file.type.startsWith('image/')) {
        throw new Error('이미지 파일만 선택할 수 있습니다.')
      }

      setStatus('이미지를 준비하는 중입니다.')
      const imageCanvas = await fileToCanvas(file)
      const texture = new THREE.CanvasTexture(imageCanvas)
      texture.colorSpace = THREE.SRGBColorSpace
      texture.needsUpdate = true

      if (state.renderer) {
        texture.anisotropy = Math.min(8, state.renderer.capabilities.getMaxAnisotropy())
      }

      state.artworkTexture?.dispose?.()
      state.artworkTexture = texture

      const width = 0.7
      const height = width * (imageCanvas.height / imageCanvas.width)
      buildArtworkGroup(width, height, texture)
      state.artworkLoaded = true

      if (state.mode === MODES.AIM) {
        updateArtworkPreview()
      } else if (state.mode === MODES.PLACED && state.lockedPosition) {
        state.artworkGroup.position.copy(state.lockedPosition)
        state.artworkGroup.quaternion.copy(state.lockedQuaternion)
        state.artworkGroup.scale.setScalar(state.lockedScale)
        state.artworkGroup.visible = true
        freezeArtworkTransform()
      }

      updateUi()
    }

    function updateArtworkPreview() {
      state.previewPosition = null

      if (!state.wallPlane || !state.camera || state.mode !== MODES.AIM) {
        if (state.artworkGroup && state.mode !== MODES.PLACED) {
          state.artworkGroup.visible = false
        }
        updateUi()
        return
      }

      ensurePlaceholderArtwork()
      state.artworkGroup.matrixAutoUpdate = true
      state.camera.updateMatrixWorld(true)

      const raycaster = new THREE.Raycaster()
      raycaster.setFromCamera(CENTER_NDC, state.camera)
      const intersection = raycaster.ray.intersectPlane(
        state.wallPlane,
        new THREE.Vector3(),
      )

      if (!intersection || intersection.y < state.floorY + 0.25 || intersection.y > state.floorY + 4.5) {
        state.artworkGroup.visible = false
        updateUi()
        return
      }

      const cameraPosition = new THREE.Vector3()
      state.camera.getWorldPosition(cameraPosition)
      const viewDistance = cameraPosition.distanceTo(intersection)
      if (viewDistance < 0.25 || viewDistance > 10) {
        state.artworkGroup.visible = false
        updateUi()
        return
      }

      state.previewPosition = intersection.clone().addScaledVector(state.wallNormal, 0.012)
      state.artworkGroup.position.copy(state.previewPosition)
      state.artworkGroup.quaternion.copy(state.wallQuaternion)
      state.artworkGroup.scale.setScalar(state.artworkScale)
      state.artworkGroup.visible = true
      state.artworkGroup.updateMatrix()
      updateUi()
    }

    function freezeArtworkTransform() {
      if (!state.artworkGroup) return
      state.artworkGroup.updateMatrix()
      state.artworkGroup.matrixAutoUpdate = false
      state.artworkGroup.matrixWorldNeedsUpdate = true
    }

    function unfreezeArtworkTransform() {
      if (!state.artworkGroup) return
      state.artworkGroup.matrixAutoUpdate = true
    }

    async function captureWallPoint() {
      try {
        const point = await captureStableFloorPoint('벽 아래 바닥점')
        if (!point) return
        state.wallFloorPoint = point.clone()
        showWallMarker()
        state.mode = MODES.FOOT_POINT
        state.currentCenterHit = null
        updateUi()
      } catch (error) {
        showError(error instanceof Error ? error.message : '벽 아래점을 측정하지 못했습니다.')
      }
    }

    async function captureFootPoint() {
      try {
        const point = await captureStableFloorPoint('사용자 쪽 바닥점')
        if (!point) return
        state.footFloorPoint = point.clone()
        defineWallFromFloorPoints()
        state.mode = MODES.AIM
        state.currentCenterHit = null
        ensurePlaceholderArtwork()
        updateArtworkPreview()
        updateUi()
      } catch (error) {
        state.footFloorPoint = null
        showError(error instanceof Error ? error.message : '사용자 쪽 바닥점을 측정하지 못했습니다.')
      }
    }

    function placeArtwork() {
      if (!state.previewPosition || !state.artworkLoaded || !state.artworkGroup) return

      unfreezeArtworkTransform()

      /* 장면 루트에 직접 연결해 카메라의 자식으로 남을 가능성을 제거한다. */
      if (state.artworkGroup.parent !== state.scene) {
        state.scene.attach(state.artworkGroup)
      }

      state.artworkGroup.position.copy(state.previewPosition)
      state.artworkGroup.quaternion.copy(state.wallQuaternion)
      state.artworkGroup.scale.setScalar(state.artworkScale)
      state.artworkGroup.visible = true

      state.lockedPosition = state.artworkGroup.position.clone()
      state.lockedQuaternion = state.artworkGroup.quaternion.clone()
      state.lockedScale = state.artworkScale

      freezeArtworkTransform()
      state.mode = MODES.PLACED
      updateUi()
    }

    function resetMeasurement({keepArtwork = true} = {}) {
      clearMeasurementObjects()

      state.wallFloorPoint = null
      state.footFloorPoint = null
      state.floorY = 0
      state.wallNormal = null
      state.wallPlane = null
      state.wallQuaternion = null
      state.wallDistance = 0
      state.previewPosition = null
      state.lockedPosition = null
      state.lockedQuaternion = null
      state.lockedScale = 1
      state.currentCenterHit = null
      state.mode = MODES.WALL_POINT
      state.pointers.clear()
      state.dragActive = false

      if (state.artworkGroup) {
        unfreezeArtworkTransform()
        state.artworkGroup.visible = false
      }

      if (!keepArtwork) disposeArtwork()
      updateUi()
    }

    function screenPointToWall(clientX, clientY) {
      if (!state.wallPlane || !state.camera) return null

      const rect = canvas.getBoundingClientRect()
      if (
        clientX < rect.left || clientX > rect.right ||
        clientY < rect.top || clientY > rect.bottom
      ) {
        return null
      }

      const ndc = new THREE.Vector2(
        ((clientX - rect.left) / rect.width) * 2 - 1,
        -((clientY - rect.top) / rect.height) * 2 + 1,
      )

      const raycaster = new THREE.Raycaster()
      raycaster.setFromCamera(ndc, state.camera)
      return raycaster.ray.intersectPlane(state.wallPlane, new THREE.Vector3())
    }

    function pointerDistance() {
      const values = [...state.pointers.values()]
      if (values.length < 2) return 0
      return Math.hypot(values[0].x - values[1].x, values[0].y - values[1].y)
    }

    function commitInteractiveTransform() {
      if (!state.artworkGroup) return
      state.lockedPosition = state.artworkGroup.position.clone()
      state.lockedQuaternion = state.artworkGroup.quaternion.clone()
      state.lockedScale = state.artworkScale
      freezeArtworkTransform()
    }

    function handlePointerDown(event) {
      if (state.mode !== MODES.PLACED || !state.artworkGroup) return

      gestureLayer.setPointerCapture?.(event.pointerId)
      state.pointers.set(event.pointerId, {x: event.clientX, y: event.clientY})
      unfreezeArtworkTransform()

      if (state.pointers.size === 1) {
        const intersection = screenPointToWall(event.clientX, event.clientY)
        if (intersection) {
          state.dragOffset.copy(state.artworkGroup.position).sub(intersection)
          state.dragActive = true
        }
      } else if (state.pointers.size === 2) {
        state.dragActive = false
        state.pinchStartDistance = pointerDistance()
        state.pinchStartScale = state.artworkScale
      }
    }

    function handlePointerMove(event) {
      if (!state.pointers.has(event.pointerId) || state.mode !== MODES.PLACED) return
      state.pointers.set(event.pointerId, {x: event.clientX, y: event.clientY})

      if (state.pointers.size === 1 && state.dragActive) {
        const intersection = screenPointToWall(event.clientX, event.clientY)
        if (!intersection) return
        const next = intersection.add(state.dragOffset)
        next.y = THREE.MathUtils.clamp(next.y, state.floorY + 0.25, state.floorY + 4.5)
        state.artworkGroup.position.copy(next)
        state.artworkGroup.updateMatrix()
        return
      }

      if (state.pointers.size === 2 && state.pinchStartDistance > 0) {
        const current = pointerDistance()
        state.artworkScale = THREE.MathUtils.clamp(
          state.pinchStartScale * (current / state.pinchStartDistance),
          0.35,
          3,
        )
        state.artworkGroup.scale.setScalar(state.artworkScale)
        state.artworkGroup.updateMatrix()
      }
    }

    function handlePointerUp(event) {
      state.pointers.delete(event.pointerId)
      gestureLayer.releasePointerCapture?.(event.pointerId)

      if (state.pointers.size < 2) state.pinchStartDistance = 0
      if (state.pointers.size === 0) {
        state.dragActive = false
        commitInteractiveTransform()
      }
    }

    function vectorText(vector) {
      return `${vector.x.toFixed(2)}, ${vector.y.toFixed(2)}, ${vector.z.toFixed(2)}`
    }

    function updateDebug(reality = null) {
      const cameraPosition = state.camera ? new THREE.Vector3() : null
      if (cameraPosition) state.camera.getWorldPosition(cameraPosition)

      debugElement.textContent = [
        `mode: ${state.mode}`,
        `camera: ${state.cameraStatus}`,
        `tracking: ${state.trackingStatus}`,
        `reason: ${state.trackingReason || '-'}`,
        `stableFrames: ${state.trackingStableFrames}`,
        `trackingReady: ${state.trackingReady}`,
        `video: ${state.videoWidth} x ${state.videoHeight}`,
        `display: ${state.displayWidth} x ${state.displayHeight}`,
        `canvas: ${canvas.width} x ${canvas.height}`,
        `centerHit: ${state.currentCenterHit?.type || '-'}`,
        `wallPoint: ${state.wallFloorPoint ? vectorText(state.wallFloorPoint) : '-'}`,
        `footPoint: ${state.footFloorPoint ? vectorText(state.footFloorPoint) : '-'}`,
        `wallDistance: ${state.wallDistance ? state.wallDistance.toFixed(3) : '-'}m`,
        `cameraPosition: ${cameraPosition ? vectorText(cameraPosition) : '-'}`,
        `imageParent: ${state.artworkGroup?.parent?.name || state.artworkGroup?.parent?.type || '-'}`,
        `matrixAutoUpdate: ${state.artworkGroup?.matrixAutoUpdate ?? '-'}`,
        `worldPoints: ${reality?.worldPoints?.length || 0}`,
      ].join('\n')
    }

    function updateTrackingState(reality) {
      if (!reality) return

      state.trackingStatus = reality.trackingStatus || 'UNKNOWN'
      state.trackingReason = reality.trackingReason || null

      const normal =
        state.trackingStatus === 'NORMAL' &&
        state.trackingReason !== 'INITIALIZING'

      state.trackingStableFrames = normal
        ? Math.min(120, state.trackingStableFrames + 1)
        : 0
      state.trackingReady = state.trackingStableFrames >= 20
    }

    function createApplicationPipelineModule(XR8) {
      return {
        name: 'two-floor-point-wall-lock',

        onCameraStatusChange({status}) {
          state.cameraStatus = status || 'UNKNOWN'
          if (status === 'requesting') setStatus('카메라 권한을 요청하는 중입니다.')
          if (status === 'hasStream') setStatus('카메라 영상을 준비하는 중입니다.')
          if (status === 'hasVideo') setStatus('바닥을 비추며 천천히 움직여 주세요.')
          if (status === 'failed') {
            showError('카메라를 시작하지 못했습니다.\n브라우저 카메라 권한을 확인해 주세요.')
          }
        },

        async onAttach({stream, videoWidth, videoHeight, orientation}) {
          state.videoWidth = videoWidth || state.videoWidth
          state.videoHeight = videoHeight || state.videoHeight
          state.orientation = orientation || 0
          await attachCameraStream(stream)
          scheduleDisplayGeometry()
        },

        onStart() {
          const {scene, camera, renderer} = XR8.Threejs.xrScene()
          state.scene = scene
          state.camera = camera
          state.renderer = renderer

          scene.background = null
          renderer.setClearColor(0x000000, 0)
          renderer.setClearAlpha(0)
          renderer.autoClear = true

          setImageInputEnabled(true)
          updateViewportHeight()
          enforceLayerOrder()
          scheduleDisplayGeometry()
          updateUi()
        },

        onVideoSizeChange({videoWidth, videoHeight, orientation}) {
          state.videoWidth = videoWidth || state.videoWidth
          state.videoHeight = videoHeight || state.videoHeight
          state.orientation = orientation || 0
          scheduleDisplayGeometry()
        },

        onCanvasSizeChange({videoWidth, videoHeight}) {
          state.videoWidth = videoWidth || state.videoWidth
          state.videoHeight = videoHeight || state.videoHeight
          updateViewportHeight()
          enforceLayerOrder()
          if (!state.applyingGeometry) scheduleDisplayGeometry()
        },

        onDeviceOrientationChange({videoWidth, videoHeight, orientation}) {
          state.videoWidth = videoWidth || state.videoWidth
          state.videoHeight = videoHeight || state.videoHeight
          state.orientation = orientation || 0
          window.setTimeout(scheduleDisplayGeometry, 120)
        },

        onUpdate({processCpuResult}) {
          const reality = processCpuResult?.reality
          updateTrackingState(reality)

          const now = performance.now()

          if (
            !state.measuring &&
            (state.mode === MODES.WALL_POINT || state.mode === MODES.FOOT_POINT) &&
            now - state.lastHitSampleTime > 180
          ) {
            state.lastHitSampleTime = now
            state.currentCenterHit = sampleCenterHit()
            updateUi()
          }

          if (
            state.mode === MODES.AIM &&
            now - state.lastPreviewTime > 70
          ) {
            state.lastPreviewTime = now
            updateArtworkPreview()
          }

          /* PLACED 상태에서는 위치·회전·크기를 절대 다시 계산하지 않는다. */
          if (state.mode === MODES.PLACED && state.artworkGroup) {
            state.artworkGroup.matrixWorldNeedsUpdate = true
          }

          if (now - state.lastDebugTime > 300) {
            state.lastDebugTime = now
            updateDebug(reality)
          }
        },

        onPaused() {
          setStatus('카메라가 일시 중지되었습니다.')
        },

        onResume() {
          state.trackingStableFrames = 0
          state.trackingReady = false
          setStatus('공간 위치를 복구하고 있습니다. 천천히 움직여 주세요.')
          window.setTimeout(updateUi, 500)
        },

        onException(error) {
          console.error('XR pipeline error:', error)
          showError('AR 실행 중 오류가 발생했습니다.\n페이지를 새로고침해 주세요.')
        },
      }
    }

    function startXR(XR8) {
      if (state.xrStarted) return
      state.xrStarted = true
      state.XR8 = XR8

      XR8.XrController.configure({
        disableWorldTracking: false,
        enableWorldPoints: true,
        enableLighting: false,
        scale: 'absolute',
      })

      XR8.Threejs.configure({renderCameraTexture: false})

      XR8.addCameraPipelineModules([
        XR8.Threejs.pipelineModule(),
        XR8.XrController.pipelineModule(),
        createApplicationPipelineModule(XR8),
      ])

      const options = {
        canvas,
        glContextConfig: {
          alpha: true,
          antialias: true,
          premultipliedAlpha: true,
          preserveDrawingBuffer: false,
        },
      }

      if (XR8.XrConfig?.device) {
        options.allowedDevices = XR8.XrConfig.device().MOBILE
      }

      XR8.run(options)
    }

    captureButton.addEventListener('click', async event => {
      event.preventDefault()
      event.stopPropagation()

      if (state.mode === MODES.WALL_POINT) {
        await captureWallPoint()
      } else if (state.mode === MODES.FOOT_POINT) {
        await captureFootPoint()
      } else if (state.mode === MODES.AIM) {
        placeArtwork()
      }
    })

    imageInput.addEventListener('change', async event => {
      const file = event.target.files?.[0]
      if (!file) return

      try {
        await loadArtwork(file)
      } catch (error) {
        console.error(error)
        showError(error instanceof Error ? error.message : '이미지를 불러오지 못했습니다.')
      } finally {
        event.target.value = ''
      }
    })

    retakeButton.addEventListener('click', event => {
      event.preventDefault()
      event.stopPropagation()
      resetMeasurement({keepArtwork: true})
    })

    resetButton.addEventListener('click', event => {
      event.preventDefault()
      event.stopPropagation()
      resetMeasurement({keepArtwork: false})
    })

    debugButton.addEventListener('click', event => {
      event.preventDefault()
      event.stopPropagation()
      debugElement.classList.toggle('visible')
    })

    closeErrorButton.addEventListener('click', hideError)
    reloadButton.addEventListener('click', () => window.location.reload())

    gestureLayer.addEventListener('pointerdown', handlePointerDown)
    gestureLayer.addEventListener('pointermove', handlePointerMove)
    gestureLayer.addEventListener('pointerup', handlePointerUp)
    gestureLayer.addEventListener('pointercancel', handlePointerUp)

    window.addEventListener('resize', () => {
      updateViewportHeight()
      scheduleDisplayGeometry()
    }, {passive: true})

    window.addEventListener('orientationchange', () => {
      window.setTimeout(() => {
        updateViewportHeight()
        scheduleDisplayGeometry()
      }, 180)
    }, {passive: true})

    window.visualViewport?.addEventListener('resize', () => {
      updateViewportHeight()
      scheduleDisplayGeometry()
    }, {passive: true})

    const bodyObserver = new MutationObserver(() => {
      window.requestAnimationFrame(enforceLayerOrder)
    })
    bodyObserver.observe(document.body, {childList: true})

    async function initialize() {
      if (state.xrLoading) return
      state.xrLoading = true

      hideError()
      setImageInputEnabled(false)
      updateViewportHeight()
      enforceLayerOrder()
      updateUi()

      try {
        const XR8 = await loadXR8Engine()
        startXR(XR8)
      } catch (error) {
        console.error(error)
        showError(
          error instanceof Error
            ? error.message
            : 'AR 엔진을 초기화하지 못했습니다.',
        )
      }
    }

    initialize()
  </script>
</body>
</html>

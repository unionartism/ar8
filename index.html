<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="
      width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover
    "
  >

  <meta name="theme-color" content="#000000">

  <title>Wall Art AR</title>

  <style>
    :root {
      --app-height: 100dvh;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      overflow: hidden;
      overscroll-behavior: none;

      background: #000;
    }

    body {
      position: fixed;
      inset: 0;

      height: var(--app-height);

      touch-action: none;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    /*
     * 카메라 canvas의 실제 위치와 크기는 JavaScript에서
     * 카메라 영상 비율에 맞춰 설정합니다.
     */
    #camerafeed {
      position: fixed !important;

      z-index: 0 !important;

      display: block !important;

      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;

      background: #000 !important;

      pointer-events: none !important;
    }

    /*
     * HTML 인터페이스 최상위 레이어
     */
    #arUiRoot {
      position: fixed !important;
      inset: 0 !important;

      z-index: 2147483647 !important;

      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;

      width: 100vw !important;
      height: var(--app-height) !important;

      overflow: hidden !important;

      pointer-events: none !important;

      isolation: isolate;
    }

    #status {
      position: absolute;

      top: max(
        14px,
        env(safe-area-inset-top)
      );

      left: 50%;

      z-index: 20;

      width: max-content;
      max-width: calc(100vw - 28px);

      padding: 10px 14px;

      overflow: hidden;

      border:
        1px solid
        rgb(255 255 255 / 18%);

      border-radius: 999px;

      background:
        rgb(0 0 0 / 72%);

      color: #fff;

      font-size: 14px;
      font-weight: 650;
      line-height: 1.4;

      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;

      box-shadow:
        0 5px 20px
        rgb(0 0 0 / 25%);

      transform:
        translateX(-50%);

      backdrop-filter:
        blur(10px);
    }

    #reticle {
      position: absolute;

      top: 50%;
      left: 50%;

      z-index: 15;

      width: 48px;
      height: 48px;

      border:
        2px solid
        rgb(255 255 255 / 90%);

      border-radius: 50%;

      color: #fff;

      box-shadow:
        0 0 0 1px
        rgb(0 0 0 / 50%),
        0 0 18px
        rgb(255 255 255 / 18%);

      transform:
        translate(-50%, -50%);

      transition:
        width 160ms,
        height 160ms,
        color 160ms,
        border-color 160ms,
        box-shadow 160ms;

      pointer-events: none;
    }

    #reticle::before,
    #reticle::after {
      position: absolute;

      top: 50%;
      left: 50%;

      background:
        currentColor;

      content: "";

      transform:
        translate(-50%, -50%);
    }

    #reticle::before {
      width: 18px;
      height: 1px;
    }

    #reticle::after {
      width: 1px;
      height: 18px;
    }

    #reticle.searching {
      border-color: #ffd166;
      color: #ffd166;
    }

    #reticle.ready {
      width: 58px;
      height: 58px;

      border-color: #58f59a;
      color: #58f59a;

      box-shadow:
        0 0 0 1px
        rgb(0 0 0 / 50%),
        0 0 28px
        rgb(88 245 154 / 55%);
    }

    #controls {
      position: absolute;

      right: 10px;

      bottom: max(
        14px,
        env(safe-area-inset-bottom)
      );

      left: 10px;

      z-index: 30;

      display: flex;

      flex-wrap: wrap;

      align-items: center;
      justify-content: center;

      gap: 7px;

      pointer-events: auto;
    }

    button,
    .file-button {
      display: inline-flex;

      min-height: 44px;

      align-items: center;
      justify-content: center;

      padding: 0 13px;

      border: 0;
      border-radius: 999px;

      background:
        rgb(255 255 255 / 96%);

      color: #111;

      font: inherit;
      font-size: 13px;
      font-weight: 760;

      white-space: nowrap;

      box-shadow:
        0 5px 20px
        rgb(0 0 0 / 32%);

      cursor: pointer;
      user-select: none;

      pointer-events: auto !important;
    }

    button:active,
    .file-button:active {
      transform: scale(0.97);
    }

    button:disabled,
    .file-button.disabled {
      opacity: 0.42;
      cursor: default;
      transform: none;
    }

    #placeButton:not(:disabled) {
      background: #58f59a;
    }

    #imageInput {
      position: absolute;

      width: 1px;
      height: 1px;

      overflow: hidden;

      opacity: 0;

      pointer-events: none;
    }

    #debug {
      position: absolute;

      right: 9px;

      bottom: calc(
        max(
          14px,
          env(safe-area-inset-bottom)
        ) + 104px
      );

      z-index: 25;

      max-width: 210px;

      padding: 8px 10px;

      border:
        1px solid
        rgb(255 255 255 / 14%);

      border-radius: 9px;

      background:
        rgb(0 0 0 / 68%);

      color: #fff;

      font:
        10px/1.5
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

      white-space: pre-wrap;

      box-shadow:
        0 5px 18px
        rgb(0 0 0 / 24%);

      backdrop-filter:
        blur(8px);

      pointer-events: none;
    }

    #errorPanel {
      position: absolute;
      inset: 0;

      z-index: 100;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 24px;

      background:
        rgb(0 0 0 / 94%);

      color: #fff;

      text-align: center;

      pointer-events: auto;
    }

    #errorPanel.visible {
      display: flex;
    }

    #errorPanelContent {
      width: 100%;
      max-width: 460px;
    }

    #errorTitle {
      margin: 0 0 12px;
      font-size: 22px;
    }

    #errorMessage {
      margin: 0 0 22px;

      color:
        rgb(255 255 255 / 78%);

      font-size: 15px;
      line-height: 1.65;

      white-space: pre-line;
    }

    @media (max-width: 380px) {
      button,
      .file-button {
        min-height: 42px;
        padding: 0 10px;
        font-size: 12px;
      }

      #debug {
        max-width: 170px;
        font-size: 9px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.172.0/build/three.module.min.js"
      }
    }
  </script>
</head>

<body>
  <canvas id="camerafeed"></canvas>

  <div id="arUiRoot">
    <div id="status">
      애플리케이션을 준비하는 중입니다.
    </div>

    <div id="reticle"></div>

    <div id="debug">UI: READY
XR8: WAIT</div>

    <div id="controls">
      <label
        id="fileButton"
        class="file-button disabled"
        for="imageInput"
      >
        이미지 선택

        <input
          id="imageInput"
          type="file"
          accept="image/*"
          disabled
        >
      </label>

      <button
        id="placeButton"
        type="button"
        disabled
      >
        벽에 배치
      </button>

      <button
        id="recenterButton"
        type="button"
      >
        재인식
      </button>

      <button
        id="fitButton"
        type="button"
      >
        화면 채우기
      </button>

      <button
        id="resetButton"
        type="button"
      >
        초기화
      </button>
    </div>

    <section id="errorPanel">
      <div id="errorPanelContent">
        <h1 id="errorTitle">
          AR을 실행할 수 없습니다
        </h1>

        <p id="errorMessage"></p>

        <button
          id="reloadButton"
          type="button"
        >
          다시 불러오기
        </button>
      </div>
    </section>
  </div>

  <script type="module">
    import * as THREE from 'three'

    /*
     * XR8 Three.js 파이프라인이 참조할 수 있도록
     * Three.js를 전역에 등록합니다.
     */
    window.THREE = THREE

    const XR8_ENGINE_URL =
      'https://cdn.jsdelivr.net/npm/' +
      '@8thwall/engine-binary@1/dist/xr.js'

    const WORLD_UP =
      new THREE.Vector3(0, 1, 0)

    const CENTER_NDC =
      new THREE.Vector2(0, 0)

    /*
     * 벽면 검출 조절값
     */
    const DETECTION = {
      sampleIntervalMs:
        220,

      historyDurationMs:
        1800,

      maxHistoryPoints:
        280,

      ransacIterations:
        120,

      minimumPoints:
        12,

      minimumInliers:
        10,

      /*
       * 벽 normal의 Y 성분 허용값.
       * 값이 낮을수록 더 수직인 평면만 허용합니다.
       */
      maximumNormalY:
        0.48,

      minimumExtentMeters:
        0.12,

      readyStableFrames:
        2,
    }

    /*
     * 화면 중앙 주변 5×5 hit-test
     */
    const SAMPLE_OFFSETS = [
      -0.16,
      -0.08,
      0,
      0.08,
      0.16,
    ]

    const WALL_SAMPLE_POINTS = []

    for (
      const yOffset
      of SAMPLE_OFFSETS
    ) {
      for (
        const xOffset
        of SAMPLE_OFFSETS
      ) {
        WALL_SAMPLE_POINTS.push([
          0.5 + xOffset,
          0.5 + yOffset,
        ])
      }
    }

    const state = {
      scene: null,
      camera: null,
      renderer: null,
      XR8: null,

      artwork: null,
      artworkTexture: null,

      wallSamples: [],

      wallCandidate: null,
      rawWallCandidate: null,

      wallStableFrames: 0,
      wallCandidateLastSeen: 0,
      wallSearchReason: '초기화',

      trackingStatus:
        'INITIALIZING',

      trackingReason:
        null,

      cameraStatus:
        'IDLE',

      sampleTimer:
        0,

      debugTimer:
        0,

      layoutTimer:
        0,

      xrStarted:
        false,

      xrLoading:
        false,

      videoWidth:
        0,

      videoHeight:
        0,

      orientation:
        0,

      /*
       * contain:
       * 카메라 원본 화각 보존.
       *
       * cover:
       * 화면을 채우지만 일부 잘릴 수 있음.
       */
      cameraFit:
        'contain',

      resizeLock:
        false,
    }

    const canvas =
      document.querySelector(
        '#camerafeed',
      )

    const uiRoot =
      document.querySelector(
        '#arUiRoot',
      )

    const statusElement =
      document.querySelector(
        '#status',
      )

    const reticleElement =
      document.querySelector(
        '#reticle',
      )

    const debugElement =
      document.querySelector(
        '#debug',
      )

    const controls =
      document.querySelector(
        '#controls',
      )

    const imageInput =
      document.querySelector(
        '#imageInput',
      )

    const fileButton =
      document.querySelector(
        '#fileButton',
      )

    const placeButton =
      document.querySelector(
        '#placeButton',
      )

    const recenterButton =
      document.querySelector(
        '#recenterButton',
      )

    const fitButton =
      document.querySelector(
        '#fitButton',
      )

    const resetButton =
      document.querySelector(
        '#resetButton',
      )

    const errorPanel =
      document.querySelector(
        '#errorPanel',
      )

    const errorMessage =
      document.querySelector(
        '#errorMessage',
      )

    const reloadButton =
      document.querySelector(
        '#reloadButton',
      )

    /*
     * -------------------------------------------------------
     * Viewport 및 카메라 표시 크기
     * -------------------------------------------------------
     */

    function getViewportSize() {
      return {
        width: Math.max(
          1,
          Math.round(
            window.visualViewport
              ?.width ??
            window.innerWidth,
          ),
        ),

        height: Math.max(
          1,
          Math.round(
            window.visualViewport
              ?.height ??
            window.innerHeight,
          ),
        ),
      }
    }

    function enforceLayerOrder() {
      canvas.style.setProperty(
        'z-index',
        '0',
        'important',
      )

      canvas.style.setProperty(
        'position',
        'fixed',
        'important',
      )

      canvas.style.setProperty(
        'display',
        'block',
        'important',
      )

      canvas.style.setProperty(
        'visibility',
        'visible',
        'important',
      )

      canvas.style.setProperty(
        'opacity',
        '1',
        'important',
      )

      canvas.style.setProperty(
        'pointer-events',
        'none',
        'important',
      )

      uiRoot.style.setProperty(
        'z-index',
        '2147483647',
        'important',
      )

      uiRoot.style.setProperty(
        'display',
        'block',
        'important',
      )

      uiRoot.style.setProperty(
        'visibility',
        'visible',
        'important',
      )

      uiRoot.style.setProperty(
        'opacity',
        '1',
        'important',
      )

      if (
        document.body.lastElementChild
        !== uiRoot
      ) {
        document.body.appendChild(
          uiRoot,
        )
      }
    }

    function updateViewportVariable() {
      const {
        height,
      } = getViewportSize()

      document.documentElement
        .style
        .setProperty(
          '--app-height',
          `${height}px`,
        )
    }

    /*
     * 기기마다 videoWidth/videoHeight의 방향이
     * 다를 수 있으므로 viewport 비율과 가장 가까운
     * 방향을 선택합니다.
     */
    function chooseCameraAspect(
      viewportAspect,
    ) {
      if (
        !state.videoWidth ||
        !state.videoHeight
      ) {
        return viewportAspect
      }

      const rawAspect =
        state.videoWidth /
        state.videoHeight

      const swappedAspect =
        state.videoHeight /
        state.videoWidth

      const rawDifference =
        Math.abs(
          Math.log(
            rawAspect /
            viewportAspect,
          ),
        )

      const swappedDifference =
        Math.abs(
          Math.log(
            swappedAspect /
            viewportAspect,
          ),
        )

      return (
        rawDifference <=
        swappedDifference
      )
        ? rawAspect
        : swappedAspect
    }

    function applyCameraLayout() {
      updateViewportVariable()
      enforceLayerOrder()

      const {
        width: viewportWidth,
        height: viewportHeight,
      } = getViewportSize()

      const viewportAspect =
        viewportWidth /
        viewportHeight

      const cameraAspect =
        chooseCameraAspect(
          viewportAspect,
        )

      let cssWidth
      let cssHeight

      /*
       * contain은 영상 전체를 보존합니다.
       * 화면과 카메라 비율이 다르면 검은 여백이 생깁니다.
       */
      if (
        state.cameraFit ===
        'contain'
      ) {
        if (
          viewportAspect >
          cameraAspect
        ) {
          cssHeight =
            viewportHeight

          cssWidth =
            cssHeight *
            cameraAspect
        } else {
          cssWidth =
            viewportWidth

          cssHeight =
            cssWidth /
            cameraAspect
        }
      } else if (
        viewportAspect >
        cameraAspect
      ) {
        /*
         * cover
         */
        cssWidth =
          viewportWidth

        cssHeight =
          cssWidth /
          cameraAspect
      } else {
        cssHeight =
          viewportHeight

        cssWidth =
          cssHeight *
          cameraAspect
      }

      cssWidth = Math.max(
        1,
        Math.round(cssWidth),
      )

      cssHeight = Math.max(
        1,
        Math.round(cssHeight),
      )

      const left =
        Math.round(
          (
            viewportWidth -
            cssWidth
          ) / 2,
        )

      const top =
        Math.round(
          (
            viewportHeight -
            cssHeight
          ) / 2,
        )

      canvas.style.setProperty(
        'left',
        `${left}px`,
        'important',
      )

      canvas.style.setProperty(
        'top',
        `${top}px`,
        'important',
      )

      canvas.style.setProperty(
        'width',
        `${cssWidth}px`,
        'important',
      )

      canvas.style.setProperty(
        'height',
        `${cssHeight}px`,
        'important',
      )

      if (
        !state.renderer ||
        !state.XR8 ||
        state.resizeLock
      ) {
        return
      }

      /*
       * CSS 크기뿐 아니라 실제 WebGL canvas 크기도
       * 같은 비율로 조정합니다.
       */
      const dpr =
        Math.min(
          window.devicePixelRatio ||
          1,

          1.5,
        )

      const targetWidth =
        Math.max(
          1,
          Math.round(
            cssWidth *
            dpr,
          ),
        )

      const targetHeight =
        Math.max(
          1,
          Math.round(
            cssHeight *
            dpr,
          ),
        )

      if (
        Math.abs(
          canvas.width -
          targetWidth,
        ) <= 2 &&
        Math.abs(
          canvas.height -
          targetHeight,
        ) <= 2
      ) {
        return
      }

      state.resizeLock = true

      try {
        state.renderer.setPixelRatio(
          dpr,
        )

        state.renderer.setSize(
          cssWidth,
          cssHeight,
          false,
        )

        /*
         * 변경된 canvas 크기를 XR8 카메라 투영에 전달합니다.
         */
        state.XR8
          .XrController
          .updateCameraProjectionMatrix({
            cam: {
              pixelRectWidth:
                canvas.width,

              pixelRectHeight:
                canvas.height,

              nearClipPlane:
                0.01,

              farClipPlane:
                1000,
            },
          })
      } catch (error) {
        console.warn(
          'Camera layout warning:',
          error,
        )
      } finally {
        requestAnimationFrame(() => {
          state.resizeLock = false
        })
      }
    }

    function scheduleCameraLayout(
      delay = 0,
    ) {
      window.clearTimeout(
        state.layoutTimer,
      )

      state.layoutTimer =
        window.setTimeout(
          applyCameraLayout,
          delay,
        )
    }

    /*
     * -------------------------------------------------------
     * UI
     * -------------------------------------------------------
     */

    function setStatus(message) {
      statusElement.textContent =
        message
    }

    function showError(message) {
      errorMessage.textContent =
        message

      errorPanel.classList.add(
        'visible',
      )

      enforceLayerOrder()
    }

    function hideError() {
      errorPanel.classList.remove(
        'visible',
      )
    }

    function enableImageInput(
      enabled,
    ) {
      imageInput.disabled =
        !enabled

      fileButton.classList.toggle(
        'disabled',
        !enabled,
      )
    }

    function updateReticle() {
      const ready =
        Boolean(
          state.wallCandidate
            ?.ready,
        )

      const searching =
        !ready &&
        state.trackingStatus ===
          'NORMAL'

      reticleElement
        .classList
        .toggle(
          'ready',
          ready,
        )

      reticleElement
        .classList
        .toggle(
          'searching',
          searching,
        )

      placeButton.disabled =
        !ready ||
        !state.artwork
    }

    function updateDebug(
      extra = {},
    ) {
      const lines = [
        'UI: READY',

        `XR8: ${
          window.XR8
            ? 'READY'
            : 'WAIT'
        }`,

        `camera: ${
          state.cameraStatus
        }`,

        `fit: ${
          state.cameraFit
        }`,

        `video: ${
          state.videoWidth || '-'
        }x${
          state.videoHeight || '-'
        }`,

        `canvas: ${
          canvas.width
        }x${
          canvas.height
        }`,

        `tracking: ${
          state.trackingStatus
        }`,

        `wall: ${
          state.wallCandidate
            ?.ready
            ? 'READY'
            : 'SEARCHING'
        }`,

        `reason: ${
          state.wallSearchReason
        }`,

        `samples: ${
          state.wallSamples.length
        }`,
      ]

      for (
        const [key, value]
        of Object.entries(extra)
      ) {
        lines.push(
          `${key}: ${value}`,
        )
      }

      debugElement.textContent =
        lines.join('\n')
    }

    /*
     * -------------------------------------------------------
     * XR8 엔진 로딩
     * -------------------------------------------------------
     */

    function loadXR8Engine() {
      return new Promise(
        (resolve, reject) => {
          if (window.XR8) {
            resolve(window.XR8)
            return
          }

          let completed = false
          let pollingId = null

          const timeoutId =
            window.setTimeout(
              () => {
                finishError(
                  new Error(
                    'XR8 초기화 시간이 초과되었습니다.',
                  ),
                )
              },
              30000,
            )

          function cleanup() {
            window.clearTimeout(
              timeoutId,
            )

            if (
              pollingId !== null
            ) {
              window.clearInterval(
                pollingId,
              )
            }

            window.removeEventListener(
              'xrloaded',
              finishSuccess,
            )
          }

          function finishSuccess() {
            if (
              completed ||
              !window.XR8
            ) {
              return
            }

            completed = true

            cleanup()

            resolve(window.XR8)
          }

          function finishError(
            error,
          ) {
            if (completed) {
              return
            }

            completed = true

            cleanup()

            reject(error)
          }

          window.addEventListener(
            'xrloaded',
            finishSuccess,
          )

          pollingId =
            window.setInterval(
              finishSuccess,
              100,
            )

          const existingScript =
            document.querySelector(
              'script[data-xr8-engine="true"]',
            )

          if (existingScript) {
            finishSuccess()
            return
          }

          const script =
            document.createElement(
              'script',
            )

          script.src =
            XR8_ENGINE_URL

          script.async =
            true

          script.crossOrigin =
            'anonymous'

          script.dataset
            .xr8Engine =
            'true'

          script.setAttribute(
            'data-preload-chunks',
            'slam',
          )

          script.addEventListener(
            'load',
            finishSuccess,
            {
              once: true,
            },
          )

          script.addEventListener(
            'error',
            () => {
              finishError(
                new Error(
                  '8th Wall XR 엔진 파일을 불러오지 못했습니다.',
                ),
              )
            },
            {
              once: true,
            },
          )

          document.head
            .appendChild(
              script,
            )
        },
      )
    }

    /*
     * -------------------------------------------------------
     * 이미지 처리
     * -------------------------------------------------------
     */

    function disposeMaterial(
      material,
    ) {
      if (!material) {
        return
      }

      if (
        Array.isArray(material)
      ) {
        for (
          const item
          of material
        ) {
          item.dispose()
        }
      } else {
        material.dispose()
      }
    }

    function disposeArtwork() {
      if (state.artwork) {
        state.artwork
          .removeFromParent()

        state.artwork
          .geometry
          ?.dispose()

        disposeMaterial(
          state.artwork
            .material,
        )

        state.artwork = null
      }

      if (
        state.artworkTexture
      ) {
        state.artworkTexture
          .dispose()

        state.artworkTexture =
          null
      }

      updateReticle()
    }

    async function createResizedCanvas(
      file,
    ) {
      const bitmap =
        await createImageBitmap(
          file,
        )

      try {
        const maxTextureSize =
          2048

        const ratio =
          Math.min(
            1,

            maxTextureSize /
            Math.max(
              bitmap.width,
              bitmap.height,
            ),
          )

        const width =
          Math.max(
            1,

            Math.round(
              bitmap.width *
              ratio,
            ),
          )

        const height =
          Math.max(
            1,

            Math.round(
              bitmap.height *
              ratio,
            ),
          )

        const output =
          document.createElement(
            'canvas',
          )

        output.width =
          width

        output.height =
          height

        const context =
          output.getContext(
            '2d',
            {
              alpha: true,
            },
          )

        if (!context) {
          throw new Error(
            '이미지 처리용 Canvas를 만들 수 없습니다.',
          )
        }

        context.drawImage(
          bitmap,
          0,
          0,
          width,
          height,
        )

        return output
      } finally {
        bitmap.close()
      }
    }

    async function loadArtwork(
      file,
    ) {
      if (!state.scene) {
        throw new Error(
          'AR 공간이 아직 준비되지 않았습니다.',
        )
      }

      if (
        !file.type.startsWith(
          'image/',
        )
      ) {
        throw new Error(
          '이미지 파일만 선택할 수 있습니다.',
        )
      }

      disposeArtwork()

      setStatus(
        '이미지를 처리하는 중입니다.',
      )

      const imageCanvas =
        await createResizedCanvas(
          file,
        )

      const texture =
        new THREE.CanvasTexture(
          imageCanvas,
        )

      texture.colorSpace =
        THREE.SRGBColorSpace

      texture.needsUpdate =
        true

      if (state.renderer) {
        texture.anisotropy =
          Math.min(
            8,

            state.renderer
              .capabilities
              .getMaxAnisotropy(),
          )
      }

      /*
       * 이미지 기본 실제 가로 크기 60cm
       */
      const widthMeters =
        0.6

      const heightMeters =
        widthMeters *
        imageCanvas.height /
        imageCanvas.width

      const geometry =
        new THREE.PlaneGeometry(
          widthMeters,
          heightMeters,
        )

      const material =
        new THREE.MeshBasicMaterial({
          map:
            texture,

          transparent:
            true,

          side:
            THREE.DoubleSide,

          toneMapped:
            false,

          depthTest:
            true,

          depthWrite:
            true,
        })

      const artwork =
        new THREE.Mesh(
          geometry,
          material,
        )

      artwork.name =
        'wall-artwork'

      artwork.visible =
        false

      artwork.renderOrder =
        10

      state.scene.add(
        artwork,
      )

      state.artwork =
        artwork

      state.artworkTexture =
        texture

      updateReticle()

      setStatus(
        state.wallCandidate
          ?.ready
          ? '벽이 감지되었습니다. 배치 버튼을 누르세요.'
          : '벽을 향해 천천히 좌우로 움직여 주세요.',
      )
    }

    /*
     * -------------------------------------------------------
     * 특징점 수집
     * -------------------------------------------------------
     */

    function isFiniteVector(
      position,
    ) {
      return (
        position &&
        Number.isFinite(
          position.x,
        ) &&
        Number.isFinite(
          position.y,
        ) &&
        Number.isFinite(
          position.z,
        )
      )
    }

    function typeWeight(type) {
      if (
        type ===
        'DETECTED_SURFACE'
      ) {
        return 3
      }

      if (
        type ===
        'ESTIMATED_SURFACE'
      ) {
        return 2
      }

      if (
        type ===
        'FEATURE_POINT'
      ) {
        return 1.25
      }

      return 0
    }

    function pickBestHit(hits) {
      if (
        !Array.isArray(hits)
      ) {
        return null
      }

      const valid =
        hits.filter(hit => {
          const weight =
            typeWeight(
              hit.type,
            )

          const validDistance =
            !Number.isFinite(
              hit.distance,
            ) ||
            (
              hit.distance >=
                0.2 &&
              hit.distance <=
                8
            )

          return (
            weight > 0 &&
            isFiniteVector(
              hit.position,
            ) &&
            validDistance
          )
        })

      valid.sort(
        (a, b) =>
          typeWeight(b.type) -
          typeWeight(a.type),
      )

      return valid[0] || null
    }

    function addWallSample(
      position,
      source,
      weight,
      timestamp,
    ) {
      if (
        !isFiniteVector(
          position,
        )
      ) {
        return
      }

      state.wallSamples.push({
        position:
          new THREE.Vector3(
            position.x,
            position.y,
            position.z,
          ),

        source,
        weight,
        timestamp,
      })
    }

    function collectHitTestSamples(
      XR8,
      timestamp,
    ) {
      for (
        const [x, y]
        of WALL_SAMPLE_POINTS
      ) {
        try {
          const results =
            XR8.XrController
              .hitTest(
                x,
                y,
              ) || []

          const hit =
            pickBestHit(
              results,
            )

          if (hit) {
            addWallSample(
              hit.position,
              hit.type,
              typeWeight(
                hit.type,
              ),
              timestamp,
            )
          }
        } catch (error) {
          console.warn(
            'hitTest warning:',
            error,
          )
        }
      }
    }

    /*
     * 화면 중앙 주변에 실제로 투영되는 worldPoints도
     * 벽 후보에 추가합니다.
     */
    function collectVisibleWorldPoints(
      worldPoints,
      timestamp,
    ) {
      if (
        !state.camera ||
        !Array.isArray(
          worldPoints,
        ) ||
        !worldPoints.length
      ) {
        return
      }

      state.camera
        .updateMatrixWorld(
          true,
        )

      const cameraPosition =
        new THREE.Vector3()

      state.camera
        .getWorldPosition(
          cameraPosition,
        )

      const candidates = []

      for (
        const point
        of worldPoints
      ) {
        if (
          !isFiniteVector(
            point.position,
          )
        ) {
          continue
        }

        const world =
          new THREE.Vector3(
            point.position.x,
            point.position.y,
            point.position.z,
          )

        const distance =
          cameraPosition
            .distanceTo(
              world,
            )

        if (
          distance < 0.2 ||
          distance > 8
        ) {
          continue
        }

        const ndc =
          world
            .clone()
            .project(
              state.camera,
            )

        if (
          ndc.z < -1 ||
          ndc.z > 1
        ) {
          continue
        }

        /*
         * 화면 중앙 약 84% 영역만 사용
         */
        if (
          Math.abs(ndc.x) >
            0.42 ||
          Math.abs(ndc.y) >
            0.42
        ) {
          continue
        }

        candidates.push({
          point,

          score:
            Number.isFinite(
              point.confidence,
            )
              ? point.confidence
              : 0.5,
        })
      }

      candidates.sort(
        (a, b) =>
          b.score -
          a.score,
      )

      for (
        const candidate
        of candidates.slice(
          0,
          45,
        )
      ) {
        addWallSample(
          candidate.point
            .position,

          'WORLD_POINT',

          THREE.MathUtils.clamp(
            candidate.score,
            0.35,
            1,
          ),

          timestamp,
        )
      }
    }

    /*
     * 일정 시간이 지난 점을 제거하고
     * 2.5cm 단위로 중복 제거
     */
    function pruneAndDeduplicateSamples(
      timestamp,
    ) {
      const cutoff =
        timestamp -
        DETECTION
          .historyDurationMs

      state.wallSamples =
        state.wallSamples
          .filter(
            sample =>
              sample.timestamp >=
              cutoff,
          )

      const map =
        new Map()

      const cellSize =
        0.025

      for (
        const sample
        of state.wallSamples
      ) {
        const key = [
          Math.round(
            sample.position.x /
            cellSize,
          ),

          Math.round(
            sample.position.y /
            cellSize,
          ),

          Math.round(
            sample.position.z /
            cellSize,
          ),
        ].join(':')

        const current =
          map.get(key)

        if (
          !current ||
          sample.weight >
            current.weight ||
          sample.timestamp >
            current.timestamp
        ) {
          map.set(
            key,
            sample,
          )
        }
      }

      state.wallSamples =
        [...map.values()]
          .sort(
            (a, b) =>
              b.timestamp -
              a.timestamp,
          )
          .slice(
            0,
            DETECTION
              .maxHistoryPoints,
          )
    }

    /*
     * -------------------------------------------------------
     * 수학 유틸리티
     * -------------------------------------------------------
     */

    function median(values) {
      if (!values.length) {
        return 0
      }

      const sorted =
        [...values].sort(
          (a, b) =>
            a - b,
        )

      const middle =
        Math.floor(
          sorted.length / 2,
        )

      return (
        sorted.length % 2
      )
        ? sorted[middle]
        : (
            sorted[middle - 1] +
            sorted[middle]
          ) / 2
    }

    function randomDistinctIndices(
      length,
    ) {
      const a =
        Math.floor(
          Math.random() *
          length,
        )

      let b =
        Math.floor(
          Math.random() *
          length,
        )

      let c =
        Math.floor(
          Math.random() *
          length,
        )

      while (b === a) {
        b =
          Math.floor(
            Math.random() *
            length,
          )
      }

      while (
        c === a ||
        c === b
      ) {
        c =
          Math.floor(
            Math.random() *
            length,
          )
      }

      return [a, b, c]
    }

    /*
     * 대칭 3×3 행렬의 가장 작은 고유값에 대응하는
     * 고유벡터를 Jacobi 회전으로 계산합니다.
     */
    function smallestEigenvectorSymmetric3(
      matrix,
    ) {
      const a =
        matrix.map(
          row => [...row],
        )

      const v = [
        [1, 0, 0],
        [0, 1, 0],
        [0, 0, 1],
      ]

      for (
        let iteration = 0;
        iteration < 24;
        iteration += 1
      ) {
        let p = 0
        let q = 1

        let maximum =
          Math.abs(
            a[0][1],
          )

        for (
          const [i, j]
          of [
            [0, 2],
            [1, 2],
          ]
        ) {
          const value =
            Math.abs(
              a[i][j],
            )

          if (
            value > maximum
          ) {
            maximum = value
            p = i
            q = j
          }
        }

        if (
          maximum < 1e-10
        ) {
          break
        }

        const angle =
          0.5 *
          Math.atan2(
            2 * a[p][q],
            a[q][q] -
            a[p][p],
          )

        const cosine =
          Math.cos(angle)

        const sine =
          Math.sin(angle)

        const app =
          a[p][p]

        const aqq =
          a[q][q]

        const apq =
          a[p][q]

        a[p][p] =
          cosine *
          cosine *
          app -
          2 *
          sine *
          cosine *
          apq +
          sine *
          sine *
          aqq

        a[q][q] =
          sine *
          sine *
          app +
          2 *
          sine *
          cosine *
          apq +
          cosine *
          cosine *
          aqq

        a[p][q] = 0
        a[q][p] = 0

        for (
          let k = 0;
          k < 3;
          k += 1
        ) {
          if (
            k === p ||
            k === q
          ) {
            continue
          }

          const akp =
            a[k][p]

          const akq =
            a[k][q]

          a[k][p] =
            cosine *
            akp -
            sine *
            akq

          a[p][k] =
            a[k][p]

          a[k][q] =
            sine *
            akp +
            cosine *
            akq

          a[q][k] =
            a[k][q]
        }

        for (
          let k = 0;
          k < 3;
          k += 1
        ) {
          const vkp =
            v[k][p]

          const vkq =
            v[k][q]

          v[k][p] =
            cosine *
            vkp -
            sine *
            vkq

          v[k][q] =
            sine *
            vkp +
            cosine *
            vkq
        }
      }

      const eigenvalues = [
        a[0][0],
        a[1][1],
        a[2][2],
      ]

      const index =
        eigenvalues.indexOf(
          Math.min(
            ...eigenvalues,
          ),
        )

      return new THREE.Vector3(
        v[0][index],
        v[1][index],
        v[2][index],
      ).normalize()
    }

    /*
     * RANSAC에서 선택한 inlier를 PCA로 재정제
     */
    function refinePlane(
      inliers,
    ) {
      const centroid =
        new THREE.Vector3()

      let totalWeight = 0

      for (
        const sample
        of inliers
      ) {
        centroid
          .addScaledVector(
            sample.position,
            sample.weight,
          )

        totalWeight +=
          sample.weight
      }

      centroid.multiplyScalar(
        1 /
        Math.max(
          totalWeight,
          1e-6,
        ),
      )

      let xx = 0
      let xy = 0
      let xz = 0
      let yy = 0
      let yz = 0
      let zz = 0

      for (
        const sample
        of inliers
      ) {
        const delta =
          sample.position
            .clone()
            .sub(
              centroid,
            )

        const weight =
          sample.weight

        xx +=
          weight *
          delta.x *
          delta.x

        xy +=
          weight *
          delta.x *
          delta.y

        xz +=
          weight *
          delta.x *
          delta.z

        yy +=
          weight *
          delta.y *
          delta.y

        yz +=
          weight *
          delta.y *
          delta.z

        zz +=
          weight *
          delta.z *
          delta.z
      }

      const normal =
        smallestEigenvectorSymmetric3([
          [xx, xy, xz],
          [xy, yy, yz],
          [xz, yz, zz],
        ])

      return {
        centroid,
        normal,
      }
    }

    function createWallQuaternion(
      inputNormal,
    ) {
      const normal =
        inputNormal
          .clone()
          .normalize()

      const right =
        new THREE.Vector3()
          .crossVectors(
            WORLD_UP,
            normal,
          )

      if (
        right.lengthSq() <
        1e-8
      ) {
        return null
      }

      right.normalize()

      const wallUp =
        new THREE.Vector3()
          .crossVectors(
            normal,
            right,
          )
          .normalize()

      const matrix =
        new THREE.Matrix4()
          .makeBasis(
            right,
            wallUp,
            normal,
          )

      return new THREE.Quaternion()
        .setFromRotationMatrix(
          matrix,
        )
    }

    /*
     * -------------------------------------------------------
     * RANSAC 수직 평면 추정
     * -------------------------------------------------------
     */

    function estimateWallPlane(
      samples,
    ) {
      if (
        !state.camera ||
        samples.length <
          DETECTION.minimumPoints
      ) {
        return {
          candidate: null,

          reason:
            `점 부족 ${
              samples.length
            }/${
              DETECTION
                .minimumPoints
            }`,
        }
      }

      state.camera
        .updateMatrixWorld(
          true,
        )

      const cameraPosition =
        new THREE.Vector3()

      state.camera
        .getWorldPosition(
          cameraPosition,
        )

      const distances =
        samples.map(
          sample =>
            cameraPosition
              .distanceTo(
                sample.position,
              ),
        )

      /*
       * 거리가 멀수록 평면 오차 허용값을 조금 증가
       */
      const threshold =
        THREE.MathUtils.clamp(
          0.022 +
          median(distances) *
          0.014,

          0.03,
          0.075,
        )

      let best = null

      for (
        let iteration = 0;
        iteration <
          DETECTION
            .ransacIterations;
        iteration += 1
      ) {
        const [
          ia,
          ib,
          ic,
        ] =
          randomDistinctIndices(
            samples.length,
          )

        const a =
          samples[ia]
            .position

        const b =
          samples[ib]
            .position

        const c =
          samples[ic]
            .position

        const abX =
          b.x - a.x

        const abY =
          b.y - a.y

        const abZ =
          b.z - a.z

        const acX =
          c.x - a.x

        const acY =
          c.y - a.y

        const acZ =
          c.z - a.z

        const normal =
          new THREE.Vector3(
            abY * acZ -
              abZ * acY,

            abZ * acX -
              abX * acZ,

            abX * acY -
              abY * acX,
          )

        if (
          normal.lengthSq() <
          1e-7
        ) {
          continue
        }

        normal.normalize()

        /*
         * 수직 벽만 후보로 허용
         */
        if (
          Math.abs(
            normal.dot(
              WORLD_UP,
            ),
          ) >
          DETECTION
            .maximumNormalY
        ) {
          continue
        }

        const inliers = []

        let score = 0
        let squaredError = 0

        for (
          const sample
          of samples
        ) {
          const dx =
            sample.position.x -
            a.x

          const dy =
            sample.position.y -
            a.y

          const dz =
            sample.position.z -
            a.z

          const distance =
            Math.abs(
              normal.x * dx +
              normal.y * dy +
              normal.z * dz,
            )

          if (
            distance <=
            threshold
          ) {
            inliers.push(
              sample,
            )

            score +=
              sample.weight

            squaredError +=
              distance *
              distance
          }
        }

        if (
          inliers.length <
          DETECTION
            .minimumInliers
        ) {
          continue
        }

        const rms =
          Math.sqrt(
            squaredError /
            inliers.length,
          )

        const quality =
          score -
          rms * 50

        if (
          !best ||
          quality >
          best.quality
        ) {
          best = {
            inliers,
            quality,
          }
        }
      }

      if (!best) {
        return {
          candidate: null,
          reason:
            '수직 평면 후보 없음',
        }
      }

      const refined =
        refinePlane(
          best.inliers,
        )

      let normal =
        refined.normal

      const centroid =
        refined.centroid

      if (
        Math.abs(
          normal.dot(
            WORLD_UP,
          ),
        ) >
        DETECTION
          .maximumNormalY
      ) {
        return {
          candidate: null,
          reason:
            '바닥/천장 후보',
        }
      }

      /*
       * normal을 카메라 쪽으로 정렬
       */
      if (
        normal.dot(
          cameraPosition
            .clone()
            .sub(
              centroid,
            ),
        ) < 0
      ) {
        normal.negate()
      }

      const finalInliers = []

      let squaredError = 0

      for (
        const sample
        of samples
      ) {
        const dx =
          sample.position.x -
          centroid.x

        const dy =
          sample.position.y -
          centroid.y

        const dz =
          sample.position.z -
          centroid.z

        const distance =
          Math.abs(
            normal.x * dx +
            normal.y * dy +
            normal.z * dz,
          )

        if (
          distance <=
          threshold
        ) {
          finalInliers.push(
            sample,
          )

          squaredError +=
            distance *
            distance
        }
      }

      if (
        finalInliers.length <
        DETECTION
          .minimumInliers
      ) {
        return {
          candidate: null,
          reason:
            '평면 일치점 부족',
        }
      }

      const right =
        new THREE.Vector3()
          .crossVectors(
            WORLD_UP,
            normal,
          )
          .normalize()

      const wallUp =
        new THREE.Vector3()
          .crossVectors(
            normal,
            right,
          )
          .normalize()

      let minX = Infinity
      let maxX = -Infinity
      let minY = Infinity
      let maxY = -Infinity

      for (
        const sample
        of finalInliers
      ) {
        const delta =
          sample.position
            .clone()
            .sub(
              centroid,
            )

        const x =
          delta.dot(
            right,
          )

        const y =
          delta.dot(
            wallUp,
          )

        minX =
          Math.min(
            minX,
            x,
          )

        maxX =
          Math.max(
            maxX,
            x,
          )

        minY =
          Math.min(
            minY,
            y,
          )

        maxY =
          Math.max(
            maxY,
            y,
          )
      }

      const extentWidth =
        maxX - minX

      const extentHeight =
        maxY - minY

      if (
        extentWidth <
          DETECTION
            .minimumExtentMeters ||
        extentHeight <
          DETECTION
            .minimumExtentMeters
      ) {
        return {
          candidate: null,

          reason:
            `범위 부족 ${
              extentWidth.toFixed(2)
            }×${
              extentHeight.toFixed(2)
            }m`,
        }
      }

      const wallPlane =
        new THREE.Plane()
          .setFromNormalAndCoplanarPoint(
            normal,
            centroid,
          )

      const raycaster =
        new THREE.Raycaster()

      raycaster.setFromCamera(
        CENTER_NDC,
        state.camera,
      )

      const position =
        raycaster.ray
          .intersectPlane(
            wallPlane,
            new THREE.Vector3(),
          )

      if (!position) {
        return {
          candidate: null,
          reason:
            '중앙선 교차 실패',
        }
      }

      const distance =
        cameraPosition
          .distanceTo(
            position,
          )

      if (
        distance < 0.25 ||
        distance > 8
      ) {
        return {
          candidate: null,
          reason:
            '거리 범위 밖',
        }
      }

      const quaternion =
        createWallQuaternion(
          normal,
        )

      if (!quaternion) {
        return {
          candidate: null,
          reason:
            '벽 회전 계산 실패',
        }
      }

      const rmsError =
        Math.sqrt(
          squaredError /
          finalInliers.length,
        )

      const inlierRatio =
        finalInliers.length /
        samples.length

      const extentScore =
        THREE.MathUtils.clamp(
          (
            extentWidth +
            extentHeight
          ) / 1.2,

          0,
          1,
        )

      const residualScore =
        1 -
        THREE.MathUtils
          .smoothstep(
            rmsError,
            0.015,
            0.07,
          )

      const confidence =
        THREE.MathUtils.clamp(
          inlierRatio *
            0.35 +
          residualScore *
            0.35 +
          extentScore *
            0.3,

          0,
          1,
        )

      return {
        candidate: {
          position,
          normal,
          quaternion,

          distance,
          rmsError,

          inlierCount:
            finalInliers.length,

          totalCount:
            samples.length,

          extentWidth,
          extentHeight,

          confidence,

          ready:
            false,
        },

        reason:
          '후보 계산됨',
      }
    }

    /*
     * -------------------------------------------------------
     * 시간 안정화
     * -------------------------------------------------------
     */

    function updateWallCandidate(
      result,
      timestamp,
    ) {
      const candidate =
        result.candidate

      state.wallSearchReason =
        result.reason

      if (!candidate) {
        if (
          timestamp -
          state.wallCandidateLastSeen >
          900
        ) {
          state.wallCandidate =
            null

          state.rawWallCandidate =
            null

          state.wallStableFrames =
            0
        }

        updateReticle()

        return
      }

      state.wallCandidateLastSeen =
        timestamp

      if (
        state.rawWallCandidate
      ) {
        const normalDot =
          THREE.MathUtils.clamp(
            state.rawWallCandidate
              .normal
              .dot(
                candidate.normal,
              ),

            -1,
            1,
          )

        const angleDegrees =
          THREE.MathUtils.radToDeg(
            Math.acos(
              normalDot,
            ),
          )

        const positionDelta =
          state.rawWallCandidate
            .position
            .distanceTo(
              candidate.position,
            )

        if (
          angleDegrees < 12 &&
          positionDelta < 0.22
        ) {
          state.wallStableFrames +=
            1
        } else {
          state.wallStableFrames =
            1
        }
      } else {
        state.wallStableFrames =
          1
      }

      state.rawWallCandidate =
        candidate

      if (!state.wallCandidate) {
        state.wallCandidate =
          candidate
      } else {
        state.wallCandidate
          .position
          .lerp(
            candidate.position,
            0.28,
          )

        state.wallCandidate
          .normal
          .lerp(
            candidate.normal,
            0.22,
          )
          .normalize()

        const quaternion =
          createWallQuaternion(
            state.wallCandidate
              .normal,
          )

        if (quaternion) {
          state.wallCandidate
            .quaternion
            .slerp(
              quaternion,
              0.3,
            )
        }

        Object.assign(
          state.wallCandidate,
          {
            distance:
              candidate.distance,

            rmsError:
              candidate.rmsError,

            inlierCount:
              candidate.inlierCount,

            totalCount:
              candidate.totalCount,

            extentWidth:
              candidate.extentWidth,

            extentHeight:
              candidate.extentHeight,

            confidence:
              candidate.confidence,
          },
        )
      }

      state.wallCandidate.ready =
        (
          state.wallStableFrames >=
          DETECTION
            .readyStableFrames
        ) &&
        (
          state.wallCandidate
            .confidence >=
          0.38
        )

      state.wallSearchReason =
        state.wallCandidate.ready
          ? '벽 고정 가능'
          : `안정화 ${
              state.wallStableFrames
            }/${
              DETECTION
                .readyStableFrames
            }`

      updateReticle()
    }

    function scanWall(
      XR8,
      worldPoints,
      timestamp,
    ) {
      if (
        state.trackingStatus !==
        'NORMAL'
      ) {
        state.wallSearchReason =
          '추적 복구 중'

        state.wallCandidate =
          null

        state.wallStableFrames =
          0

        updateReticle()

        setStatus(
          '공간 추적을 복구하는 중입니다.',
        )

        return
      }

      collectHitTestSamples(
        XR8,
        timestamp,
      )

      collectVisibleWorldPoints(
        worldPoints,
        timestamp,
      )

      pruneAndDeduplicateSamples(
        timestamp,
      )

      const result =
        estimateWallPlane(
          state.wallSamples,
        )

      updateWallCandidate(
        result,
        timestamp,
      )

      if (
        state.wallCandidate
          ?.ready
      ) {
        setStatus(
          `벽 감지됨 · 약 ${
            state.wallCandidate
              .distance
              .toFixed(2)
          }m`,
        )
      } else if (
        state.wallSamples.length <
        DETECTION.minimumPoints
      ) {
        setStatus(
          '벽의 무늬나 모서리를 비추며 천천히 좌우로 움직여 주세요.',
        )
      } else {
        setStatus(
          `벽을 분석하는 중입니다 · ${
            state.wallSearchReason
          }`,
        )
      }
    }

    /*
     * -------------------------------------------------------
     * 이미지 배치 및 초기화
     * -------------------------------------------------------
     */

    function placeArtwork() {
      const candidate =
        state.wallCandidate

      if (
        !candidate?.ready
      ) {
        setStatus(
          '먼저 안정적인 벽을 인식해 주세요.',
        )

        return
      }

      if (!state.artwork) {
        setStatus(
          '먼저 배치할 이미지를 선택해 주세요.',
        )

        return
      }

      state.artwork
        .position
        .copy(
          candidate.position,
        )

      /*
       * z-fighting 방지를 위해 벽에서 6mm 띄움
       */
      state.artwork
        .position
        .addScaledVector(
          candidate.normal,
          0.006,
        )

      state.artwork
        .quaternion
        .copy(
          candidate.quaternion,
        )

      state.artwork.visible =
        true

      setStatus(
        `이미지를 약 ${
          candidate.distance
            .toFixed(2)
        }m 거리의 벽에 배치했습니다.`,
      )
    }

    function clearWallDetection() {
      state.wallSamples = []

      state.wallCandidate =
        null

      state.rawWallCandidate =
        null

      state.wallStableFrames =
        0

      state.wallCandidateLastSeen =
        0

      state.wallSearchReason =
        '재인식 대기'

      updateReticle()
    }

    function recenterTracking() {
      clearWallDetection()

      try {
        state.XR8
          ?.XrController
          ?.recenter()

        setStatus(
          '추적을 초기화했습니다. 특징이 있는 벽을 천천히 비춰 주세요.',
        )
      } catch (error) {
        console.warn(
          'recenter warning:',
          error,
        )

        setStatus(
          '벽 후보를 초기화했습니다. 다시 스캔해 주세요.',
        )
      }
    }

    function resetPlacement() {
      if (state.artwork) {
        state.artwork.visible =
          false
      }

      clearWallDetection()

      setStatus(
        '벽을 향해 천천히 좌우로 움직여 주세요.',
      )
    }

    /*
     * -------------------------------------------------------
     * XR8 파이프라인
     * -------------------------------------------------------
     */

    function createApplicationPipelineModule(
      XR8,
    ) {
      return {
        name:
          'wall-art-single-html',

        onCameraStatusChange({
          status,
        }) {
          state.cameraStatus =
            status ||
            'UNKNOWN'

          if (
            status ===
            'requesting'
          ) {
            setStatus(
              '카메라 권한을 요청하는 중입니다.',
            )
          }

          if (
            status ===
            'hasStream'
          ) {
            setStatus(
              '카메라를 시작하는 중입니다.',
            )
          }

          if (
            status ===
            'hasVideo'
          ) {
            setStatus(
              '공간 인식을 시작합니다.',
            )
          }

          if (
            status ===
            'failed'
          ) {
            showError(
              '카메라를 시작하지 못했습니다.\n' +
              '브라우저 카메라 권한을 확인해 주세요.',
            )
          }
        },

        onStart() {
          const {
            scene,
            camera,
            renderer,
          } =
            XR8.Threejs.xrScene()

          state.scene =
            scene

          state.camera =
            camera

          state.renderer =
            renderer

          enableImageInput(
            true,
          )

          scheduleCameraLayout(
            0,
          )

          setStatus(
            '벽의 무늬나 모서리를 비추며 천천히 좌우로 움직여 주세요.',
          )
        },

        onAttach({
          videoWidth,
          videoHeight,
          orientation,
        }) {
          state.videoWidth =
            videoWidth ||
            state.videoWidth

          state.videoHeight =
            videoHeight ||
            state.videoHeight

          state.orientation =
            orientation ??
            state.orientation

          scheduleCameraLayout(
            0,
          )
        },

        onVideoSizeChange({
          videoWidth,
          videoHeight,
          orientation,
        }) {
          state.videoWidth =
            videoWidth ||
            state.videoWidth

          state.videoHeight =
            videoHeight ||
            state.videoHeight

          state.orientation =
            orientation ??
            state.orientation

          scheduleCameraLayout(
            20,
          )
        },

        onCanvasSizeChange() {
          if (
            !state.resizeLock
          ) {
            scheduleCameraLayout(
              20,
            )
          }
        },

        onDeviceOrientationChange({
          orientation,
        }) {
          state.orientation =
            orientation ??
            state.orientation

          scheduleCameraLayout(
            120,
          )
        },

        onUpdate({
          processCpuResult,
          processGpuResult,
        }) {
          const reality =
            processCpuResult
              ?.reality

          if (!reality) {
            return
          }

          state.trackingStatus =
            reality
              .trackingStatus ||
            'UNKNOWN'

          state.trackingReason =
            reality
              .trackingReason ||
            null

          const now =
            performance.now()

          if (
            now -
            state.sampleTimer >=
            DETECTION
              .sampleIntervalMs
          ) {
            state.sampleTimer =
              now

            scanWall(
              XR8,

              reality.worldPoints ||
                [],

              now,
            )
          }

          if (
            now -
            state.debugTimer >=
            300
          ) {
            state.debugTimer =
              now

            updateDebug({
              worldPoints:
                reality.worldPoints
                  ?.length || 0,

              inliers:
                state.wallCandidate
                  ? `${
                      state.wallCandidate
                        .inlierCount
                    }/${
                      state.wallCandidate
                        .totalCount
                    }`
                  : '-',

              planeError:
                state.wallCandidate
                  ? `${
                      (
                        state.wallCandidate
                          .rmsError *
                        100
                      ).toFixed(1)
                    }cm`
                  : '-',

              extent:
                state.wallCandidate
                  ? `${
                      state.wallCandidate
                        .extentWidth
                        .toFixed(2)
                    }×${
                      state.wallCandidate
                        .extentHeight
                        .toFixed(2)
                    }m`
                  : '-',

              confidence:
                state.wallCandidate
                  ? state.wallCandidate
                      .confidence
                      .toFixed(2)
                  : '-',

              gpu:
                processGpuResult
                  ? 'READY'
                  : 'WAIT',
            })
          }
        },

        onPaused() {
          clearWallDetection()

          setStatus(
            '카메라가 일시 중지되었습니다.',
          )
        },

        onResume() {
          clearWallDetection()

          scheduleCameraLayout(
            100,
          )

          setStatus(
            '공간 추적을 복구하는 중입니다.',
          )
        },

        onException(error) {
          console.error(
            'XR pipeline error:',
            error,
          )

          showError(
            'AR 실행 중 오류가 발생했습니다.\n' +
            '페이지를 새로고침하고 카메라 권한을 확인해 주세요.',
          )
        },
      }
    }

    function startXR(XR8) {
      if (state.xrStarted) {
        return
      }

      state.xrStarted =
        true

      state.XR8 =
        XR8

      XR8.XrController.configure({
        disableWorldTracking:
          false,

        enableWorldPoints:
          true,

        enableLighting:
          true,

        scale:
          'absolute',
      })

      XR8.addCameraPipelineModules([
        XR8.GlTextureRenderer
          .pipelineModule(),

        XR8.Threejs
          .pipelineModule(),

        XR8.XrController
          .pipelineModule(),

        createApplicationPipelineModule(
          XR8,
        ),
      ])

      XR8.run({
        canvas,

        allowedDevices:
          XR8.XrConfig
            .device()
            .ANY,
      })
    }

    /*
     * -------------------------------------------------------
     * 이벤트
     * -------------------------------------------------------
     */

    imageInput.addEventListener(
      'change',
      async event => {
        const file =
          event.target
            .files?.[0]

        if (!file) {
          return
        }

        try {
          await loadArtwork(
            file,
          )
        } catch (error) {
          console.error(
            error,
          )

          setStatus(
            error instanceof Error
              ? error.message
              : '이미지를 불러오지 못했습니다.',
          )
        } finally {
          event.target.value =
            ''
        }
      },
    )

    placeButton.addEventListener(
      'click',
      event => {
        event.preventDefault()
        event.stopPropagation()

        placeArtwork()
      },
    )

    recenterButton.addEventListener(
      'click',
      event => {
        event.preventDefault()
        event.stopPropagation()

        recenterTracking()
      },
    )

    fitButton.addEventListener(
      'click',
      event => {
        event.preventDefault()
        event.stopPropagation()

        state.cameraFit =
          state.cameraFit ===
          'contain'
            ? 'cover'
            : 'contain'

        fitButton.textContent =
          state.cameraFit ===
          'contain'
            ? '화면 채우기'
            : '원본 비율'

        scheduleCameraLayout(
          0,
        )
      },
    )

    resetButton.addEventListener(
      'click',
      event => {
        event.preventDefault()
        event.stopPropagation()

        resetPlacement()
      },
    )

    reloadButton.addEventListener(
      'click',
      () => {
        window.location.reload()
      },
    )

    controls.addEventListener(
      'touchstart',
      event => {
        event.stopPropagation()
      },
      {
        passive: true,
      },
    )

    window.addEventListener(
      'resize',
      () => {
        scheduleCameraLayout(
          50,
        )
      },
      {
        passive: true,
      },
    )

    window.addEventListener(
      'orientationchange',
      () => {
        scheduleCameraLayout(
          180,
        )
      },
      {
        passive: true,
      },
    )

    window.visualViewport
      ?.addEventListener(
        'resize',
        () => {
          scheduleCameraLayout(
            50,
          )
        },
        {
          passive: true,
        },
      )

    const bodyObserver =
      new MutationObserver(
        () => {
          requestAnimationFrame(
            enforceLayerOrder,
          )
        },
      )

    bodyObserver.observe(
      document.body,
      {
        childList: true,
      },
    )

    /*
     * -------------------------------------------------------
     * 초기화
     * -------------------------------------------------------
     */

    async function initialize() {
      if (state.xrLoading) {
        return
      }

      state.xrLoading =
        true

      hideError()
      enableImageInput(false)

      enforceLayerOrder()
      updateViewportVariable()
      updateDebug()

      try {
        if (
          !window.isSecureContext
        ) {
          throw new Error(
            '카메라 사용에는 HTTPS 연결이 필요합니다.\n' +
            'GitHub Pages HTTPS 주소에서 실행해 주세요.',
          )
        }

        setStatus(
          'AR 추적 엔진을 불러오는 중입니다.',
        )

        const XR8 =
          await loadXR8Engine()

        setStatus(
          'AR 카메라를 시작하는 중입니다.',
        )

        startXR(XR8)
      } catch (error) {
        console.error(
          'Initialization error:',
          error,
        )

        showError(
          error instanceof Error
            ? error.message
            : 'AR 초기화에 실패했습니다.',
        )
      } finally {
        state.xrLoading =
          false
      }
    }

    initialize()
  </script>
</body>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <meta name="theme-color" content="#000000">
  <title>Wall Art AR</title>

  <style>
    :root {
      --app-height: 100dvh;
      --panel-bg: rgb(18 18 20 / 88%);
      --line: rgb(255 255 255 / 14%);
      --green: #5df39b;
      --yellow: #ffd166;
      --blue: #66b6ff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #000;
    }

    body {
      position: fixed;
      inset: 0;
      height: var(--app-height);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      touch-action: none;
    }

    #camerafeed {
      position: fixed !important;
      inset: 0 !important;
      z-index: 0 !important;
      display: block !important;
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      background: #000 !important;
    }

    #uiRoot {
      position: fixed !important;
      inset: 0 !important;
      z-index: 2147483647 !important;
      width: 100vw !important;
      height: var(--app-height) !important;
      overflow: hidden;
      pointer-events: none;
      isolation: isolate;
    }

    #status {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 50%;
      z-index: 20;
      width: max-content;
      max-width: calc(100vw - 28px);
      padding: 10px 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgb(0 0 0 / 72%);
      color: #fff;
      font-size: 14px;
      font-weight: 650;
      line-height: 1.35;
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
      box-shadow: 0 5px 20px rgb(0 0 0 / 28%);
      backdrop-filter: blur(10px);
      transform: translateX(-50%);
    }

    #reticle {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 15;
      width: 52px;
      height: 52px;
      border: 2px solid rgb(255 255 255 / 90%);
      border-radius: 50%;
      color: #fff;
      box-shadow:
        0 0 0 1px rgb(0 0 0 / 45%),
        0 0 18px rgb(255 255 255 / 16%);
      transform: translate(-50%, -50%);
      transition: 160ms ease;
    }

    #reticle::before,
    #reticle::after {
      position: absolute;
      top: 50%;
      left: 50%;
      background: currentColor;
      content: "";
      transform: translate(-50%, -50%);
    }

    #reticle::before {
      width: 18px;
      height: 1px;
    }

    #reticle::after {
      width: 1px;
      height: 18px;
    }

    #reticle.searching {
      border-color: var(--yellow);
      color: var(--yellow);
    }

    #reticle.ready {
      width: 60px;
      height: 60px;
      border-color: var(--green);
      color: var(--green);
      box-shadow:
        0 0 0 1px rgb(0 0 0 / 45%),
        0 0 26px rgb(93 243 155 / 48%);
    }

    #reticle.placed {
      border-color: var(--blue);
      color: var(--blue);
    }

    #topActions {
      position: absolute;
      top: max(64px, calc(env(safe-area-inset-top) + 58px));
      right: 12px;
      z-index: 25;
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }

    #bottomBar {
      position: absolute;
      right: 10px;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 10px;
      z-index: 30;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      pointer-events: auto;
    }

    button,
    .fileButton {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      padding: 0 15px;
      border: 0;
      border-radius: 999px;
      background: rgb(255 255 255 / 96%);
      color: #111;
      font: inherit;
      font-size: 13px;
      font-weight: 780;
      white-space: nowrap;
      box-shadow: 0 5px 20px rgb(0 0 0 / 32%);
      cursor: pointer;
      user-select: none;
      pointer-events: auto;
    }

    button:active,
    .fileButton:active {
      transform: scale(0.97);
    }

    button:disabled,
    .fileButton.disabled {
      opacity: 0.42;
      cursor: default;
      transform: none;
    }

    #placeButton:not(:disabled) {
      background: var(--green);
    }

    #imageInput {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    #adjustPanel {
      position: absolute;
      right: 10px;
      bottom: calc(max(14px, env(safe-area-inset-bottom)) + 60px);
      left: 10px;
      z-index: 35;
      display: none;
      max-height: min(54vh, 430px);
      overflow-y: auto;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--panel-bg);
      color: #fff;
      box-shadow: 0 12px 36px rgb(0 0 0 / 38%);
      backdrop-filter: blur(14px);
      pointer-events: auto;
    }

    #adjustPanel.visible {
      display: block;
    }

    .panelHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .panelHeader strong {
      font-size: 15px;
    }

    .panelHeader span {
      color: rgb(255 255 255 / 65%);
      font-size: 12px;
    }

    .controlRow {
      display: grid;
      grid-template-columns: 70px 1fr 56px;
      align-items: center;
      gap: 10px;
      min-height: 45px;
    }

    .controlRow label {
      color: rgb(255 255 255 / 85%);
      font-size: 13px;
      font-weight: 650;
    }

    .controlRow output {
      color: #fff;
      font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: right;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--green);
    }

    .panelButtons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .compactButton {
      min-height: 38px;
      padding: 0 12px;
      font-size: 12px;
    }

    #debug {
      position: absolute;
      right: 9px;
      bottom: calc(max(14px, env(safe-area-inset-bottom)) + 66px);
      z-index: 24;
      display: none;
      max-width: 205px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgb(0 0 0 / 70%);
      color: #fff;
      font: 10px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap;
      backdrop-filter: blur(8px);
    }

    #debug.visible {
      display: block;
    }

    #errorPanel {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgb(0 0 0 / 94%);
      color: #fff;
      text-align: center;
      pointer-events: auto;
    }

    #errorPanel.visible {
      display: flex;
    }

    #errorPanelContent {
      width: 100%;
      max-width: 460px;
    }

    #errorTitle {
      margin: 0 0 12px;
      font-size: 22px;
    }

    #errorMessage {
      margin: 0 0 22px;
      color: rgb(255 255 255 / 78%);
      font-size: 15px;
      line-height: 1.65;
      white-space: pre-line;
    }

    @media (max-width: 390px) {
      button,
      .fileButton {
        min-height: 43px;
        padding: 0 11px;
        font-size: 12px;
      }

      .controlRow {
        grid-template-columns: 58px 1fr 50px;
        gap: 7px;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.172.0/build/three.module.min.js"
      }
    }
  </script>
</head>

<body>
  <canvas id="camerafeed"></canvas>

  <div id="uiRoot">
    <div id="status">애플리케이션을 준비하는 중입니다.</div>
    <div id="reticle"></div>

    <div id="topActions">
      <button id="debugButton" class="compactButton" type="button">정보</button>
    </div>

    <div id="debug">UI: READY
XR8: WAIT</div>

    <section id="adjustPanel">
      <div class="panelHeader">
        <strong>액자 위치 조정</strong>
        <span>벽을 보면서 맞추세요</span>
      </div>

      <div class="controlRow">
        <label for="yawRange">좌우 각도</label>
        <input id="yawRange" type="range" min="-60" max="60" step="1" value="0">
        <output id="yawOutput">0°</output>
      </div>

      <div class="controlRow">
        <label for="horizontalRange">가로</label>
        <input id="horizontalRange" type="range" min="-1.2" max="1.2" step="0.01" value="0">
        <output id="horizontalOutput">0.00m</output>
      </div>

      <div class="controlRow">
        <label for="verticalRange">높이</label>
        <input id="verticalRange" type="range" min="-1.2" max="1.2" step="0.01" value="0">
        <output id="verticalOutput">0.00m</output>
      </div>

      <div class="controlRow">
        <label for="depthRange">앞뒤</label>
        <input id="depthRange" type="range" min="-2" max="1" step="0.01" value="0.01">
        <output id="depthOutput">0.01m</output>
      </div>

      <div class="controlRow">
        <label for="scaleRange">크기</label>
        <input id="scaleRange" type="range" min="0.25" max="2.5" step="0.01" value="1">
        <output id="scaleOutput">100%</output>
      </div>

      <div class="panelButtons">
        <button id="resetAdjustButton" class="compactButton" type="button">조정 초기화</button>
        <button id="hideAdjustButton" class="compactButton" type="button">조정 닫기</button>
        <button id="replaceButton" class="compactButton" type="button">다시 배치</button>
      </div>
    </section>

    <div id="bottomBar">
      <label id="fileButton" class="fileButton disabled" for="imageInput">
        이미지 선택
        <input id="imageInput" type="file" accept="image/*" disabled>
      </label>

      <button id="placeButton" type="button" disabled>여기에 배치</button>
      <button id="adjustButton" type="button" hidden>위치 조정</button>
      <button id="resetButton" type="button">전체 초기화</button>
    </div>

    <section id="errorPanel">
      <div id="errorPanelContent">
        <h1 id="errorTitle">AR을 실행할 수 없습니다</h1>
        <p id="errorMessage"></p>
        <button id="reloadButton" type="button">다시 불러오기</button>
      </div>
    </section>
  </div>

  <script type="module">
    import * as THREE from 'three'

    window.THREE = THREE

    const XR8_ENGINE_URL =
      'https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js'

    const XR_EXTRAS_URL =
      'https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js'

    const WORLD_UP = new THREE.Vector3(0, 1, 0)
    const CENTER = new THREE.Vector2(0, 0)

    const HIT_TYPES = [
      'DETECTED_SURFACE',
      'ESTIMATED_SURFACE',
      'FEATURE_POINT',
    ]

    const state = {
      XR8: null,
      scene: null,
      camera: null,
      renderer: null,

      xrStarted: false,
      xrLoading: false,
      trackingStatus: 'INITIALIZING',
      trackingReason: null,
      cameraStatus: 'IDLE',

      latestHit: null,
      latestHitAt: 0,
      sampleTimer: 0,
      debugTimer: 0,

      artworkGroup: null,
      artworkMesh: null,
      artworkTexture: null,
      placeholderMesh: null,

      placement: null,

      adjustment: {
        yawDegrees: 0,
        horizontal: 0,
        vertical: 0,
        depth: 0.01,
        scale: 1,
      },
    }

    const canvas = document.querySelector('#camerafeed')
    const uiRoot = document.querySelector('#uiRoot')
    const statusElement = document.querySelector('#status')
    const reticleElement = document.querySelector('#reticle')
    const debugElement = document.querySelector('#debug')

    const imageInput = document.querySelector('#imageInput')
    const fileButton = document.querySelector('#fileButton')
    const placeButton = document.querySelector('#placeButton')
    const adjustButton = document.querySelector('#adjustButton')
    const resetButton = document.querySelector('#resetButton')
    const debugButton = document.querySelector('#debugButton')

    const adjustPanel = document.querySelector('#adjustPanel')
    const yawRange = document.querySelector('#yawRange')
    const horizontalRange = document.querySelector('#horizontalRange')
    const verticalRange = document.querySelector('#verticalRange')
    const depthRange = document.querySelector('#depthRange')
    const scaleRange = document.querySelector('#scaleRange')

    const yawOutput = document.querySelector('#yawOutput')
    const horizontalOutput = document.querySelector('#horizontalOutput')
    const verticalOutput = document.querySelector('#verticalOutput')
    const depthOutput = document.querySelector('#depthOutput')
    const scaleOutput = document.querySelector('#scaleOutput')

    const resetAdjustButton = document.querySelector('#resetAdjustButton')
    const hideAdjustButton = document.querySelector('#hideAdjustButton')
    const replaceButton = document.querySelector('#replaceButton')

    const errorPanel = document.querySelector('#errorPanel')
    const errorMessage = document.querySelector('#errorMessage')
    const reloadButton = document.querySelector('#reloadButton')

    function updateViewportHeight() {
      const height = Math.round(
        window.visualViewport?.height ?? window.innerHeight,
      )

      document.documentElement.style.setProperty(
        '--app-height',
        `${Math.max(1, height)}px`,
      )
    }

    function enforceLayerOrder() {
      canvas.style.setProperty('z-index', '0', 'important')
      uiRoot.style.setProperty('z-index', '2147483647', 'important')

      if (document.body.lastElementChild !== uiRoot) {
        document.body.appendChild(uiRoot)
      }
    }

    updateViewportHeight()
    enforceLayerOrder()

    window.addEventListener('resize', updateViewportHeight, {passive: true})
    window.visualViewport?.addEventListener(
      'resize',
      updateViewportHeight,
      {passive: true},
    )

    const bodyObserver = new MutationObserver(() => {
      requestAnimationFrame(enforceLayerOrder)
    })

    bodyObserver.observe(document.body, {childList: true})

    function setStatus(message) {
      statusElement.textContent = message
    }

    function showError(message) {
      errorMessage.textContent = message
      errorPanel.classList.add('visible')
      enforceLayerOrder()
    }

    function hideError() {
      errorPanel.classList.remove('visible')
    }

    function enableImageInput(enabled) {
      imageInput.disabled = !enabled
      fileButton.classList.toggle('disabled', !enabled)
    }

    function hitIsFresh() {
      return Boolean(
        state.latestHit &&
        performance.now() - state.latestHitAt < 900,
      )
    }

    function refreshInterface() {
      const placed = Boolean(state.placement)
      const hitReady = hitIsFresh()
      const placementAvailable = Boolean(state.camera)

      reticleElement.classList.toggle('ready', !placed && hitReady)
      reticleElement.classList.toggle(
        'searching',
        !placed && !hitReady && placementAvailable,
      )
      reticleElement.classList.toggle('placed', placed)

      placeButton.disabled = placed || !placementAvailable
      placeButton.hidden = placed
      adjustButton.hidden = !placed
    }

    function updateDebug(extra = {}) {
      const lines = [
        `XR8: ${window.XR8 ? 'READY' : 'WAIT'}`,
        `camera: ${state.cameraStatus}`,
        `tracking: ${state.trackingStatus}`,
        `reason: ${state.trackingReason || '-'}`,
        `hit: ${hitIsFresh() ? 'READY' : 'WAIT'}`,
        `hitType: ${state.latestHit?.type || '-'}`,
        `placed: ${state.placement ? 'YES' : 'NO'}`,
      ]

      for (const [key, value] of Object.entries(extra)) {
        lines.push(`${key}: ${value}`)
      }

      debugElement.textContent = lines.join('\n')
    }

    function loadScript(src, id, timeout = 25000) {
      return new Promise((resolve, reject) => {
        if (id && document.getElementById(id)) {
          resolve()
          return
        }

        const script = document.createElement('script')
        script.src = src
        script.async = true
        script.crossOrigin = 'anonymous'

        if (id) {
          script.id = id
        }

        const timeoutId = window.setTimeout(() => {
          reject(new Error(`스크립트 로딩 시간이 초과되었습니다.\n${src}`))
        }, timeout)

        script.addEventListener(
          'load',
          () => {
            window.clearTimeout(timeoutId)
            resolve()
          },
          {once: true},
        )

        script.addEventListener(
          'error',
          () => {
            window.clearTimeout(timeoutId)
            reject(new Error(`스크립트를 불러오지 못했습니다.\n${src}`))
          },
          {once: true},
        )

        document.head.appendChild(script)
      })
    }

    function loadXR8Engine() {
      return new Promise((resolve, reject) => {
        if (window.XR8) {
          resolve(window.XR8)
          return
        }

        let completed = false
        let pollId = null

        const timeoutId = window.setTimeout(() => {
          finishError(new Error('XR8 초기화 시간이 초과되었습니다.'))
        }, 30000)

        function cleanup() {
          window.clearTimeout(timeoutId)
          if (pollId !== null) {
            window.clearInterval(pollId)
          }
          window.removeEventListener('xrloaded', finishSuccess)
        }

        function finishSuccess() {
          if (completed || !window.XR8) {
            return
          }

          completed = true
          cleanup()
          resolve(window.XR8)
        }

        function finishError(error) {
          if (completed) {
            return
          }

          completed = true
          cleanup()
          reject(error)
        }

        window.addEventListener('xrloaded', finishSuccess)
        pollId = window.setInterval(finishSuccess, 100)

        const existing = document.querySelector(
          'script[data-xr8-engine="true"]',
        )

        if (existing) {
          finishSuccess()
          return
        }

        const script = document.createElement('script')
        script.src = XR8_ENGINE_URL
        script.async = true
        script.crossOrigin = 'anonymous'
        script.dataset.xr8Engine = 'true'
        script.setAttribute('data-preload-chunks', 'slam')

        script.addEventListener('load', finishSuccess, {once: true})
        script.addEventListener(
          'error',
          () => finishError(new Error('8th Wall XR 엔진을 불러오지 못했습니다.')),
          {once: true},
        )

        document.head.appendChild(script)
      })
    }

    function disposeMaterial(material) {
      if (!material) {
        return
      }

      if (Array.isArray(material)) {
        material.forEach(item => item.dispose())
      } else {
        material.dispose()
      }
    }

    function createPlaceholderMesh() {
      const group = new THREE.Group()

      const fillGeometry = new THREE.PlaneGeometry(0.6, 0.42)
      const fillMaterial = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.12,
        side: THREE.DoubleSide,
        depthWrite: false,
      })

      const fill = new THREE.Mesh(fillGeometry, fillMaterial)
      group.add(fill)

      const edges = new THREE.EdgesGeometry(fillGeometry)
      const lineMaterial = new THREE.LineBasicMaterial({
        color: 0x5df39b,
        transparent: true,
        opacity: 0.95,
      })

      const frame = new THREE.LineSegments(edges, lineMaterial)
      frame.position.z = 0.002
      group.add(frame)

      group.userData.dispose = () => {
        fillGeometry.dispose()
        fillMaterial.dispose()
        edges.dispose()
        lineMaterial.dispose()
      }

      return group
    }

    function ensureArtworkGroup() {
      if (!state.scene) {
        return null
      }

      if (!state.artworkGroup) {
        state.artworkGroup = new THREE.Group()
        state.artworkGroup.name = 'wall-artwork-group'
        state.artworkGroup.visible = false
        state.scene.add(state.artworkGroup)

        state.placeholderMesh = createPlaceholderMesh()
        state.artworkGroup.add(state.placeholderMesh)
      }

      return state.artworkGroup
    }

    async function createResizedImageCanvas(file) {
      const bitmap = await createImageBitmap(file)

      try {
        const maxTextureSize = 2048
        const ratio = Math.min(
          1,
          maxTextureSize / Math.max(bitmap.width, bitmap.height),
        )

        const width = Math.max(1, Math.round(bitmap.width * ratio))
        const height = Math.max(1, Math.round(bitmap.height * ratio))

        const output = document.createElement('canvas')
        output.width = width
        output.height = height

        const context = output.getContext('2d', {alpha: true})
        if (!context) {
          throw new Error('이미지 처리용 Canvas를 만들 수 없습니다.')
        }

        context.drawImage(bitmap, 0, 0, width, height)
        return output
      } finally {
        bitmap.close()
      }
    }

    function removeCurrentArtworkMesh() {
      if (state.artworkMesh) {
        state.artworkMesh.removeFromParent()
        state.artworkMesh.geometry?.dispose()
        disposeMaterial(state.artworkMesh.material)
        state.artworkMesh = null
      }

      if (state.artworkTexture) {
        state.artworkTexture.dispose()
        state.artworkTexture = null
      }
    }

    async function loadArtwork(file) {
      if (!state.scene) {
        throw new Error('AR 공간이 아직 준비되지 않았습니다.')
      }

      if (!file.type.startsWith('image/')) {
        throw new Error('이미지 파일만 선택할 수 있습니다.')
      }

      setStatus('이미지를 처리하는 중입니다.')
      removeCurrentArtworkMesh()

      const imageCanvas = await createResizedImageCanvas(file)
      const texture = new THREE.CanvasTexture(imageCanvas)
      texture.colorSpace = THREE.SRGBColorSpace
      texture.needsUpdate = true

      if (state.renderer) {
        texture.anisotropy = Math.min(
          8,
          state.renderer.capabilities.getMaxAnisotropy(),
        )
      }

      const widthMeters = 0.6
      const heightMeters = widthMeters * imageCanvas.height / imageCanvas.width

      const geometry = new THREE.PlaneGeometry(widthMeters, heightMeters)
      const material = new THREE.MeshBasicMaterial({
        map: texture,
        transparent: true,
        side: THREE.DoubleSide,
        toneMapped: false,
        depthTest: true,
        depthWrite: true,
      })

      const mesh = new THREE.Mesh(geometry, material)
      mesh.renderOrder = 10

      const group = ensureArtworkGroup()
      group.add(mesh)

      state.artworkMesh = mesh
      state.artworkTexture = texture

      if (state.placeholderMesh) {
        state.placeholderMesh.visible = false
      }

      if (state.placement) {
        setStatus('이미지를 불러왔습니다. 조정 슬라이더로 벽에 맞추세요.')
      } else {
        setStatus('벽의 원하는 위치를 화면 중앙에 맞춘 뒤 “여기에 배치”를 누르세요.')
      }
    }

    function scoreHit(hit) {
      switch (hit.type) {
        case 'DETECTED_SURFACE':
          return 30
        case 'ESTIMATED_SURFACE':
          return 20
        case 'FEATURE_POINT':
          return 10
        default:
          return 0
      }
    }

    function selectBestHit(hits) {
      if (!Array.isArray(hits)) {
        return null
      }

      const valid = hits.filter(hit => {
        const position = hit?.position
        const distance = hit?.distance

        return (
          position &&
          Number.isFinite(position.x) &&
          Number.isFinite(position.y) &&
          Number.isFinite(position.z) &&
          (!Number.isFinite(distance) || (distance >= 0.2 && distance <= 8))
        )
      })

      valid.sort((a, b) => {
        const typeDifference = scoreHit(b) - scoreHit(a)
        if (typeDifference !== 0) {
          return typeDifference
        }

        const aDistance = Number.isFinite(a.distance) ? a.distance : Infinity
        const bDistance = Number.isFinite(b.distance) ? b.distance : Infinity
        return aDistance - bDistance
      })

      return valid[0] || null
    }

    function sampleCenterHit(XR8) {
      if (state.placement || !state.camera) {
        return
      }

      let hits = []

      try {
        hits = XR8.XrController.hitTest(0.5, 0.5, HIT_TYPES) || []
      } catch (error) {
        try {
          hits = XR8.XrController.hitTest(0.5, 0.5) || []
        } catch (fallbackError) {
          console.warn('hitTest warning:', fallbackError)
        }
      }

      const selected = selectBestHit(hits)

      if (selected) {
        state.latestHit = selected
        state.latestHitAt = performance.now()
      } else if (performance.now() - state.latestHitAt > 900) {
        state.latestHit = null
      }

      refreshInterface()

      if (hitIsFresh()) {
        setStatus(
          `배치 위치 준비됨 · 약 ${getHitDistance().toFixed(2)}m · “여기에 배치”를 누르세요.`,
        )
      } else {
        setStatus('표면 거리를 찾는 중입니다. 지금 배치해도 기본 2m 거리에서 시작합니다.')
      }
    }

    function getFallbackPosition(distanceMeters = 2) {
      state.camera.updateMatrixWorld(true)

      const cameraPosition = new THREE.Vector3()
      const cameraDirection = new THREE.Vector3()

      state.camera.getWorldPosition(cameraPosition)
      state.camera.getWorldDirection(cameraDirection)

      return cameraPosition.addScaledVector(
        cameraDirection.normalize(),
        distanceMeters,
      )
    }

    function getHitPosition() {
      if (!state.latestHit) {
        return getFallbackPosition(2)
      }

      const position = state.latestHit.position
      return new THREE.Vector3(position.x, position.y, position.z)
    }

    function getHitDistance() {
      if (Number.isFinite(state.latestHit?.distance)) {
        return state.latestHit.distance
      }

      if (!state.camera || !state.latestHit) {
        return 0
      }

      const cameraPosition = new THREE.Vector3()
      state.camera.getWorldPosition(cameraPosition)
      return cameraPosition.distanceTo(getHitPosition())
    }

    function horizontalNormalTowardCamera(position) {
      state.camera.updateMatrixWorld(true)

      const cameraPosition = new THREE.Vector3()
      state.camera.getWorldPosition(cameraPosition)

      const normal = cameraPosition.sub(position)
      normal.y = 0

      if (normal.lengthSq() < 1e-8) {
        const cameraDirection = new THREE.Vector3()
        state.camera.getWorldDirection(cameraDirection)
        cameraDirection.y = 0
        normal.copy(cameraDirection).negate()
      }

      return normal.normalize()
    }

    function quaternionFromWallNormal(normal) {
      const right = new THREE.Vector3().crossVectors(WORLD_UP, normal)

      if (right.lengthSq() < 1e-8) {
        return new THREE.Quaternion()
      }

      right.normalize()
      const wallUp = new THREE.Vector3().crossVectors(normal, right).normalize()

      const matrix = new THREE.Matrix4().makeBasis(right, wallUp, normal)
      return new THREE.Quaternion().setFromRotationMatrix(matrix)
    }

    function resetAdjustmentValues() {
      state.adjustment.yawDegrees = 0
      state.adjustment.horizontal = 0
      state.adjustment.vertical = 0
      state.adjustment.depth = 0.01
      state.adjustment.scale = 1

      yawRange.value = '0'
      horizontalRange.value = '0'
      verticalRange.value = '0'
      depthRange.value = '0.01'
      scaleRange.value = '1'

      updateAdjustmentOutputs()
    }

    function updateAdjustmentOutputs() {
      yawOutput.value = `${Math.round(state.adjustment.yawDegrees)}°`
      horizontalOutput.value = `${state.adjustment.horizontal.toFixed(2)}m`
      verticalOutput.value = `${state.adjustment.vertical.toFixed(2)}m`
      depthOutput.value = `${state.adjustment.depth.toFixed(2)}m`
      scaleOutput.value = `${Math.round(state.adjustment.scale * 100)}%`
    }

    function applyArtworkTransform() {
      if (!state.placement || !state.artworkGroup) {
        return
      }

      const yawRadians = THREE.MathUtils.degToRad(
        state.adjustment.yawDegrees,
      )

      const adjustedNormal = state.placement.baseNormal
        .clone()
        .applyAxisAngle(WORLD_UP, yawRadians)
        .normalize()

      const adjustedRight = new THREE.Vector3()
        .crossVectors(WORLD_UP, adjustedNormal)
        .normalize()

      const position = state.placement.basePosition
        .clone()
        .addScaledVector(adjustedRight, state.adjustment.horizontal)
        .addScaledVector(WORLD_UP, state.adjustment.vertical)
        .addScaledVector(adjustedNormal, state.adjustment.depth)

      state.artworkGroup.position.copy(position)
      state.artworkGroup.quaternion.copy(
        quaternionFromWallNormal(adjustedNormal),
      )
      state.artworkGroup.scale.setScalar(state.adjustment.scale)
      state.artworkGroup.visible = true
    }

    function placeAtCurrentHit() {
      if (!state.camera) {
        setStatus('AR 카메라가 아직 준비되지 않았습니다.')
        return
      }

      const usingHit = hitIsFresh()
      const basePosition = usingHit
        ? getHitPosition()
        : getFallbackPosition(2)
      const baseNormal = horizontalNormalTowardCamera(basePosition)

      state.placement = {
        basePosition,
        baseNormal,
        hitType: usingHit ? state.latestHit.type : 'CAMERA_RAY_2M',
        distance: usingHit ? getHitDistance() : 2,
      }

      ensureArtworkGroup()
      resetAdjustmentValues()
      applyArtworkTransform()

      adjustPanel.classList.add('visible')
      refreshInterface()

      setStatus(
        usingHit
          ? '표면 거리를 기준으로 배치했습니다. 각도와 위치를 조절하세요.'
          : '기본 2m 거리에 배치했습니다. 앞뒤와 각도를 조절해 벽에 맞추세요.',
      )
    }

    function returnToPlacementMode() {
      state.placement = null
      state.latestHit = null
      state.latestHitAt = 0

      if (state.artworkGroup) {
        state.artworkGroup.visible = false
      }

      adjustPanel.classList.remove('visible')
      refreshInterface()
      setStatus('벽의 원하는 위치를 중앙 원에 맞춘 뒤 “여기에 배치”를 누르세요.')
    }

    function resetEverything() {
      returnToPlacementMode()
      resetAdjustmentValues()

      if (state.artworkMesh) {
        removeCurrentArtworkMesh()
      }

      if (state.placeholderMesh) {
        state.placeholderMesh.visible = true
      }

      try {
        state.XR8?.XrController?.recenter()
      } catch (error) {
        console.warn('recenter warning:', error)
      }

      setStatus('초기화했습니다. 이미지를 선택하고 벽을 중앙에 맞춰 주세요.')
    }

    function bindRange(range, property, parser = Number) {
      range.addEventListener('input', () => {
        state.adjustment[property] = parser(range.value)
        updateAdjustmentOutputs()
        applyArtworkTransform()
      })
    }

    bindRange(yawRange, 'yawDegrees')
    bindRange(horizontalRange, 'horizontal')
    bindRange(verticalRange, 'vertical')
    bindRange(depthRange, 'depth')
    bindRange(scaleRange, 'scale')

    function createApplicationPipelineModule(XR8) {
      return {
        name: 'wall-art-manual-adjust',

        onCameraStatusChange({status}) {
          state.cameraStatus = status || 'UNKNOWN'

          if (status === 'requesting') {
            setStatus('카메라 권한을 요청하는 중입니다.')
          } else if (status === 'hasStream') {
            setStatus('카메라를 시작하는 중입니다.')
          } else if (status === 'hasVideo') {
            setStatus('공간 추적을 시작합니다.')
          } else if (status === 'failed') {
            showError(
              '카메라를 시작하지 못했습니다.\n브라우저의 카메라 권한을 확인해 주세요.',
            )
          }
        },

        onStart() {
          const {scene, camera, renderer} = XR8.Threejs.xrScene()

          state.scene = scene
          state.camera = camera
          state.renderer = renderer

          ensureArtworkGroup()
          enableImageInput(true)
          enforceLayerOrder()
          updateViewportHeight()

          setStatus('이미지를 선택하고 벽의 원하는 위치를 화면 중앙에 맞춰 주세요.')
        },

        onAttach() {
          enforceLayerOrder()
        },

        onCanvasSizeChange() {
          updateViewportHeight()
          enforceLayerOrder()
        },

        onDeviceOrientationChange() {
          window.setTimeout(() => {
            updateViewportHeight()
            enforceLayerOrder()
          }, 120)
        },

        onUpdate({processCpuResult, processGpuResult}) {
          const reality = processCpuResult?.reality
          if (!reality) {
            return
          }

          state.trackingStatus = reality.trackingStatus || 'UNKNOWN'
          state.trackingReason = reality.trackingReason || null

          const now = performance.now()

          if (now - state.sampleTimer >= 180) {
            state.sampleTimer = now
            sampleCenterHit(XR8)
          }

          if (now - state.debugTimer >= 350) {
            state.debugTimer = now
            updateDebug({
              hitDistance: hitIsFresh() ? `${getHitDistance().toFixed(2)}m` : '-',
              worldPoints: reality.worldPoints?.length || 0,
              gpu: processGpuResult ? 'READY' : 'WAIT',
              yaw: `${state.adjustment.yawDegrees.toFixed(0)}°`,
              scale: `${state.adjustment.scale.toFixed(2)}x`,
            })
          }
        },

        onPaused() {
          state.latestHit = null
          refreshInterface()
          setStatus('카메라가 일시 중지되었습니다.')
        },

        onResume() {
          state.latestHit = null
          state.latestHitAt = 0
          refreshInterface()
          setStatus(
            state.placement
              ? '배치된 이미지를 확인하거나 위치 조정을 계속하세요.'
              : '벽의 원하는 위치를 화면 중앙에 맞춰 주세요.',
          )
        },

        onException(error) {
          console.error('XR pipeline error:', error)
          showError(
            'AR 실행 중 오류가 발생했습니다.\n페이지를 새로고침하고 카메라 권한을 확인해 주세요.',
          )
        },
      }
    }

    function startXR(XR8) {
      if (state.xrStarted) {
        return
      }

      state.xrStarted = true
      state.XR8 = XR8

      XR8.XrController.configure({
        disableWorldTracking: false,
        enableWorldPoints: true,
        enableLighting: false,
        scale: 'absolute',
      })

      const modules = [
        XR8.GlTextureRenderer.pipelineModule(),
        XR8.Threejs.pipelineModule(),
        XR8.XrController.pipelineModule(),
      ]

      if (window.XRExtras?.FullWindowCanvas?.pipelineModule) {
        modules.push(window.XRExtras.FullWindowCanvas.pipelineModule())
      }

      modules.push(createApplicationPipelineModule(XR8))

      XR8.addCameraPipelineModules(modules)

      XR8.run({
        canvas,
        allowedDevices: XR8.XrConfig.device().ANY,
      })
    }

    imageInput.addEventListener('change', async event => {
      const file = event.target.files?.[0]
      if (!file) {
        return
      }

      try {
        await loadArtwork(file)
      } catch (error) {
        console.error(error)
        setStatus(
          error instanceof Error
            ? error.message
            : '이미지를 불러오지 못했습니다.',
        )
      } finally {
        event.target.value = ''
      }
    })

    placeButton.addEventListener('click', placeAtCurrentHit)

    adjustButton.addEventListener('click', () => {
      adjustPanel.classList.add('visible')
    })

    hideAdjustButton.addEventListener('click', () => {
      adjustPanel.classList.remove('visible')
      setStatus('조정을 닫았습니다. 필요하면 “위치 조정”을 다시 누르세요.')
    })

    resetAdjustButton.addEventListener('click', () => {
      resetAdjustmentValues()
      applyArtworkTransform()
      setStatus('조정값을 처음 배치 상태로 되돌렸습니다.')
    })

    replaceButton.addEventListener('click', returnToPlacementMode)
    resetButton.addEventListener('click', resetEverything)

    debugButton.addEventListener('click', () => {
      debugElement.classList.toggle('visible')
    })

    reloadButton.addEventListener('click', () => {
      window.location.reload()
    })

    async function initialize() {
      if (state.xrLoading) {
        return
      }

      state.xrLoading = true
      hideError()
      enableImageInput(false)
      refreshInterface()

      try {
        if (!window.isSecureContext) {
          throw new Error(
            '카메라 사용에는 HTTPS 연결이 필요합니다.\nGitHub Pages HTTPS 주소에서 실행해 주세요.',
          )
        }

        setStatus('화면 모듈을 불러오는 중입니다.')

        try {
          await loadScript(XR_EXTRAS_URL, 'xrextras-script')
        } catch (error) {
          console.warn('XRExtras warning:', error)
        }

        setStatus('AR 추적 엔진을 불러오는 중입니다.')
        const XR8 = await loadXR8Engine()

        setStatus('AR 카메라를 시작하는 중입니다.')
        startXR(XR8)
      } catch (error) {
        console.error('Initialization error:', error)
        showError(
          error instanceof Error
            ? error.message
            : 'AR 초기화에 실패했습니다.',
        )
      } finally {
        state.xrLoading = false
      }
    }

    initialize()
  </script>
</body>
</html>
